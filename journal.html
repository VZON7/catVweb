let cpHue=240,cpSat=0.56,cpVal=0.93;
let cpDraggingSat=false,cpDraggingHue=false;
let cpSelectedClosest=null;

function cpHsvToRgb(h,s,v){
  const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60);
  const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].map(x=>Math.round(x*255));
}
function cpRgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join('');}
function cpHexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function cpRgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0,s=max===0?0:d/max,v=max;
  if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360;}
  return[h,s,v];
}
function cpColorDist(r1,g1,b1,r2,g2,b2){return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}
function cpFindClosest(r,g,b,n=3){
  return CP_CSS_COLORS.map(([hex,name])=>{const[cr,cg,cb]=cpHexToRgb(hex);return{hex:hex.toUpperCase(),name,dist:cpColorDist(r,g,b,cr,cg,cb)};}).sort((a,b)=>a.dist-b.dist).slice(0,n);
}

function cpDrawSatVal(){
  const cv=document.getElementById('cp-sat');const wrap=document.getElementById('cp-cv-wrap');
  if(!cv||!wrap)return;
  cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;
  const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;
  const gH=ctx.createLinearGradient(0,0,w,0);gH.addColorStop(0,'#fff');gH.addColorStop(1,`hsl(${cpHue},100%,50%)`);
  ctx.fillStyle=gH;ctx.fillRect(0,0,w,h);
  const gV=ctx.createLinearGradient(0,0,0,h);gV.addColorStop(0,'transparent');gV.addColorStop(1,'#000');
  ctx.fillStyle=gV;ctx.fillRect(0,0,w,h);
}

let cpPopupOpen=false;

function cpUpdateUI(skipHexInput=false){
  const[r,g,b]=cpHsvToRgb(cpHue,cpSat,cpVal);
  const hex=cpRgbToHex(r,g,b);
  const swatch=document.getElementById('cp-preview-swatch');
  if(!swatch)return;
  swatch.style.background=hex;
  if(!skipHexInput){const inp=document.getElementById('cp-hex-input');if(inp){inp.value=hex;inp.classList.remove('invalid');}}
  if(document.getElementById('cp-r'))document.getElementById('cp-r').textContent=r;
  if(document.getElementById('cp-g'))document.getElementById('cp-g').textContent=g;
  if(document.getElementById('cp-b'))document.getElementById('cp-b').textContent=b;
  const closest=cpFindClosest(r,g,b,3);
  const nameEl=document.getElementById('cp-color-name');if(nameEl)nameEl.textContent=closest[0].name;
  const listEl=document.getElementById('cp-closest-list');
  if(listEl)listEl.innerHTML=closest.map(c=>`<div class="cp-closest-item${cpSelectedClosest===c.hex?' cp-sel':''}" onclick="cpPickClosest('${c.hex}')"><div class="cp-closest-dot" style="background:${c.hex}"></div><span class="cp-closest-hex">${c.hex}</span><span class="cp-closest-name">${c.name}</span><span class="cp-closest-check">✓</span></div>`).join('');
  const dot=document.getElementById('cp-dot');const cvWrap=document.getElementById('cp-cv-wrap');
  if(dot&&cvWrap){dot.style.left=(cpSat*cvWrap.offsetWidth)+'px';dot.style.top=((1-cpVal)*cvWrap.offsetHeight)+'px';dot.style.background=hex;}
  const hueThumb=document.getElementById('cp-hue-thumb');const hueWrap=document.getElementById('cp-hue-wrap');
  if(hueThumb&&hueWrap){hueThumb.style.left=(cpHue/360*hueWrap.offsetWidth)+'px';hueThumb.style.background=`hsl(${cpHue},100%,50%)`;}
  cpDrawSatVal();
  if(modal)modal.color=hex;
  document.querySelectorAll('.cp-preset-dot').forEach(p=>{p.classList.toggle('sel',p.dataset.color===hex);});
  cpRenderMyPalette();
  // Update badge preview
  const badge=document.getElementById('cp-badge-preview');
  if(badge){
    const name=modal&&modal.name?modal.name:'Project / Task';
    badge.textContent=name||'Project';
    badge.style.color=hex;
    badge.style.borderColor=hex+'80';
    // Light background: hex with low opacity via rgba
    const[br,bg,bb]=cpHexToRgb(hex);
    badge.style.background=`rgba(${br},${bg},${bb},0.12)`;
  }
}

function cpPickClosest(hex){cpSelectedClosest=hex;cpSetFromHex(hex,true);}

function cpSetFromHex(hex,fromClosest=false){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex))return false;
  const[r,g,b]=cpHexToRgb(hex);[cpHue,cpSat,cpVal]=cpRgbToHsv(r,g,b);
  if(!fromClosest)cpSelectedClosest=null;
  cpUpdateUI();return true;
}

function cpInitPicker(initialColor){
  cpPopupOpen=false;
  const panel=document.getElementById('cp-picker-panel');
  if(panel)panel.classList.remove('open');
  cpSetFromHex(initialColor||'var(--c-select)');
  const presetsEl=document.getElementById('cp-presets');
  if(presetsEl){
    presetsEl.style.cssText='display:flex;align-items:center;gap:5px;flex-wrap:wrap';
    presetsEl.innerHTML='';
    COLORS.forEach(c=>{
      const d=document.createElement('div');

      d.onclick=()=>{cpSelectedClosest=null;cpSetFromHex(c);};
      presetsEl.appendChild(d);
    });
  }
  const cvWrap=document.getElementById('cp-cv-wrap');
  const hueWrap=document.getElementById('cp-hue-wrap');
  const hexInp=document.getElementById('cp-hex-input');
  if(cvWrap){
    cvWrap.addEventListener('mousedown',e=>{cpDraggingSat=true;cpGetSV(e,cvWrap);cpUpdateUI();});
    cvWrap.addEventListener('touchstart',e=>{cpDraggingSat=true;cpGetSV(e,cvWrap);cpUpdateUI();},{passive:true});
  }
  if(hueWrap){
    hueWrap.addEventListener('mousedown',e=>{cpDraggingHue=true;cpGetHue(e,hueWrap);cpUpdateUI();});
    hueWrap.addEventListener('touchstart',e=>{cpDraggingHue=true;cpGetHue(e,hueWrap);cpUpdateUI();},{passive:true});
  }
  if(hexInp){
    hexInp.addEventListener('input',()=>{
      let v=hexInp.value.trim();if(!v.startsWith('#'))v='#'+v;
      if(/^#[0-9a-fA-F]{6}$/.test(v)){
        hexInp.classList.remove('invalid');const[r,g,b]=cpHexToRgb(v);
        [cpHue,cpSat,cpVal]=cpRgbToHsv(r,g,b);cpSelectedClosest=null;cpUpdateUI(true);
      } else {hexInp.classList.add('invalid');}
    });
    hexInp.addEventListener('blur',()=>{hexInp.classList.remove('invalid');cpUpdateUI();});
  }
  // Close popup on outside click
  document.addEventListener('click',function cpOutsideClick(e){
    const popup=document.getElementById('cp-palette-popup');
    const btn=document.getElementById('cp-bag-btn');
    if(cpPopupOpen&&popup&&btn&&!popup.contains(e.target)&&!btn.contains(e.target)){cpClosePalettePopup();}
  });
}

function cpGetSV(e,wrap){
  const rect=wrap.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  cpSat=Math.max(0,Math.min(1,cx/rect.width));
  cpVal=Math.max(0,Math.min(1,1-cy/rect.height));
  cpSelectedClosest=null;
}
function cpGetHue(e,wrap){
  const rect=wrap.getBoundingClientRect();
  cpHue=Math.max(0,Math.min(359,(e.touches?e.touches[0].clientX:e.clientX)-rect.left)/rect.width*360);
  cpSelectedClosest=null;
}
document.addEventListener('mousemove',e=>{
  if(cpDraggingSat){const w=document.getElementById('cp-cv-wrap');if(w){cpGetSV(e,w);cpUpdateUI();}}
  if(cpDraggingHue){const w=document.getElementById('cp-hue-wrap');if(w){cpGetHue(e,w);cpUpdateUI();}}
});
document.addEventListener('touchmove',e=>{

      const s=bkStats(bkParsed);
      prev=`<div style="font-size:11px;font-weight:700;color:var(--purple);margin:10px 0 8px">${t('bk_preview')}：${s.projs} ${t('bk_projs')} · ${s.entries} ${t('bk_entries')} · ${s.days} ${t('bk_days')}</div>
      <div style="font-size:10px;font-weight:700;color:var(--mid);margin-bottom:6px">${t('bk_mode')}</div>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        ${['merge','replace'].map(m=>`<button onclick="bkSetMode('${m}')" style="flex:1;padding:6px 0;font-size:11px;font-weight:600;border:none;border-radius:999px;cursor:pointer;font-family:'Nunito',sans-serif;background:var(--lavender);color:${bkMode===m?'var(--purple)':'var(--mid)'};box-shadow:${bkMode===m?'inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light)':'2px 2px 5px var(--sh-dark), -2px -2px 5px var(--sh-light)'}">${m==='merge'?t('bk_merge'):t('bk_replace')}</button>`).join('')}
      </div>
      <div style="font-size:10px;color:var(--mid);margin-bottom:10px">🛡 ${t('bk_safe')}</div>
      <button class="m-save" style="width:100%;padding:8px 0;font-size:12px" onclick="bkRun()">${t('bk_do')}</button>`;
    }
    inner=`<div style="font-size:11px;color:var(--mid);line-height:1.6;margin:12px 0 8px">${t('bk_in_hint')}</div>
    <textarea id="bk-in" placeholder="{ ... }" oninput="bkCheck(this.value)" style="width:100%;height:100px;font-size:10px;font-family:monospace;resize:none;border:none;border-radius:10px;padding:8px 10px;background:var(--lavender);color:var(--dark);line-height:1.4;box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light)"></textarea>
    <input type="file" id="bk-file" accept=".json,application/json" style="display:none" onchange="bkReadFile(this)">
    <button class="m-cancel" style="width:100%;padding:7px 0;font-size:12px;margin-top:8px;box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light)" onclick="document.getElementById('bk-file').click()">${t('bk_pick_file')}</button>
    <div id="bk-msg" style="font-size:11px;color:var(--danger);margin-top:8px;display:none"></div>
    ${prev}`;
  }
  mc.innerHTML=`<div class="modal-bg" onmousedown="if(event.target===this)bkClose()">
  <div class="modal" style="width:330px">
    <div class="modal-title">${t('bk_title')}</div>
    <div style="display:flex;gap:6px">${tabBtn('out',t('bk_tab_out'))}${tabBtn('in',t('bk_tab_in'))}</div>
    ${inner}
    <div class="modal-btns"><button class="m-cancel" onclick="bkClose()">${t('bk_close')}</button></div>
  </div></div>`;
}
function bkClose(){document.getElementById('modal-container').innerHTML='';modal=null;bkParsed=null;}
function bkCopy(){
  const ta=document.getElementById('bk-out');ta.select();
  try{document.execCommand('copy');}catch(e){}
  if(navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});
  const b=document.getElementById('bk-copy-btn');if(b){b.textContent=t('bk_copied');setTimeout(()=>{if(b)b.textContent=t('bk_copy')},1600);}
}
function bkDownload(){
  const blob=new Blob([bkBuild()],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='catVweb-journal-'+dk(new Date())+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function bkReadFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const ta=document.getElementById('bk-in');if(ta)ta.value=r.result;bkCheck(r.result);};
  r.readAsText(f);
}
function bkCheck(txt){
  const msg=document.getElementById('bk-msg');
  bkParsed=null;
  if(!txt||!txt.trim()){if(msg)msg.style.display='none';renderBackupModal();return;}
  try{
    const o=JSON.parse(txt);
    const d=o&&o.app==='catVweb-journal'?o.data:(o&&o.entries?o:null);
    if(!d||typeof d.entries!=='object')throw 0;
    bkParsed={projects:d.projects||[],entries:d.entries||{},totalCoins:d.totalCoins||0,palette:d.palette||[]};
    const keep=txt;renderBackupModal();
    const ta=document.getElementById('bk-in');if(ta)ta.value=keep;
  }catch(e){
    if(msg){msg.textContent=t('bk_bad');msg.style.display='block';}
  }
}
function bkRun(){
  if(!bkParsed)return;
  // 1. 导入前自动备份当前数据
  try{localStorage.setItem('cj_backup_'+Date.now(),bkBuild());}catch(e){}
  const inc=bkParsed;
  if(bkMode==='replace'){
    projects=inc.projects;entries=inc.entries;totalCoins=inc.totalCoins;
    cpMyPalette=inc.palette;
  } else {
    // 合并：项目按 id 去重，记录按 id 去重
    const have=new Set(projects.map(p=>p.id));
    inc.projects.forEach(p=>{if(!have.has(p.id))projects.push(p)});
    Object.entries(inc.entries).forEach(([dkey,arr])=>{
      if(!Array.isArray(arr))return;
      if(!entries[dkey])entries[dkey]=[];
      const ids=new Set(entries[dkey].map(e=>e.id));
      arr.forEach(e=>{if(!ids.has(e.id))entries[dkey].push(e)});
    });
    totalCoins=Math.max(totalCoins,inc.totalCoins);
    inc.palette.forEach(c=>{if(!cpMyPalette.includes(c))cpMyPalette.push(c)});
  }
  localStorage.setItem('cj_mypalette',JSON.stringify(cpMyPalette));
  saveData();
  bkClose();
  view='journal';showForm=false;renderAll();
  const mc=document.getElementById('modal-container');
  const s=bkStats(inc);
  mc.innerHTML=`<div class="modal-bg" onmousedown="if(event.target===this)bkClose()">
  <div class="modal" style="width:280px">
    <div class="modal-title" style="color:var(--purple)">${t('bk_ok')}</div>
    <div style="font-size:12px;color:var(--mid);line-height:1.6;margin:6px 0 4px">${s.projs} ${t('bk_projs')} · ${s.entries} ${t('bk_entries')} · ${s.days} ${t('bk_days')}</div>
    <div class="modal-btns"><button class="m-save" onclick="bkClose()">${t('bk_close')}</button></div>
  </div></div>`;
}

document.getElementById('stats-nav-btn').onclick=()=>tryNavAway('stats');
document.getElementById('month-nav-btn').onclick=()=>tryNavAway('month');
document.getElementById('tracker-nav-btn').onclick=()=>tryNavAway('tracker');
document.getElementById('backup-nav-btn').onclick=()=>openBackupModal();
document.getElementById('add-proj-btn').onclick=openAddProject;
document.getElementById('prev-week').onclick=()=>{weekOffset--;renderAll()};
document.getElementById('next-week').onclick=()=>{if(weekOffset<0){weekOffset++;renderAll()}};
document.getElementById('cal-icon-btn').onclick=(e)=>{e.stopPropagation();openCalPicker()};

const d=new Date();
const _wd=t('weekdays')[d.getDay()];
const _dateStr=lang==='zh'
  ?d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+_wd+' · '+t('today')
  :_wd+', '+(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()+' · '+t('today');
document.getElementById('page-date').textContent=_dateStr;

renderAll();
document.addEventListener('keydown',e=>{
if(e.key===' '&&view==='tracker'&&window._trackerOpenId&&!e.target.matches('input,textarea,select,[contenteditable]')){e.preventDefault();window._trackerOpenId=null;renderTracker();}
if(e.key==='Shift')document.body.classList.add('shift-down');
});
document.addEventListener('keyup',e=>{if(e.key==='Shift')document.body.classList.remove('shift-down')});
window.addEventListener('blur',()=>document.body.classList.remove('shift-down'));
</script>
</body>
