<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Journal — catVweb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
<script>
// docx@7.x 在浏览器里把自己挂到全局 docx 变量（不是 window.docx）
// 统一包装到 window.docx 方便我们调用
window.addEventListener('load', function(){
  if(typeof docx !== 'undefined') window.docx = docx;
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,400;0,600;0,800;0,900;1,400&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --lavender:#E8EBF1;
  --dark:#2d2b3d; --mid:#888888;
  --pink:#E53935; --purple:#266ea7; --cyan:#42C6FF;
  --danger:#E53935;
  /* ── 阴影原料色（夜间模式切换层）── */
  --sh-dark:#C8C8D8; --sh-light:#FFFFFF;
  --sh-btn-dark:#B8BEC8; --sh-btn-hover:#B0B8C4; --sh-blue-inset:#1e5a8a;
  --sh-wr-dark:#c8cedb; --sh-wr-hover:#B2B7C4;
  --sh-cloth:#C0C8D8; --sh-light-soft:#F4F6FA;
  --sh-sel-out:#FBF7FF; --sh-sel-in:#C9B8DE; --sh-num-out:#F4FBF9; --sh-num-in:#B5D7CE;
  --line-dark:#C9D0DC; --line-light:#FFFFFF;
  /* ── 真白色（夜间不变）── */
  --white:#FFFFFF;
  /* ── 功能色 ── */
  --c-select:#7B68EE; --c-number:#1D9E75; --c-active:#1D9E75;
  --c-done:var(--purple); --c-archived:#A32D2D; --c-past-hint:#B87878;
  --c-note:#7FA4BE; --c-note-text:#9EA8B8;
  --c-pill-title:#A07850; --c-pill-body:#4E5568;
  --c-last:#9AA0A8; --c-muted:#666; --c-empty:#bbb; --c-faint:#aaa;
  --c-tint0:#2E6090; --c-tint1:#5887A8; --c-tint2:#7FA4BE; --c-tint3:#3A7A9C;
  --c-token-bg:#FAEEDA; --c-token-text:#633806; --c-token-alt:#854F0B;
  --c-coin-hint:#8A9BB0; --c-undo:#B0A8FF; --c-unit-hint:#C8CFD8;
  --cb-chip-bg:#f5f4f9; --cb-chip-hover:#eeedf4; --cb-sub-hover:#f0f0f0;
  --cb-radio:#6E7B96; --cb-multi:#5A6270; /* 选中填充，两主题同值 */
  --cloth-wash:rgba(180,190,210,0.55); --cloth-sheen:rgba(255,255,255,0.9);
  --cloth-wash-sm:rgba(180,190,210,0.45); --cloth-sheen-sm:rgba(255,255,255,0.85);
  --cal-sel-bg:rgba(255,255,255,0.9); --c-other-month:rgba(90,88,112,0.35);
  --badge-shade:rgba(0,0,0,.12); --badge-sheen:rgba(255,255,255,.5);
  --paper-shadow:0 1px 6px rgba(0,0,0,.08);
  --c-icon-idle:#C8C8D8; --c-icon-edit:#266ea7;
  color-scheme:light;
  /* ── 成品效果 ── */
  --neu-raised: 6px 6px 12px var(--sh-dark), -6px -6px 12px var(--sh-light);
  --neu-inset: inset 6px 6px 12px var(--sh-dark), inset -6px -6px 12px var(--sh-light);
  /* ── SVG 图标三态阴影 ── */
  --icon-shadow: drop-shadow(2.5px 2.5px 3px rgba(38,110,167,.6)) drop-shadow(-1.5px -1.5px 2px var(--sh-light));
  --icon-shadow-hover: drop-shadow(3.5px 3.5px 5px rgba(38,110,167,.8)) drop-shadow(-2px -2px 3px var(--sh-light));
  --icon-shadow-active: drop-shadow(.5px .5px 1px rgba(38,110,167,.3)) drop-shadow(-.5px -.5px .5px rgba(255,255,255,.7));
}
/* ── 夜间模式（方案A · 第176次）：只覆盖需要变的变量，强调色/状态色/真白色沿用亮色值 ── */
[data-theme="dark"] {
  --lavender:#2C2F38;
  --dark:#E6E9F0; --mid:#8B919E;
  --sh-dark:#202228; --sh-light:#3A3E48;
  --sh-btn-dark:#1D1F26; --sh-btn-hover:#1A1C23;
  --sh-wr-dark:#1F2129; --sh-wr-hover:#1B1D24;
  --sh-cloth:#1E2028; --sh-light-soft:#363A44;
  --sh-sel-out:#3A3948; --sh-sel-in:#232030;
  --sh-num-out:#323C39; --sh-num-in:#1E2825;
  --line-dark:#1F2128; --line-light:#3A3E48;
  --c-pill-body:#ABB2C0;
  --c-muted:#9299A6; --c-empty:#6B717E; --c-faint:#767D8A;
  --c-unit-hint:#6A7180;
  --c-token-bg:#3A342A; --c-token-text:#E5C285; --c-token-alt:#C99B54;
  --cb-chip-bg:#343842; --cb-chip-hover:#3A3E49; --cb-sub-hover:#383C46;
  --cloth-wash:rgba(0,0,0,0.38); --cloth-sheen:rgba(255,255,255,0.07);
  --cloth-wash-sm:rgba(0,0,0,0.30); --cloth-sheen-sm:rgba(255,255,255,0.06);
  --c-tint0:#7FA6C9; --c-tint1:#8FB4D1; --c-tint2:#A3C2D8; --c-tint3:#7FABC4;
  --c-archived:#C45050;
  --cal-sel-bg:rgba(0,0,0,0.25); --c-other-month:rgba(230,233,240,0.28);
  --badge-shade:rgba(0,0,0,.35); --badge-sheen:rgba(255,255,255,.08);
  --paper-shadow:0 2px 8px rgba(0,0,0,.35);
  --c-icon-idle:#767D8A; --c-icon-edit:#7FA6C9;
  color-scheme:dark;
  --icon-shadow: drop-shadow(2.5px 2.5px 3px rgba(0,0,0,.55)) drop-shadow(-1.5px -1.5px 2px var(--sh-light));
  --icon-shadow-hover: drop-shadow(3.5px 3.5px 5px rgba(0,0,0,.7)) drop-shadow(-2px -2px 3px var(--sh-light));
  --icon-shadow-active: drop-shadow(.5px .5px 1px rgba(38,110,167,.3)) drop-shadow(-.5px -.5px .5px rgba(255,255,255,.15));
}
[data-theme="dark"] .proj-badge { color:color-mix(in srgb, var(--pc) 55%, white); border-color:color-mix(in srgb, var(--pc) 55%, white); }
[data-theme="dark"] .page-title { filter:drop-shadow(2.5px 2.5px 3px rgba(0,0,0,.55)) drop-shadow(-1.5px -1.5px 2px var(--sh-light)); }
[data-theme="dark"] .page-title:hover { filter:drop-shadow(3.5px 3.5px 5px rgba(0,0,0,.7)) drop-shadow(-2px -2px 3px var(--sh-light)); }
[data-theme="dark"] .page-title:active { filter:drop-shadow(.5px .5px 1px rgba(38,110,167,.3)) drop-shadow(-.5px -.5px .5px rgba(255,255,255,.15)); }
[data-theme="dark"] .tracker-field-tag { color:#7FA6C9; }
body { background:var(--lavender); min-height:100vh; font-family:'Nunito',sans-serif; color:var(--dark); }

/* NAV */
#site-nav {
  position:fixed; top:0; left:0; right:0; height:52px;
  display:flex; align-items:center; justify-content:space-between; padding:0 28px;
  background:var(--lavender); box-shadow:0 4px 10px var(--sh-dark), 0 -2px 6px var(--sh-light);
  z-index:200;
}
.nav-logo { font-weight:800; font-size:15px; color:var(--dark); display:flex; align-items:center; gap:7px; text-decoration:none; }
.nav-pip { width:7px; height:7px; border-radius:50%; background:var(--purple); }
.nav-right { display:flex; align-items:center; gap:10px; }
.nav-back { font-size:13px; font-weight:600; color:var(--mid); text-decoration:none; background:var(--lavender); border:none; border-radius:999px; padding:6px 14px; box-shadow:var(--neu-raised); transition:box-shadow .15s; }
.nav-back:hover { box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); }
.coin-pill { display:flex; align-items:center; gap:5px; background:var(--c-token-bg); border:none; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; color:var(--c-token-text); box-shadow:var(--neu-raised); }

/* LAYOUT */
.page { padding:72px 0 60px; max-width:860px; margin:0 auto; padding-left:20px; padding-right:20px; }

/* HEADER */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.page-title { font-family:'ZCOOL XiaoWei',sans-serif; font-size:28px; color:var(--dark); cursor:pointer; display:inline-block; filter:drop-shadow(2.5px 2.5px 3px rgba(38,110,167,0.55)) drop-shadow(-1.5px -1.5px 2px var(--sh-light)); transition:filter .15s, color .15s; }
.page-title:hover { color:var(--purple); filter:drop-shadow(3.5px 3.5px 5px rgba(38,110,167,0.75)) drop-shadow(-2px -2px 3px var(--sh-light)); }
.page-title:active { filter:drop-shadow(0.5px 0.5px 1px rgba(38,110,167,0.3)) drop-shadow(-0.5px -0.5px 0.5px rgba(255,255,255,0.7)); }
.page-date { font-size:12px; color:var(--mid); margin-top:4px; }
.journal-date-hdr { font-size:13px; font-weight:700; color:var(--purple); letter-spacing:.03em; padding:6px 0 4px; margin-bottom:4px; display:inline-block; border-bottom:1px solid var(--line-dark); box-shadow:0 1px 0 var(--line-light); }
.new-btn { display:flex; align-items:center; gap:6px; background:var(--purple); color:#fff; border:none; border-radius:999px; padding:10px 22px; font-size:14px; font-weight:800; cursor:pointer; font-family:'Nunito',sans-serif; box-shadow:5px 5px 10px var(--sh-btn-dark), -5px -5px 10px var(--sh-light); transition:box-shadow .15s; }
.new-btn:hover { box-shadow:10px 10px 18px var(--sh-btn-hover), -10px -10px 18px var(--sh-light); }
.new-btn:active { box-shadow:inset 4px 4px 9px var(--sh-blue-inset), inset -2px -2px 5px rgba(255,255,255,0.15); }

/* STATS */
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
.stat-card { background:var(--lavender); border:none; border-radius:20px; padding:16px 14px; text-align:center; box-shadow:var(--neu-raised); }
.stat-n { font-family:'Lilita One',cursive; font-size:28px; color:var(--purple); }
.stat-l { font-size:11px; color:var(--mid); margin-top:4px; }

/* TWO-COL LAYOUT */
.main-layout { display:grid; grid-template-columns:200px 1fr; gap:16px; }
@media(max-width:600px){ .main-layout { grid-template-columns:1fr; } }

/* SIDEBAR */
.sidebar { background:var(--lavender); border:none; border-radius:20px; padding:16px; height:fit-content; box-shadow:var(--neu-inset); }
.sb-label { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); margin-bottom:0; }
.week-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.week-range { font-size:11px; font-weight:600; color:var(--dark); }
/* 左右箭头 — 实心填充箭头，蓝色，drop-shadow 贴合 */
.wnav-btn { background:none; border:none; cursor:pointer; padding:3px 4px; display:flex; align-items:center; justify-content:center; filter:var(--icon-shadow); transition:filter .15s; }
.wnav-btn:hover { filter:var(--icon-shadow-hover); }
.wnav-btn:active { filter:var(--icon-shadow-active); }
/* 日历图标 — 无方框，SVG线条，蓝色 drop-shadow */
.cal-icon-btn { background:none; border:none; cursor:pointer; padding:3px 4px; display:flex; align-items:center; justify-content:center; filter:var(--icon-shadow); transition:filter .15s; }
.cal-icon-btn:hover { filter:var(--icon-shadow-hover); }
.cal-icon-btn:active { filter:var(--icon-shadow-active); }
/* 本周标题行：文字和日期同一行 */
.week-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.week-header-row .sb-label { margin-bottom:0; }
.week-header-row .week-range { font-size:11px; font-weight:600; color:var(--mid); }
/* day-item — 凹陷容器内，hover 轻凸起，active 凹陷，selected 凹陷 */
.day-item { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:10px; cursor:pointer; margin-bottom:2px; transition:box-shadow .15s; }
.day-item:hover { box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); }
.day-item.active { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }
.day-dot { width:5px; height:5px; border-radius:50%; background:rgba(38,110,167,0.2); flex-shrink:0; }
.day-dot.has { background:var(--purple); }
.day-name { font-size:12px; color:var(--mid); flex:1; }
.day-item.active .day-name { color:var(--purple); font-weight:700; }
.day-cnt { font-size:10px; color:var(--mid); }
/* 雕刻分隔线 */
.sb-divider { border:none; border-top:1px solid var(--line-dark); border-bottom:1px solid var(--line-light); margin:10px 0; }
.proj-item { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:10px; cursor:pointer; margin-bottom:2px; transition:box-shadow .15s; user-select:none; position:relative; }
.proj-item:hover { box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); }
.proj-item:active { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }
.proj-item.dragging { opacity:.35; }
.proj-item.drag-over { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }
.proj-drag-handle { font-size:13px; color:var(--mid); opacity:.3; cursor:grab; flex-shrink:0; padding:0 1px; line-height:1; }
.proj-drag-handle:hover { opacity:.7; }
.proj-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.proj-name { font-size:12px; color:var(--mid); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.proj-item:hover .proj-tooltip { display:block; }
.proj-tooltip { display:none; position:absolute; left:calc(100% + 6px); top:50%; transform:translateY(-50%); background:var(--dark); color:#fff; font-size:11px; font-weight:500; padding:4px 10px; border-radius:7px; white-space:nowrap; z-index:50; pointer-events:none; font-family:'Nunito',sans-serif; }
.proj-tooltip::before { content:''; position:absolute; right:100%; top:50%; transform:translateY(-50%); border:5px solid transparent; border-right-color:var(--dark); }
.proj-cnt { font-size:10px; color:var(--mid); }
.add-proj-btn { display:flex; align-items:center; gap:5px; width:100%; padding:6px 7px; border-radius:10px; border:none; background:var(--lavender); color:var(--purple); font-size:12px; font-weight:700; font-family:'Nunito',sans-serif; cursor:pointer; margin-top:6px; box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); transition:box-shadow .15s; }
.add-proj-btn:hover { box-shadow:4px 4px 9px var(--sh-dark), -4px -4px 9px var(--sh-light); }
.add-proj-btn:active { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }
.sb-nav-btn { display:flex; align-items:center; gap:6px; width:100%; padding:7px 9px; border-radius:10px; border:none; background:var(--lavender); color:var(--mid); font-size:12px; font-family:'Nunito',sans-serif; cursor:pointer; margin-top:4px; box-shadow:none; transition:box-shadow .15s; }
.sb-nav-btn:hover { box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); color:var(--dark); }
.sb-nav-btn:active { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }
.sb-nav-btn.active { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); color:var(--purple); font-weight:700; }

/* MAIN AREA */
.main-area { min-height:400px; }
.sec-label { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); margin-bottom:8px; margin-top:4px; display:flex; align-items:center; gap:6px; }
.sec-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ENTRY CARD */
.entry-card { background:var(--lavender); border:none; border-radius:14px; margin-bottom:10px; box-shadow:var(--neu-raised); transition:box-shadow .15s; }
.entry-card:hover { box-shadow:8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light); }
.entry-card.editing { box-shadow:inset 6px 6px 12px var(--sh-dark), inset -6px -6px 12px var(--sh-light); }
.ec-inner { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; }
.proj-badge-wrap { display:inline-block; background:var(--lavender); padding:4px; border-radius:999px; box-shadow:4px 4px 9px var(--sh-dark), -4px -4px 9px var(--sh-light); flex-shrink:0; margin-top:1px; }
.proj-badge { display:flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:10px; font-weight:700; white-space:nowrap; color:var(--pc); border:1.5px solid var(--pc); box-shadow:inset 1.5px 1.5px 3px var(--badge-shade), inset -1px -1px 2px var(--badge-sheen); }
.ec-body { flex:1; min-width:0; }
.ec-title { font-size:13px; font-weight:700; color:var(--dark); line-height:1.4; }
.ec-meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:5px; }
.ec-field { font-size:11px; color:var(--mid); display:flex; align-items:center; gap:3px; }
.ec-selval { font-size:10px; padding:2px 8px; border-radius:999px; background:var(--lavender); box-shadow:inset 2px 2px 4px var(--sh-dark), inset -2px -2px 4px var(--sh-light-soft); font-weight:550; }
.ec-selval-f0 { color:var(--c-tint0); }
.ec-selval-f1 { color:var(--c-tint1); }
.ec-selval-f2 { color:var(--c-tint2); }
.ec-selval-f3 { color:var(--c-tint3); }
.ec-vdivider { width:0; height:14px; flex-shrink:0; align-self:center; border-left:1px solid var(--line-dark); border-right:1px solid var(--line-light); }
.ec-note { font-size:11px; font-style:italic; color:var(--c-note-text); margin-top:6px; line-height:1.5; display:flex; align-items:flex-start; gap:5px; }
.ec-note-icon { flex-shrink:0; margin-top:1px; color:var(--c-tint2); }
.ec-coin { font-size:10px; color:var(--c-tint0); background:var(--lavender); border-radius:999px; padding:4px 14px; white-space:nowrap; flex-shrink:0; font-weight:700; box-shadow:4px 4px 10px var(--sh-cloth), -4px -4px 10px var(--sh-light), inset 0 3px 8px var(--cloth-wash), inset 0 -1px 3px var(--cloth-sheen); }
.ec-acts { display:flex; gap:6px; flex-shrink:0; align-items:center; }
.ec-act { background:none; border:none; color:var(--mid); cursor:pointer; padding:3px; display:flex; align-items:center; justify-content:center; transition:color .15s, filter .15s; filter:drop-shadow(1.5px 1.5px 2px rgba(0,0,0,0.12)); }
.ec-edit:hover { color:var(--purple); filter:drop-shadow(2px 2px 3px rgba(38,110,167,.5)); }
.ec-del:hover { color:var(--purple); filter:drop-shadow(2px 2px 3px rgba(38,110,167,.5)); }
body.shift-down .ec-del:hover { color:var(--danger); filter:drop-shadow(2px 2px 3px rgba(229,57,53,.5)); }

/* INLINE EDIT */
.inline-edit { padding:0 14px 12px; }
.ie-title input, .ie-title textarea { width:100%; font-size:13px; font-weight:700; margin-bottom:8px; font-family:'Nunito',sans-serif; background:var(--lavender); border:none; border-radius:10px; padding:8px 12px; color:var(--dark); box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); resize:none; overflow:hidden; line-height:1.5; }
.ie-var-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.ie-var-label { font-size:12px; color:var(--mid); min-width:72px; flex-shrink:0; }
.ie-var-val { flex:1; position:relative; }
.weekly-btn { box-shadow:4px 4px 9px var(--sh-wr-dark), -4px -4px 9px var(--sh-light); }
.weekly-btn:hover { box-shadow:8px 8px 18px var(--sh-wr-hover), -8px -8px 18px var(--sh-light); }
.weekly-btn:active { box-shadow:inset 3px 3px 7px var(--sh-wr-dark), inset -3px -3px 7px var(--sh-light); }
.ie-skip-btn { width:26px; height:26px; border-radius:50%; border:none; background:var(--lavender); color:var(--mid); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); transition:box-shadow .15s, color .15s; }
.ie-skip-btn:hover { color:var(--pink); }
.ie-skip-btn.skipped { color:var(--pink); box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }
.skipped-label { font-size:12px; color:var(--mid); font-style:italic; padding:0 8px; }
.ie-extras { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }

.ftype-btn:hover { box-shadow:4px 4px 9px var(--sh-dark), -4px -4px 9px var(--sh-light); }

.m-delete:hover { box-shadow:3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light); }
.m-delete:active { box-shadow:inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light); }

.empty-hint { text-align:center; padding:2.5rem 0; color:var(--mid); font-size:13px; }

/* ── project 未选时的抖动提示 ── */

}

function proj(id){return projects.find(p=>p.id===id)||{name:'?',color:'#888',fields:[]}}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(',')}

function calcCoins(e, dateKeyForEntry){
  // base 1: has title = logged something
  let c=(e.title&&e.title.trim())?1:0;
  // note +1: reflection
  if(e.note&&e.note.trim())c+=1;
  // link +1: reference
  if(e.link&&e.link.trim())c+=1;
  // past date x0.5: encourage same-day logging
  if(dateKeyForEntry && dateKeyForEntry !== todayKey) c=Math.max(1, Math.floor(c/2));
  return c;
}

function recalcTotalCoins(){
  totalCoins=Object.entries(entries).reduce((s,[k,arr])=>s+arr.reduce((ss,e)=>ss+calcCoins(e,k),0),0);
}

function getWeekStart(){
  const d=new Date(today);
  d.setDate(d.getDate()-d.getDay()+(weekOffset*7));
  d.setHours(0,0,0,0);return d;
}

function cbGetGroupColors(vi){
  const pal=CB_PALETTES[window._cbColorMode||'warm']||CB_PALETTES.warm;
  return pal[vi%pal.length];
}
function cbGetStops(stops,n){
  if(n===1)return[stops[2]];
  if(n===2)return[stops[1],stops[3]];
  if(n===3)return[stops[1],stops[2],stops[3]];
  if(n===4)return[stops[0],stops[1],stops[3],stops[4]];
  return stops.slice(0,n);
}

// 移除所有 emoji，避免 docx.js TextRun 报错（唯一来源）

function getCBState(pid){

    chartType:'stacked',varKeys:[],showNums:false,showTitles:true,showPanel:true,

// ── Plugins ───────────────────────────────────────────────────────
const CB_NumPlugin={id:'cbNumPlugin',afterDatasetsDraw(ch){
  if(!ch._cbNums)return;
  const ctx=ch.ctx;
  ch.data.datasets.forEach((ds,di)=>{
    const meta=ch.getDatasetMeta(di);
    meta.data.forEach((bar,i)=>{
      const v=ds.data[i];if(!v)return;
      const{x,y,base}=bar;const h=Math.abs(base-y);if(h<14)return;
      ctx.save();ctx.font='10px sans-serif';
      ctx.fillStyle='rgba(100,100,100,0.55)';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v,x,(y+base)/2);ctx.restore();
    });
  });
}};

let _cbLabelHits={};
const CB_TitlePlugin={id:'cbTitlePlugin',afterDatasetsDraw(ch){
  if(!ch._cbTitles)return;
  const pid=ch._cbPid;
  const s=getCBState(pid);
  _cbLabelHits[pid]=[];
  const ctx=ch.ctx;const ca=ch.chartArea;
  const allMetas=ch.data.datasets.map((_,i)=>ch.getDatasetMeta(i));
  const dates=s._dates||[];
  dates.forEach((_,i)=>{
    let topY=Infinity,topX=null;
    allMetas.forEach(m=>{if(m.data[i]){const{y,x}=m.data[i];if(y<topY){topY=y;topX=x;}}});
    if(topY===Infinity||!topX)return;
    const rawTitle=s._titles&&s._titles[i]||'';
    const title=s.displayTitles[i]!==undefined?s.displayTitles[i]:rawTitle;
    if(!title)return;
    ctx.save();ctx.font='10px sans-serif';
    const maxW=72;
    const parts=title.split(/(?=[/(])/);
    const lineArr=[];let cur='';
    for(const p of parts){
      const test=cur+p;
      if(ctx.measureText(test).width>maxW&&cur){lineArr.push(cur);cur=p;}else cur=test;
    }
    if(cur)lineArr.push(cur);
    const lineH=12,pad=4;
    const boxW=Math.min(maxW,Math.max(...lineArr.map(l=>ctx.measureText(l).width)))+8;
    const boxH=lineArr.length*lineH+pad*2;
    let bx=topX-boxW/2;
    bx=Math.max(ca.left+2,Math.min(ca.right-boxW-2,bx));
    const by=Math.max(ca.top+2,topY-boxH-6);
    ctx.fillStyle=theme==='dark'?'rgba(44,47,56,0.95)':'rgba(255,255,255,0.97)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,boxW,boxH,4);else ctx.rect(bx,by,boxW,boxH);
    ctx.fill();ctx.strokeStyle=theme==='dark'?'rgba(255,255,255,0.12)':'rgba(0,0,0,0.12)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=theme==='dark'?'#C8CDD6':'#333';ctx.textAlign='left';ctx.textBaseline='top';
    lineArr.forEach((l,li)=>ctx.fillText(l,bx+4,by+pad+li*lineH));
    ctx.restore();
    _cbLabelHits[pid].push({i,bx,by,bw:boxW,bh:boxH});
  });
}};

const CB_DonutPlugin={id:'cbDonutPlugin',afterDatasetsDraw(ch){
  if(!ch._cbDonutNums)return;
  const ctx=ch.ctx;const mode=ch._cbDonutMode||'direct';
  const pid=ch._cbPid;const s=getCBState(pid);
  const cx=(ch.chartArea.left+ch.chartArea.right)/2;
  const cy=(ch.chartArea.top+ch.chartArea.bottom)/2;
  const CW=ch.canvas.width,CH=ch.canvas.height;
  const PAD=8,LINE_H=13,HLEN=24;

  function measureW(t){ctx.font="10px 'Nunito',sans-serif";return ctx.measureText(t).width;}

  function maxBoxW(angle,outerR,ext){
    const isRight=Math.cos(angle)>=0;
    const tipX=cx+Math.cos(angle)*(outerR+ext);
    if(isRight)return Math.max(55,CW-PAD-tipX-HLEN-6);
    else return Math.max(55,tipX-HLEN-6-PAD);
  }

  function wrapText(text,maxW){
    const words=text.split(/\s+/);
    if(words.length<=1){
      if(measureW(text)<=maxW)return[text];
      let cut=text.length;
      while(cut>1&&measureW(text.slice(0,cut))>maxW)cut--;
      return[text.slice(0,cut)];
    }
    const lines=[];let line='';
    words.forEach(w=>{
      const test=line?line+' '+w:w;
      if(measureW(test)>maxW&&line){lines.push(line);line=w;}else line=test;
    });
    if(line)lines.push(line);
    return lines;
  }

  const allItems=[];
  ch.data.datasets.forEach((ds,di)=>{
    const meta=ch.getDatasetMeta(di);
    const total=ds.data.reduce((a,b)=>a+b,0);
    let dsLabels=[];
    if(s._varKeys&&s._varKeys[di]){
      const vk=s._varKeys[di];
      const vd=s._varData&&s._varData[vk];
      if(vd){
        if(vd.type==='number'){const vi2=s._vars&&s._vars.find(v=>v.key===vk);dsLabels=[vi2?vi2.label:vk];}
        else dsLabels=vd.options||[];
      }
    }
    const colorArr=cbGetStops(cbGetGroupColors(di),ds.data.length);
    meta.data.forEach((arc,i)=>{
      const v=ds.data[i];if(!v)return;
      const pct=Math.round(v/total*100);
      const angle=(arc.startAngle+arc.endAngle)/2;
      const span=arc.endAngle-arc.startAngle;
      const col=colorArr[i%colorArr.length];
      if(mode==='direct'){
        if(span<0.3)return;
        const r=(arc.outerRadius+arc.innerRadius)/2;
        ctx.save();ctx.font='500 10px sans-serif';
        ctx.fillStyle=theme==='dark'?'rgba(255,255,255,.55)':'rgba(255,255,255,.65)';ctx.textAlign='center';ctx.textBaseline='middle';
        const cntLabel=lang==='en'?('x'+v):(v+t('cb_unit_suffix'));
        ctx.fillText(cntLabel+'('+pct+'%)',cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);ctx.restore();
      } else {
        if(span<0.12)return;
        const name=dsLabels[i]||'';
        const isRight=Math.cos(angle)>=0;
        const outerR=arc.outerRadius;
        const initMaxW=maxBoxW(angle,outerR,28);
        const nameLines=wrapText(name,initMaxW);
        const pctLine=(lang==='en'?('x'+v):(v+t('cb_unit_suffix')))+' ('+pct+'%)';
        const allLines=[...nameLines,pctLine];
        const boxW=Math.max(...allLines.map(l=>measureW(l)))+10;
        const boxH=allLines.length*LINE_H+4;
        // byOffset: 额外的垂直偏移（用于同侧碰撞推移）
        allItems.push({arc,v,pct,col,name,angle,span,outerR,
          isRight,allLines,boxW,boxH,ext:28,byOffset:0});
      }
    });
  });
  if(mode==='direct')return;

  function getPos(it){
    const tipX=cx+Math.cos(it.angle)*(it.outerR+it.ext);
    const tipY=cy+Math.sin(it.angle)*(it.outerR+it.ext);
    const endX=tipX+(it.isRight?HLEN:-HLEN);
    const bx=it.isRight?endX+3:endX-it.boxW-3;
    const by=tipY-it.boxH/2+it.byOffset;
    return{tipX,tipY,endX,bx,by};
  }

  function wouldExceed(it,addExt){
    const p=getPos({...it,ext:it.ext+addExt});
    if(it.isRight&&p.bx+it.boxW>CW-PAD)return true;
    if(!it.isRight&&p.bx<PAD)return true;
    if(p.by<PAD||p.by+it.boxH>CH-PAD)return true;
    return false;
  }

  function overlaps(a,b){
    const pa=getPos(a),pb=getPos(b);
    const M=3;
    return!(pa.bx>pb.bx+b.boxW+M||pa.bx+a.boxW+M<pb.bx||
            pa.by>pb.by+b.boxH+M||pa.by+a.boxH+M<pb.by);
  }

  for(let pass=0;pass<15;pass++){
    let any=false;
    for(let a=0;a<allItems.length;a++){
      for(let b=a+1;b<allItems.length;b++){
        if(!overlaps(allItems[a],allItems[b]))continue;
        any=true;
        const ta=allItems[a],tb=allItems[b];
        const pa=getPos(ta),pb=getPos(tb);
        // 同侧碰撞：把 by 较大（位置较低）的那个往下推
        if(ta.isRight===tb.isRight){
          const target=pa.by>=pb.by?ta:tb;
          const newBy=target.byOffset+LINE_H;
          const testPos=getPos({...target,byOffset:newBy});
          if(testPos.by+target.boxH<=CH-PAD)target.byOffset=newBy;
        } else {
          // 不同侧不会真正重叠，拉长线处理
          if(ta.ext<=tb.ext&&!wouldExceed(ta,12))ta.ext+=12;
          else if(!wouldExceed(tb,12))tb.ext+=12;
          else if(!wouldExceed(ta,12))ta.ext+=12;
        }
      }
    }
    if(!any)break;
  }

  // 绘制前用最终 ext 重算换行
  allItems.forEach(it=>{
    const mxW=maxBoxW(it.angle,it.outerR,it.ext);
    const nameLines=wrapText(it.name,mxW);
    const pctLine=(lang==='en'?('x'+it.v):(it.v+t('cb_unit_suffix')))+' ('+it.pct+'%)';
    it.allLines=[...nameLines,pctLine];
    it.boxW=Math.max(...it.allLines.map(l=>measureW(l)))+10;
    it.boxH=it.allLines.length*LINE_H+4;
  });

  allItems.forEach(it=>{
    const{arc,angle,col,isRight,allLines,boxW,boxH,outerR}=it;
    const{tipX,tipY,endX,bx,by}=getPos(it);
    const midR=(outerR+arc.innerRadius)/2;
    const p0x=cx+Math.cos(angle)*midR,p0y=cy+Math.sin(angle)*midR;
    const p1x=cx+Math.cos(angle)*(outerR+3),p1y=cy+Math.sin(angle)*(outerR+3);
    ctx.save();
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p0x,p0y);ctx.lineTo(p1x,p1y);ctx.lineTo(tipX,tipY);ctx.lineTo(endX,tipY);ctx.stroke();
    ctx.fillStyle=theme==='dark'?'rgba(44,47,56,0.95)':'rgba(255,255,255,0.96)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,boxW,boxH,3);else ctx.rect(bx,by,boxW,boxH);
    ctx.fill();ctx.strokeStyle=col+'44';ctx.lineWidth=0.5;ctx.stroke();
    ctx.textAlign=isRight?'left':'right';ctx.textBaseline='top';
    const tx=isRight?bx+4:bx+boxW-4;
    allLines.forEach((line,li)=>{
      const isLast=li===allLines.length-1;
      ctx.font=isLast?"500 10px 'Nunito',sans-serif":"10px 'Nunito',sans-serif";
      ctx.fillStyle=isLast?(theme==='dark'?'#8B919E':'#999'):col;
      ctx.fillText(line,tx,by+2+li*LINE_H);
    });
    ctx.restore();
  });
}}
const CB_BgPlugin={id:'cbBg',beforeDraw(ch){
  const ctx=ch.ctx;ctx.save();
  ctx.fillStyle=theme==='dark'?'#2C2F38':'#fff';
  ctx.fillRect(0,0,ch.width,ch.height);
  ctx.restore();
}};
Chart.register(CB_NumPlugin,CB_TitlePlugin,CB_DonutPlugin,CB_BgPlugin);

// ── Get data for a variable key ───────────────────────────────────
function cbGetVarData(pid,varKey,pe,p){
  const counts={};
  if(varKey==='_date'){
    pe.forEach(e=>{const parts=e.dateKey.split('-');const lbl=parts[1]+'/'+parts[2]+'/'+parts[0];counts[lbl]=(counts[lbl]||0)+1;});
  } else if(varKey==='_title'){
    pe.forEach(e=>{if(!e.title||!e.title.trim())return;const lbl=e.title.trim();counts[lbl]=(counts[lbl]||0)+1;});
  } else {
    const f=(p.fields||[]).find(x=>x.id===varKey);
    pe.forEach(e=>{
      if(e.skipped&&e.skipped[varKey])return;
      const v=e.fields&&e.fields[varKey];if(!v)return;
      String(v).split(',').map(x=>x.trim()).filter(Boolean).forEach(val=>{counts[val]=(counts[val]||0)+1;});
    });
  }
  return counts;
}

  return `
    <div class="cb-step-lbl">${t('cb_vars')} variable${t('cb_multi')}</div>

function initChartBuilder(pid,p,pe){
  const s=getCBState(pid);
  // Only show actual project fields (no _date, no _title in selector)
  const vars=[];
  (p.fields||[]).forEach(f=>{
    if(f.type==='number'&&f.units&&f.units.length>1){
      f.units.forEach(u=>vars.push({key:f.id+'::'+u,label:f.label+' ('+u+')',field:f,unit:u}));
    } else {
      vars.push({key:f.id,label:f.label,field:f});
    }
  });
  s._vars=vars;s._pe=pe;s._p=p;
  // X axis = sorted dates
  s._dates=[...new Set(pe.map(e=>e.dateKey))].sort();
  // titles per date (first entry of that day)
  s._titles=s._dates.map(dk=>{
    const dayEntries=(entries[dk]||[]).filter(e=>e.projId===p.id);
    const t=dayEntries.find(e=>e.title&&e.title.trim());
    return t?t.title.trim():'';
  });
  // Precompute per-field data
  s._varData={};
  vars.forEach(v=>{
    const f=v.field;
    if(f&&f.type==='number'){
      // number: sum per date. If v.unit is set, only sum that unit's values (split mode).
      const perDate={};
      s._dates.forEach(dk=>{
        const dayEntries=(entries[dk]||[]).filter(e=>e.projId===p.id);
        let total=0;
        dayEntries.forEach(e=>{
          if(e.skipped&&e.skipped[f.id])return;
          const val=e.fields&&e.fields[f.id];
          if(val===undefined||val==='')return;
          if(Array.isArray(val)){
            val.forEach(o=>{
              if(v.unit&&o.unit!==v.unit)return;
              const n=parseFloat(o.val);if(!isNaN(n))total+=n;
            });
          } else if(!v.unit){
            total+=parseFloat(val)||0;
          }
        });
        perDate[dk]=total;
      });
      s._varData[v.key]={type:'number',perDate,unit:v.unit||f.unit||''};
    } else {
      // select: count each option per date
      const options=new Set();
      pe.forEach(e=>{
        if(e.skipped&&e.skipped[v.key])return;
        const val=e.fields&&e.fields[v.key];if(!val)return;
        String(val).split(',').map(x=>x.trim()).filter(Boolean).forEach(o=>options.add(o));
      });
      const perOption={};
      options.forEach(opt=>{
        const perDate={};
        s._dates.forEach(dk=>{
          const dayEntries=(entries[dk]||[]).filter(e=>e.projId===p.id);
          let n=0;
          dayEntries.forEach(e=>{
            if(e.skipped&&e.skipped[v.key])return;
            const val=e.fields&&e.fields[v.key];if(!val)return;
            if(String(val).split(',').map(x=>x.trim()).includes(opt))n++;
          });
          perDate[dk]=n;
        });
        perOption[opt]=perDate;
      });
      // total per option across all dates
      const totals={};
      options.forEach(opt=>{totals[opt]=Object.values(perOption[opt]).reduce((a,b)=>a+b,0);});
      s._varData[v.key]={type:'select',options:[...options],perOption,totals};
    }
  });

  const varRow=document.getElementById('cb-vars-'+pid);if(!varRow)return;
  varRow.innerHTML='';
  if(!vars.length){
    varRow.innerHTML='<span style="font-size:11px;color:var(--mid);font-style:italic">'+t('cb_no_fields')+'</span>';
    return;
  }
  vars.forEach(v=>{
    const chip=document.createElement('button');
    chip.className='cb-var-chip '+((v.field&&v.field.type==='select')?'t-sel':'t-num');chip.textContent=v.label;chip.dataset.key=v.key;
    chip.onclick=()=>{
      const idx=s.varKeys.indexOf(v.key);
      if(idx>=0){s.varKeys.splice(idx,1);chip.classList.remove('on');}
      else{s.varKeys.push(v.key);chip.classList.add('on');}
      cbRenderFull(pid);
    };
    varRow.appendChild(chip);
  });
  // Default: select all variables, except units split from a multi-unit number field
  if(!s.varKeys.length){
    vars.forEach(v=>{
      const isMultiUnitSplit=v.unit&&v.field&&v.field.units&&v.field.units.length>1;
      if(isMultiUnitSplit)return;
      s.varKeys.push(v.key);
      const chip=varRow.querySelector('[data-key="'+v.key+'"]');
      if(chip)chip.classList.add('on');
    });
  }
  document.getElementById('cb-nums-'+pid)?.classList.toggle('on',s.showNums);
  document.getElementById('cb-titles-'+pid)?.classList.toggle('on',s.showTitles);
  document.getElementById('cb-panel-'+pid)?.classList.toggle('on',s.showPanel);
  document.getElementById('cb-dpanel-'+pid)?.classList.toggle('on',s.showPanel);
  document.getElementById('cb-statpanel-'+pid)?.classList.toggle('show',s.showPanel);
  cbRenderFull(pid);
}

function cbSetColorMode(pid,m){
  window._cbColorMode=m;
  document.getElementById('cb-cm-warm-'+pid)?.classList.toggle('on',m==='warm');
  document.getElementById('cb-cm-cool-'+pid)?.classList.toggle('on',m==='cool');
  cbRenderFull(pid);
}

function cbSetType(pid,type){
  const s=getCBState(pid);s.chartType=type;
  ['stacked','grouped','donut'].forEach(t=>{
    document.getElementById('cb-t-'+t+'-'+pid)?.classList.toggle('on',t===type);
  });
  document.getElementById('cb-ctrl-bar-'+pid).style.display=type!=='donut'?'flex':'none';
  document.getElementById('cb-ctrl-donut-'+pid).style.display=type==='donut'?'flex':'none';
  cbRenderFull(pid);
}

function cbRenderFull(pid){
  if(window.charts&&window.charts[pid]){window.charts[pid].destroy();delete window.charts[pid];}
  const s=getCBState(pid);
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  const type=s.chartType;

  if(type==='donut'){cbRenderDonut(pid);return;}
  cbRenderBar(pid);
}

function cbRenderBar(pid){
  const s=getCBState(pid);
  if(!s.varKeys.length)return;
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  if(window.charts&&window.charts[pid]){window.charts[pid].destroy();delete window.charts[pid];}
  const type=s.chartType;

  const ds=[];
  const lgGroups=[];
  const spGroups=[];

  s.varKeys.forEach((vk,vi)=>{
    const varInfo=s._vars.find(v=>v.key===vk);
    const vdata=s._varData[vk];
    if(!vdata)return;
    const rawStops=cbGetGroupColors(vi);

    if(vdata.type==='number'){
      // Number field: one bar per date showing the value
      const vals=s._dates.map(dk=>vdata.perDate[dk]||0);
      const col=rawStops[2];
      ds.push({label:varInfo.label,data:vals,
        backgroundColor:col+'CC',borderColor:col,borderWidth:1,
        stack:type==='stacked'?'v'+vi:'v'+vi+'_0',borderRadius:2});
      lgGroups.push({label:varInfo.label,items:[{name:varInfo.label,color:rawStops[2]}],vi});
      const total=vals.reduce((a,b)=>a+b,0);
      spGroups.push({label:varInfo.label,vi,items:[{name:varInfo.label,color:col,cnt:total,pct:100}]});
    } else {
      // Select field: one bar per option per date
      const opts=vdata.options;
      const total=opts.reduce((s,o)=>s+(vdata.totals[o]||0),0);
      const optColors=cbGetStops(rawStops,Math.min(opts.length,5));
      lgGroups.push({label:varInfo.label,items:opts.map((o,i)=>({name:o,color:optColors[i%optColors.length]})),vi});
      const spItems=[];
      opts.forEach((opt,i)=>{
        const col=optColors[i%optColors.length];
        const vals=s._dates.map(dk=>vdata.perOption[opt]?vdata.perOption[opt][dk]||0:0);
        ds.push({label:opt,data:vals,
          backgroundColor:col+'CC',borderColor:col,borderWidth:1,
          stack:type==='stacked'?'v'+vi:'v'+vi+'_'+i,borderRadius:2});
        spItems.push({name:opt,color:col,cnt:vdata.totals[opt]||0,pct:total?Math.round((vdata.totals[opt]||0)/total*100):0});
      });
      spGroups.push({label:varInfo.label,vi,items:spItems});
    }
  });

  // ── Legend ────────────────────────────────────────────────────
  const lgEl=document.getElementById('cb-legend-'+pid);
  if(lgEl){
    let h='';
    lgGroups.forEach(g=>{
      // Use the mid color of this group's palette for the title badge
      const midCol=g.items.length?g.items[Math.floor(g.items.length/2)].color:cbGetGroupColors(g.vi)[2];
      const titleStyle=`background:${midCol}22;color:${midCol};border:.5px solid ${midCol}66`;
      h+=`<div style="margin-bottom:6px">
        <div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:4px;${titleStyle}">${g.label}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;padding-left:2px">
          ${g.items.map(it=>`<span style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--mid)"><span style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:${it.color}"></span>${it.name}</span>`).join('')}
        </div>
      </div>`;
    });
    lgEl.innerHTML=h;
  }

  // ── Side panel (image style: color dot + name + bold count + pct) ──
  const spEl=document.getElementById('cb-statpanel-'+pid);
  if(spEl){
    let h=`<div style='font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c-faint);margin-bottom:10px'>${t('cb_data_stats')}</div>`;
    h+='<div class="cb-side-panel-grid">';
    spGroups.forEach(g=>{
      const midSpCol=g.items.length?g.items[Math.floor(g.items.length/2)].color:cbGetGroupColors(g.vi)[2];
      const titleStyle=`background:${midSpCol}22;color:${midSpCol};border:.5px solid ${midSpCol}66`;
      h+=`<div><div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px;${titleStyle}">${g.label}</div>`;
      g.items.forEach(it=>{
        h+=`<div style="display:flex;align-items:center;padding:5px 0;border-bottom:.5px solid var(--cb-sub-hover)">
          <span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:${it.color};margin-right:7px"></span>
          <span style="flex:1;font-size:12px;color:var(--mid);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.name}</span>
          <span style="font-size:12px;font-weight:700;color:var(--dark);margin-left:6px">${it.cnt}</span>
          <span style="font-size:11px;color:var(--c-faint);margin-left:4px">${it.pct}%</span>
        </div>`;
      });
      h+='</div>';
    });
    h+='</div>';
    spEl.innerHTML=h;
    s._spGroups=spGroups;
  }

  // ── Y max with buffer for title labels ────────────────────────
  const allSums=s._dates.map((_,i)=>{
    const stacks={};
    ds.forEach(d=>{stacks[d.stack]=(stacks[d.stack]||0)+(d.data[i]||0);});
    return Math.max(...Object.values(stacks),0);
  });
  const dataMax=Math.max(...allSums,1);
  const yMax=s.showTitles?Math.ceil(dataMax+Math.max(3,dataMax*0.35)):undefined;

  const dateLabels=s._dates.map(dk=>{const pts=dk.split('-');return pts[1]+'/'+pts[2]+'/'+pts[0];});

  if(!window.charts)window.charts={};
  window.charts[pid]=new Chart(canvas,{
    type:'bar',data:{labels:dateLabels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:ctx=>dateLabels[ctx[0]?.dataIndex],
        label:ctx=>' '+ctx.dataset.label+': '+ctx.parsed.y+(s._varData[s.varKeys[0]]?.type==='number'?'':' '+t('cb_times'))
      }}},
      scales:{
        x:{stacked:type==='stacked',grid:{display:false},ticks:{font:{size:10,family:"'Nunito',sans-serif"},color:'#999',maxRotation:30}},
        y:{stacked:type==='stacked',max:yMax,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:10,family:"'Nunito',sans-serif"},color:'#999',stepSize:1}}
      }},plugins:[CB_NumPlugin,CB_TitlePlugin]
  });
  window.charts[pid]._cbNums=s.showNums;
  window.charts[pid]._cbTitles=s.showTitles;
  window.charts[pid]._cbPid=pid;
  window.charts[pid]._dates=dateLabels;
  window.charts[pid]._titles=s._titles;
  canvas.onclick=(e)=>{cbOnCanvasClick(e,pid);};
}

function cbRenderDonut(pid){
  const s=getCBState(pid);
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  if(window.charts&&window.charts[pid]){window.charts[pid].destroy();delete window.charts[pid];}

  const ds=[];const allLabels=[];
  s._varKeys=[];
  s.varKeys.forEach((vk,vi)=>{
    const vdata=s._varData[vk];if(!vdata)return;
    const groupColors=cbGetGroupColors(vi);
    const groupColorsA=groupColors.map(c=>c+'CC');
    let labels=[];let vals=[];
    if(vdata.type==='number'){
      const total=Object.values(vdata.perDate).reduce((a,b)=>a+b,0);
      const varInfo=s._vars.find(v=>v.key===vk);
      labels=[varInfo?varInfo.label:vk];vals=[total];
    } else {
      labels=vdata.options;
      vals=labels.map(o=>vdata.totals[o]||0);
    }
    const pickedColors=cbGetStops(groupColors,labels.length);
    const pickedA=pickedColors.map(c=>c+'CC');
    ds.push({data:vals,backgroundColor:pickedA,borderColor:pickedColors,borderWidth:2});
    labels.forEach(l=>allLabels.push(l));
    s._varKeys[vi]=vk;
  });
  const lgEl=document.getElementById('cb-legend-'+pid);
  if(lgEl){
    let h='';
    s.varKeys.forEach((vk,vi)=>{
      const varInfo=s._vars.find(v=>v.key===vk);
      const lbl=varInfo?varInfo.label:vk;
      const vdata=s._varData[vk];if(!vdata)return;
      const groupColors=cbGetGroupColors(vi);
      const rawOpts=vdata.type==='number'?[lbl]:vdata.options;
      const optColorsLg=cbGetStops(groupColors,Math.min(rawOpts.length,5));
      const items=rawOpts;
      const ringLabel=s.varKeys.length>1?(vi===0?t('cb_outer'):t('cb_inner')):'';
      const midDonutCol=optColorsLg[Math.floor(optColorsLg.length/2)]||optColorsLg[0];
      const titleSt=`background:${midDonutCol}22;color:${midDonutCol};border:.5px solid ${midDonutCol}66`;
      h+=`<div style="margin-bottom:6px">
        <div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:4px;${titleSt}">${lbl}${ringLabel?' ('+ringLabel+')':''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;padding-left:2px">
          ${items.map((n,i)=>`<span style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--mid)"><span style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:${optColorsLg[i%optColorsLg.length]}"></span>${n}</span>`).join('')}
        </div>
      </div>`;
    });
    lgEl.innerHTML=h;
  }
  const pad=(s.showDonutNums&&s.donutMode==='line')?65:10;
  if(!window.charts)window.charts={};
  window.charts[pid]=new Chart(canvas,{
    type:'doughnut',data:{labels:allLabels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,cutout:'30%',
      layout:{padding:pad},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const total2=ctx.dataset.data.reduce((a,b)=>a+b,0);return' '+ctx.label+': '+ctx.parsed+t('cb_times')+'('+Math.round(ctx.parsed/total2*100)+'%)';}}}}
    },plugins:[CB_DonutPlugin]
  });
  window.charts[pid]._cbDonutNums=s.showDonutNums;
  window.charts[pid]._cbDonutMode=s.donutMode;
  window.charts[pid]._cbPid=pid;

function cbOnCanvasClick(e,pid){
  const s=getCBState(pid);
  if(!s.showTitles)return;
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
  const cx=(e.clientX-rect.left)*scaleX,cy=(e.clientY-rect.top)*scaleY;
  const hits=_cbLabelHits[pid]||[];
  for(const h of hits){
    if(cx>=h.bx&&cx<=h.bx+h.bw&&cy>=h.by&&cy<=h.by+h.bh){
      cbShowTitleEdit(e.clientX,e.clientY,h.i,pid,rect);return;
    }
  }
}

function cbShowTitleEdit(clientX,clientY,idx,pid,canvasRect){
  const s=getCBState(pid);
  const old=document.getElementById('cb-title-inp-'+pid);if(old)old.remove();
  const wrap=document.getElementById('cb-chart-wrap-'+pid);if(!wrap)return;
  const wRect=wrap.getBoundingClientRect();
  const inp=document.createElement('input');
  inp.id='cb-title-inp-'+pid;
  inp.style.cssText='position:absolute;z-index:20;border:.5px solid var(--c-select);border-radius:4px;background:var(--lavender);color:var(--dark);font-size:11px;font-family:sans-serif;padding:3px 7px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:80px';
  inp.style.left=(clientX-wRect.left-40)+'px';
  inp.style.top=(clientY-wRect.top-32)+'px';
  const rawTitle=s._titles&&s._titles[idx]||'';
  inp.value=s.displayTitles[idx]!==undefined?s.displayTitles[idx]:rawTitle;
  wrap.appendChild(inp);inp.focus();inp.select();
  const finish=()=>{
    const v=inp.value.trim();
    s.displayTitles[idx]=v;
    inp.remove();cbRenderFull(pid);
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')finish();if(e.key==='Escape')inp.remove();});
  inp.addEventListener('blur',finish);
}

function cbToggleAdd(pid){

function cbExportDocx(pid){
  const docxLib=window.docx;
  if(!docxLib||!docxLib.Packer){alert(t('docx_loading'));return;}
  const s=getCBState(pid);const p=s._p;
  const ec=s._exportContent||{text:true,chart:false};
  const{Document,Packer,Paragraph,TextRun,ImageRun,BorderStyle}=docxLib;
  const PURPLE='7B68EE',DARK='2D2B3D',MID='5A5870';
  const pe=[...(s._pe||[])].sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const children=[];

  // ── 标题 ──
  children.push(new Paragraph({children:[new TextRun({text:stripEmoji(p.name+' — '+t('export_tracker_title')),bold:true,size:32,color:PURPLE,font:'Arial'})],spacing:{before:0,after:80},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:PURPLE,space:4}}}));
  children.push(new Paragraph({children:[new TextRun({text:stripEmoji(t('export_status')+': '+getStatusLabels()[p.status||'active']+'   '+t('export_total')+': '+pe.length+'   '+new Date().toLocaleDateString()),size:18,color:MID,font:'Arial'})],spacing:{before:60,after:160}}));

  // ── 文字记录（上方）──
  if(ec.text&&pe.length){
    children.push(new Paragraph({children:[new TextRun({text:t('cb_detail'),bold:true,size:24,color:PURPLE,font:'Arial'})],spacing:{before:60,after:60},border:{bottom:{style:BorderStyle.SINGLE,size:2,color:PURPLE,space:4}}}));
    pe.forEach(e=>{
      const parts=e.dateKey.split('-');
      children.push(new Paragraph({children:[new TextRun({text:parts[0]+'年'+parts[1]+'月'+parts[2]+'日',bold:true,size:20,color:PURPLE,font:'Arial'})],spacing:{before:140,after:30}}));
      if(e.title&&e.title.trim())children.push(new Paragraph({children:[new TextRun({text:stripEmoji(e.title.trim()),bold:true,size:22,color:DARK,font:'Arial'})],spacing:{before:0,after:20},indent:{left:240}}));
      (p.fields||[]).forEach(f=>{
        if(e.skipped&&e.skipped[f.id])return;
        const v=e.fields&&e.fields[f.id];if(!v)return;
        const display=Array.isArray(v)?v.join(', '):String(v);
        children.push(new Paragraph({children:[new TextRun({text:stripEmoji(f.label+': '+display+(f.unit?' '+f.unit:'')),size:18,color:MID,font:'Arial'})],spacing:{before:10,after:10},indent:{left:480}}));
      });
      if(e.note)children.push(new Paragraph({children:[new TextRun({text:stripEmoji(t('form_note')+': '+e.note),size:18,color:MID,italics:true,font:'Arial'})],spacing:{before:10,after:10},indent:{left:480}}));
      children.push(new Paragraph({children:[new TextRun({text:'Cat Token: +'+calcCoins(e,e.dateKey),size:16,color:'854F0B',font:'Arial'})],spacing:{before:6,after:6},indent:{left:480}}));
    });
  }

  // ── 统计图表（下方）──
  if(ec.chart){
    const canvas=document.getElementById('cb-canvas-'+pid);
    if(canvas){try{
      // Force white background for export
      const origTheme=theme;theme='light';applyChartTheme();
      const ch=window.charts&&window.charts[pid];
      if(ch){ch.update('none');}
      const base64=canvas.toDataURL('image/png').split(',')[1];
      theme=origTheme;applyChartTheme();
      if(ch){ch.update('none');}
      children.push(new Paragraph({children:[new TextRun({text:t('cb_chart_title'),bold:true,size:24,color:PURPLE,font:'Arial'})],spacing:{before:160,after:60},border:{bottom:{style:BorderStyle.SINGLE,size:2,color:PURPLE,space:4}}}));
      children.push(new Paragraph({children:[new ImageRun({data:Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),transformation:{width:480,height:220},type:'png'})],spacing:{before:0,after:80}}));
    }catch(e){}}
    // ── 数据统计（showPanel 开启时附在图表后）──
    if(s.showPanel&&s._varData&&s.varKeys.length){
      children.push(new Paragraph({children:[new TextRun({text:t('cb_data_stats'),bold:true,size:22,color:PURPLE,font:'Arial'})],spacing:{before:120,after:60}}));
      s.varKeys.forEach((vk,vi)=>{
        const vd=s._varData[vk];if(!vd)return;
        const varInfo=s._vars&&s._vars.find(v=>v.key===vk);
        const label=varInfo?varInfo.label:vk;
        children.push(new Paragraph({children:[new TextRun({text:stripEmoji(label),bold:true,size:20,color:DARK,font:'Arial'})],spacing:{before:80,after:30}}));
        if(vd.type==='number'){
          const total=Object.values(vd.perDate).reduce((a,b)=>a+b,0);

    triggerDownload('data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,'+b64,p.name+'_tracker.docx');
  }).catch(err=>alert(t('export_fail')+': '+err.message));

      const w=window.open('','_blank');
      if(w){w.document.write('<pre>'+txt.replace(/</g,'&lt;')+'</pre>');w.document.close();}
      else{alert(t('export_popup_warn')+'\n\n'+txt);}
    }
  } else {
    let html='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:sans-serif;padding:40px;color:#2d2b3d;max-width:700px;margin:0 auto}h1{color:#7B68EE;border-bottom:2px solid #7B68EE;padding-bottom:8px}.meta{font-size:12px;color:#888;margin-bottom:20px}.entry{border-left:3px solid #7B68EE;padding:8px 16px;margin:10px 0;background:#f9f9ff;border-radius:0 8px 8px 0}.date{color:#7B68EE;font-weight:700;font-size:13px}.title{font-size:14px;font-weight:600;margin:4px 0}.tag{display:inline-block;background:#EEEDFE;color:#7B68EE;padding:2px 8px;border-radius:999px;font-size:11px;margin:2px}.note{font-size:12px;color:#5a5870;font-style:italic;margin-top:4px}@media print{body{padding:20px}}</style></head><body>';
    html+='<h1>'+p.name+'</h1><div class="meta">'+t('export_status')+': '+getStatusLabels()[p.status||'active']+' | '+t('export_total')+': '+pe.length+' | '+new Date().toLocaleDateString()+'</div>';
    pe.forEach(e=>{
      const parts=e.dateKey.split('-');let f='';
      (p.fields||[]).forEach(fld=>{if(e.skipped&&e.skipped[fld.id])return;const v=e.fields&&e.fields[fld.id];if(!v)return;f+='<span class="tag">'+fld.label+': '+v+'</span>';});
      html+='<div class="entry"><div class="date">'+parts[0]+'年'+parts[1]+'月'+parts[2]+'日</div>'+(e.title&&e.title.trim()?'<div class="title">'+e.title.trim()+'</div>':'')+(f?'<div>'+f+'</div>':'')+(e.note?'<div class="note">'+e.note+'</div>':'')+'</div>';
    });
    html+='<script>window.onload=function(){window.print();}<\/script></body></html>';
    try{
      triggerDownload('data:text/html;charset=utf-8,'+encodeURIComponent(html),p.name+'_tracker.html');
    }catch(err){
      const w=window.open('about:blank','_blank');
      if(w){w.document.open();w.document.write(html);w.document.close();}
      else{alert(t('export_print_warn'));}
    }
  }
}

function renderAll(){
  updateStaticI18N();
  recalcTotalCoins();syncNav();
  renderSidebar();
  if(view==='stats')renderStats();
  else if(view==='month')renderMonth();
  else if(view==='tracker')renderTracker();
  else renderJournal();
  renderDayStats();
  const el=document.getElementById('f-title');
  if(el&&formTitle){el.value=formTitle;autoGrow(el,5);}
  const elNote=document.getElementById('f-note');
  if(elNote&&formNote){elNote.value=formNote;autoGrow(elNote,10);}
  const elLink=document.getElementById('f-link');
  if(elLink&&formLink)elLink.value=formLink;
  const elLabel=document.getElementById('f-linklabel');
  if(elLabel&&formLinkLabel)elLabel.value=formLinkLabel;
  const cd=document.getElementById('cal-icon-day');
  if(cd)cd.textContent=today.getDate();

  if(monthNav)monthNav.classList.toggle('active',view==='month');
  if(trackerNav)trackerNav.classList.toggle('active',view==='tracker');

function renderDayStats(){
  const key=dk(selDate);
  const dayEs=entries[key]||[];
  document.getElementById('st-total').textContent=dayEs.length;
  const todayCoins=dayEs.reduce((s,e)=>s+calcCoins(e,key),0);
  document.getElementById('st-coins').textContent=todayCoins;
}

function renderSidebar(){
  const ws=getWeekStart(),we=new Date(ws);we.setDate(we.getDate()+6);
  document.getElementById('week-range').textContent=lang==='zh'
    ?(ws.getMonth()+1)+'月'+ws.getDate()+'–'+(we.getMonth()+1)+'月'+we.getDate()
    :(ws.getMonth()+1)+'/'+ws.getDate()+'–'+(we.getMonth()+1)+'/'+we.getDate();
  const dl=document.getElementById('day-list');dl.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const key=dk(d),isSel=key===dk(selDate)&&view==='journal',isT=key===todayKey,isFut=d>today,cnt=(entries[key]||[]).length;
    const div=document.createElement('div');div.className='day-item'+(isSel?' active':'');div.style.opacity=isFut?.4:1;
    if(!isFut)div.onclick=()=>{tryNavigateDate(d)};
    const dm=(d.getMonth()+1)+'/'+d.getDate();
    div.innerHTML=`<div class="day-dot${cnt?' has':''}"></div><span class="day-name">${t('weekdays')[d.getDay()]} <span style="font-size:10px;opacity:.6">${dm}</span>${isT?' · '+t('today'):''}</span>${cnt?`<span class="day-cnt">${cnt}</span>`:''}`;
    dl.appendChild(div);
  }
  const pl=document.getElementById('proj-list');pl.innerHTML='';
  projects.filter(p=>(p.status||'active')!=='archived').forEach((p,idx)=>{
    const div=document.createElement('div');
    div.className='proj-item';div.draggable=true;div.dataset.idx=idx;div.title=p.name;
    div.innerHTML=`<span class="proj-drag-handle" title="${t('cp_drag')}">⠿</span><div class="proj-dot" style="background:${p.color}"></div><span class="proj-name">${p.name}</span>${p.name.length>14?`<span class="proj-tooltip">${p.name}</span>`:''}`;
    div.onclick=(e)=>{if(!div._dragged)openEditProject(p.id);div._dragged=false;};
    div.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(idx));setTimeout(()=>div.classList.add('dragging'),0);});
    div.addEventListener('dragend',()=>{div.classList.remove('dragging');document.querySelectorAll('.proj-item').forEach(el=>el.classList.remove('drag-over'));div._dragged=true;});
    div.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.proj-item').forEach(el=>el.classList.remove('drag-over'));div.classList.add('drag-over');});
    div.addEventListener('dragleave',()=>div.classList.remove('drag-over'));
    div.addEventListener('drop',e=>{
      e.preventDefault();div.classList.remove('drag-over');
      const from=parseInt(e.dataTransfer.getData('text/plain'));const to=idx;
      if(from===to)return;
      const moved=projects.splice(from,1)[0];projects.splice(to,0,moved);
      saveData();renderAll();
    });
    pl.appendChild(div);
  });
}

function renderJournal(){
  const key=dk(selDate),isToday=key===todayKey,d=selDate;
  const _wd2=t('weekdays')[d.getDay()];
  document.getElementById('page-date').textContent=lang==='zh'
    ?d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+_wd2+(isToday?' · '+t('today'):'')
    :_wd2+', '+(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()+(isToday?' · '+t('today'):'');
  const sbwk=document.getElementById('sb-this-week');if(sbwk)sbwk.textContent=t('this_week');
  const area=document.getElementById('main-area');area.innerHTML='';
  // Date header above everything (including form)
  const dateHdr=document.createElement('div');dateHdr.className='journal-date-hdr';
  const dateFullStr=lang==='zh'
    ?d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+_wd2+(isToday?' · '+t('today'):'')
    :_wd2+', '+(d.getDate()<10?'0':'')+d.getDate()+'/'+(d.getMonth()<9?'0':'')+(d.getMonth()+1)+'/'+d.getFullYear()+(isToday?' · '+t('today'):'');
  dateHdr.textContent=dateFullStr;
  area.appendChild(dateHdr);
  if(showForm)area.appendChild(buildNewForm());
  const dayEs=entries[key]||[];
  if(!dayEs.length&&!showForm){
    const em=document.createElement('div');em.className='empty-hint';
    em.innerHTML=`<div style="font-size:32px;margin-bottom:10px;opacity:.3">✦</div>${t('form_no_records')}<br><span style="font-size:12px;margin-top:4px;display:block;color:var(--mid)">${isToday?t('form_start_hint'):t('form_past')+' ×½'}</span>`;
    area.appendChild(em);return;
  }
  const byProj={};
  dayEs.forEach(e=>{if(!byProj[e.projId])byProj[e.projId]=[];byProj[e.projId].push(e)});
  Object.keys(byProj).forEach(pid=>{
    const p=proj(pid),sec=document.createElement('div');
    const lbl=document.createElement('div');lbl.className='sec-label';
    lbl.innerHTML=`<div class="sec-dot" style="background:${p.color}"></div>${p.name}`;
    sec.appendChild(lbl);
    byProj[pid].forEach(e=>{
      if(editingId===e.id)sec.appendChild(buildEditForm(e,p));
      else sec.appendChild(buildCard(e,p));
    });
    area.appendChild(sec);
  });
}

function buildCard(e,p){
  const card=document.createElement('div');card.className='entry-card';
  const isArchived=(p.status||'active')==='archived';
  let fHTML='';
  // select fields first
  const selectFields=(p.fields||[]).filter(x=>x.type!=='number');
  selectFields.forEach((f,fi)=>{
    if(e.skipped&&e.skipped[f.id])return;
    const v=e.fields&&e.fields[f.id];if(!v)return;
    const cls='ec-selval-f'+(fi%4);
    if(fi>0&&fHTML)fHTML+=`<div class="ec-vdivider"></div>`;
    const tags=Array.isArray(v)?v:String(v).split(',').map(s=>s.trim()).filter(Boolean);
    fHTML+=tags.map(tg=>`<span class="ec-selval ${cls}">${tg}</span>`).join('');
  });
  // number fields after
  (p.fields||[]).filter(x=>x.type==='number').forEach(f=>{
    if(e.skipped&&e.skipped[f.id])return;
    const v=e.fields&&e.fields[f.id];if(!v)return;
    const unit=Array.isArray(v)?'':(f.units&&f.units.length?f.units[0]:(f.unit||''));
    const display=Array.isArray(v)?v.map(o=>o.val+(o.unit?' '+o.unit:'')).join(' · '):(v+(unit?' '+unit:''));
    if(fHTML)fHTML+=`<div class="ec-vdivider"></div>`;
    fHTML+=`<span class="ec-field">· ${f.label}: <strong>${display}</strong></span>`;
  });
  const coins=calcCoins(e, dk(selDate));
  card.innerHTML=`<div class="ec-inner">
    <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-top:1px">
      ${isArchived?`<span style="font-size:12px;font-weight:500;color:var(--c-archived);background:transparent;border:1.5px solid var(--c-archived);border-radius:3px;padding:2px 7px;white-space:nowrap;letter-spacing:.1em;text-transform:uppercase;opacity:.75;transform:rotate(-7deg);display:inline-flex;align-items:center;flex-shrink:0;margin-top:2px">${t('archived_stamp')}</span>`:''}
      <div class="proj-badge-wrap"><div class="proj-badge" style="--pc:${p.color};background:rgba(${hexRgb(p.color)},.16)">${p.name}</div></div>
    </div>
    <div class="ec-body">
      ${e.title&&e.title.trim()?`<div class="ec-title">${e.title}</div>`:''}
      <div class="ec-meta">${fHTML}${e.link?`<a href="${e.link}" target="_blank" style="font-size:11px;color:var(--cyan);text-decoration:none"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" style="display:inline;vertical-align:-1px"><path d="M5.5 8.5a3 3 0 0 0 4.243 0l1.5-1.5a3 3 0 0 0-4.243-4.243L6.25 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M8.5 5.5a3 3 0 0 0-4.243 0l-1.5 1.5a3 3 0 0 0 4.243 4.243L7.75 10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> ${e.linkLabel||t('form_link')}</a>`:''}</div>
      ${e.note?`<div class="ec-note"><svg class="ec-note-icon" width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 2h7l3 3v7H2V2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M9 2v3h3" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><line x1="4" y1="7" x2="10" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="4" y1="9.5" x2="8" y2="9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><span>${e.note}</span></div>`:''}
    </div>
    <span class="ec-coin">${dk(selDate)!==todayKey?'½ ':''} 🐾 +${coins}</span>
    <div class="ec-acts">
      <button class="ec-act ec-edit" title="${t('modal_edit')}" onclick="startEdit(${e.id},'${dk(selDate)}')">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M13.5 2.5L17.5 6.5L7 17H3V13L13.5 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 4.5L15.5 8.5" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="ec-act ec-del" title="${t('modal_delete')}" onclick="deleteEntry('${dk(selDate)}',${e.id},event)">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none"><path d="M3 3L15 15M15 3L3 15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>`;
  return card;
}

function startEdit(id,key){
  const e=(entries[key]||[]).find(x=>x.id===id);if(!e)return;
  editingId=id;
  const p=proj(e.projId);
  const editFields={};
  Object.keys(e.fields||{}).forEach(k=>{
    const f=p.fields&&p.fields.find(x=>x.id===k);
    if(f&&f.type==='select'){
      const v=e.fields[k];
      editFields[k]=typeof v==='string'?v.split(',').map(s=>s.trim()).filter(Boolean):v;
    } else {
      editFields[k]=e.fields[k];
    }
  });
  editState={title:e.title,projId:e.projId||'',fields:editFields,skipped:{...(e.skipped||{})},note:e.note||'',link:e.link||'',linkLabel:e.linkLabel||'',showNote:!!(e.note),showLink:!!(e.link),showProjPicker:false};
  openDropId=null;renderAll();
  setTimeout(()=>{const el=document.getElementById('edit-title');if(el){el.focus();autoGrow(el,5);}const n=document.getElementById('edit-note');if(n)autoGrow(n,10);},50);
}

    ?`<button class="proj-sel-btn error" onclick="editState.showProjPicker=!editState.showProjPicker;renderAll()" style="animation:none">${t('no_proj_warn')}<span style="opacity:.5">▾</span></button>`

      } else {
        const el=document.getElementById('edf-'+f.id+'-'+(units[0]||'_'));
        if(el&&el.value)editState.fields[f.id]=el.value;

    });

  if(editState.projId&&editState.projId!==e.projId)e.projId=editState.projId;

function saveEntry(){
  // 没选 project 不允许保存
  if(!formProj){
    const btn=document.querySelector('.proj-sel-btn');
    if(btn){btn.classList.remove('error');void btn.offsetWidth;btn.classList.add('error');setTimeout(()=>btn.classList.remove('error'),600);}
    return;
  }
  const titleEl=document.getElementById('f-title');
  const t=(titleEl?titleEl.value.trim():'')||formTitle.trim();
  const p=formProj?proj(formProj):null;
  const fields={},skipped={...skippedFields};
  if(p&&p.fields){
    p.fields.forEach(f=>{
      if(skipped[f.id])return;
      if(f.type==='number'){
        const units=f.units&&f.units.length?f.units:(f.unit?[f.unit]:['']);
        if(units.length>1){
          const vals=units.map(u=>{const el=document.getElementById('ff-'+f.id+'-'+(u||'_'));return el&&el.value?{unit:u,val:el.value}:null;}).filter(Boolean);
          if(vals.length)fields[f.id]=vals;
        } else {
          const el=document.getElementById('ff-'+f.id+'-'+(units[0]||'_'));
          if(el&&el.value)fields[f.id]=el.value;
        }
      }
      else{const v=window._fv&&window._fv[f.id];if(v)fields[f.id]=v;}
    });
  }
  const noteEl=document.getElementById('f-note');
  const note=formExtras.note?((noteEl?noteEl.value:'')||formNote).trim():'';
  const linkEl=document.getElementById('f-link');
  const link=formExtras.link?((linkEl?linkEl.value:'')||formLink).trim():'';
  const labelEl=document.getElementById('f-linklabel');
  const linklabel=formExtras.link?((labelEl?labelEl.value:'')||formLinkLabel).trim():'';
  const saveKey=dk(selDate);

function removeOption(fi,oi){
  if(!modal||!modal.fields[fi])return;
  const optVal=modal.fields[fi].options[oi];
  const fid=modal.fields[fi].id;
  // count how many entries use this option
  let usageCount=0;
  Object.values(entries).forEach(arr=>arr.forEach(e=>{
    const v=e.fields&&e.fields[fid];if(!v)return;
    const vals=Array.isArray(v)?v:String(v).split(',').map(s=>s.trim());
    if(vals.includes(optVal))usageCount++;
  }));
  if(usageCount>0){
    modal._confirmDel={fi,oi,count:usageCount};renderModal();return;
  }

function _closeDelConfirm(){
  document.getElementById('modal-container').innerHTML='';
  modal=null;
}

function _doDeleteProject(id,action){
  const p=projects.find(x=>x.id===id);if(!p){_closeDelConfirm();return;}
  const idx=projects.indexOf(p);
  if(action==='archive'){
    p.status='archived';
    _deletedProj={p,idx,action};
    _closeDelConfirm();
    saveData();renderAll();
    showUndoToast(t('archived_toast')+'"'+p.name+'」');
  } else {
    const affectedEntries={};
    Object.entries(entries).forEach(([dk2,arr])=>{
      const hits=arr.filter(e=>e.projId===id);
      if(hits.length)affectedEntries[dk2]=hits.map(e=>({...e}));
    });
    Object.keys(entries).forEach(dk2=>{
      entries[dk2]=entries[dk2].filter(e=>e.projId!==id);
    });
    projects=projects.filter(x=>x.id!==id);
    _deletedProj={p,idx,action,affectedEntries};
    _closeDelConfirm();
    saveData();renderAll();
    const total=Object.values(affectedEntries).flat().length;
    showUndoToast(t('deleted')+'"'+p.name+'」'+(total?' '+t('records_suffix')+' '+total+' '+t('records_suffix'):''));
  }
}

function restoreProject(id){

}

function _permDeleteProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;
  const entryCount=Object.values(entries).reduce((s,arr)=>s+arr.filter(e=>e.projId===id).length,0);

  projects=projects.filter(x=>x.id!==id);
  _closeDelConfirm();

  showUndoToast(t('perm_deleted')+'"'+p.name+'」'+(entryCount?' '+t('records_suffix')+' '+entryCount+' '+t('records_suffix'):''));

function showUndoToast(msg){
  clearTimeout(_delTimer);
  let _toast=document.getElementById('undo-toast');
  if(!_toast){_toast=document.createElement('div');_toast.id='undo-toast';_toast.className='undo-toast';document.body.appendChild(_toast);}
  _toast.innerHTML=msg+' <button class="undo-btn" onclick="undoDelete()">'+t('undo')+'</button>';
  _toast.style.display='flex';
  _delTimer=setTimeout(()=>{_toast.style.display='none';_deletedProj=null;},5000);
}

function undoDelete(){
  clearTimeout(_delTimer);
  if(!_deletedProj)return;
  const{p,idx,action,affectedEntries}=_deletedProj;
  if(action==='archive'){
    const found=projects.find(x=>x.id===p.id);
    if(found)found.status='active';
  } else {
    projects.splice(idx,0,p);
    Object.entries(affectedEntries||{}).forEach(([dk2,arr])=>{
      if(!entries[dk2])entries[dk2]=[];
      arr.forEach(e=>{if(!entries[dk2].find(x=>x.id===e.id))entries[dk2].push(e);});
    });
  }
  saveData();renderAll();_deletedProj=null;
  const t=document.getElementById('undo-toast');if(t)t.style.display='none';
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&_deletedProj)undoDelete();});

function renderStats(){
  const _pd=document.getElementById('page-date');if(_pd)_pd.textContent=t('btn_weekly');
  const area=document.getElementById('main-area');area.innerHTML='';
  const ws=getWeekStart();
  const perDay=[];let totalE=0;const projStats={};const projFirstSeen={};
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const list=entries[dk(d)]||[];totalE+=list.length;
    list.forEach(e=>{
      if(!projStats[e.projId])projStats[e.projId]={count:0,fields:{}};
      projStats[e.projId].count++;
      if(projFirstSeen[e.projId]===undefined)projFirstSeen[e.projId]=i;
      const p=proj(e.projId);
      (p.fields||[]).forEach(f=>{
        if(e.skipped&&e.skipped[f.id])return;
        const v=e.fields&&e.fields[f.id];if(!v)return;
        if(f.type==='number'){
          const entries2=Array.isArray(v)?v:[{unit:f.unit||'',val:v}];
          entries2.forEach(o=>{
            const n=parseFloat(o.val);if(isNaN(n))return;
            const fkey=f.id+'::'+(o.unit||'');
            if(!projStats[e.projId].fields[fkey])projStats[e.projId].fields[fkey]={label:f.label,unit:o.unit||'',type:'number',total:0};
            projStats[e.projId].fields[fkey].total+=n;
          });
        } else {
          if(!projStats[e.projId].fields[f.id])projStats[e.projId].fields[f.id]={label:f.label,type:'select',vals:{}};
          projStats[e.projId].fields[f.id].vals[v]=(projStats[e.projId].fields[f.id].vals[v]||0)+1;
        }
      });
    });
    perDay.push({d,cnt:list.length});
  }
  const maxDay=perDay.reduce((a,b)=>b.cnt>a.cnt?b:a,perDay[0]);
  const sortedProjs=Object.keys(projStats).sort((a,b)=>projStats[b].count-projStats[a].count);
  const mostActiveProj=sortedProjs[0]||null;
  const debutProj=sortedProjs.find(pid=>projFirstSeen[pid]>0)||null;
  const zhWD=['日','一','二','三','四','五','六'];
  const enWD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const enMon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // ① 猫咪横幅
  const kaomoji=totalE>=10?'ฅ^•ﻌ•^ฅ':totalE>=5?'ᓚᘏᗢ':'( =ω= )';
  const banner=document.createElement('div');banner.className='wr-cat-banner';
  const entryLabel=lang==='zh'?'<strong style="color:var(--purple);font-family:\'Lilita One\',sans-serif;font-size:16px">'+totalE+'</strong> '+t('wr_entries_zh')+'记录':'<strong style="color:var(--purple);font-family:\'Lilita One\',sans-serif;font-size:16px">'+totalE+'</strong>'+t('wr_entries_zh');
  banner.innerHTML='<span class="wr-cat-kaomoji">'+kaomoji+'</span><div>'+t('weekly_done')+' '+entryLabel+'</div>';
  area.appendChild(banner);

  // ② 本周亮点 pill
  const hasH=maxDay.cnt>0||mostActiveProj||debutProj;
  if(hasH){
    const sl=document.createElement('div');sl.className='wr-section-label';sl.textContent=t('wr_highlights');area.appendChild(sl);
    const hw=document.createElement('div');hw.className='wr-highlights';
    if(maxDay.cnt>0){
      const _md=maxDay.d,_dd=String(_md.getDate()).padStart(2,'0'),_mm=String(_md.getMonth()+1).padStart(2,'0'),_yy=String(_md.getFullYear()).slice(2);
      const enWD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const dayLabel=lang==='zh'?'星期'+zhWD[maxDay.d.getDay()]+' · '+_dd+'/'+_mm+'/'+_yy:enWD[maxDay.d.getDay()]+' · '+_dd+'/'+_mm+'/'+_yy;
      hw.innerHTML+='<div class="wr-pill"><div class="wr-pill-title">'+t('wr_active_day')+'</div><div class="wr-pill-sub">'+dayLabel+'</div></div>';
    }
    if(mostActiveProj){
      const mp=proj(mostActiveProj);
      hw.innerHTML+='<div class="wr-pill"><div class="wr-pill-title">'+t('wr_active_proj')+'</div><div class="wr-pill-sub">'+mp.name+'</div></div>';
    }
    if(debutProj){
      const dp=proj(debutProj);
      hw.innerHTML+='<div class="wr-pill"><div class="wr-pill-title">'+t('wr_debut')+'</div><div class="wr-pill-sub">'+dp.name+'</div></div>';
    }
    area.appendChild(hw);
  }

  // ③ 日历热力格
  const calOuter=document.createElement('div');calOuter.className='wr-cal-outer';
  // 挂钩
  const hooksDiv=document.createElement('div');hooksDiv.className='wr-cal-hooks';
  hooksDiv.innerHTML='<div class="wr-cal-hook"></div><div class="wr-cal-hook"></div>';
  calOuter.appendChild(hooksDiv);
  // 顶栏：标题 + 日期范围
  const fmtWShort=d=>{const dd=String(d.getDate()).padStart(2,'0'),mm=String(d.getMonth()+1).padStart(2,'0');return dd+'/'+mm;};
  const getISOWeek=d=>{const tmp=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));tmp.setUTCDate(tmp.getUTCDate()+4-(tmp.getUTCDay()||7));const yearStart=new Date(Date.UTC(tmp.getUTCFullYear(),0,1));return Math.ceil((((tmp-yearStart)/86400000)+1)/7);};
  const weekNum=getISOWeek(ws);
  const calTopbar=document.createElement('div');calTopbar.className='wr-cal-topbar';
  const calTopLabel=lang==='zh'?ws.getFullYear()+'年的第'+weekNum+'个星期，你好！':'You\'re in week '+weekNum+' of '+ws.getFullYear()+'!';

      cell.textContent=x.cnt;
    } else {
      cell.className='wr-cal-day empty';
    }
    calGrid.appendChild(cell);
  });
  calWrap.appendChild(calGrid);
  calOuter.appendChild(calWrap);
  area.appendChild(calOuter);

  // ④ 项目条形图 + toggle
  if(sortedProjs.length>0){
    const projLogWrap=document.createElement('div');projLogWrap.className='wr-proj-log-wrap';

    // header 行：PROJECT LOG 标题左，toggle 右
    const logHeader=document.createElement('div');logHeader.className='wr-proj-log-header';
    const sl3=document.createElement('div');sl3.className='wr-section-label large';sl3.textContent=t('wr_proj_log');
    if(window._wrHintsOn===undefined)window._wrHintsOn=false;
    const toggleRow=document.createElement('div');toggleRow.className='wr-hint-toggle';
    const toggleTrack=document.createElement('div');toggleTrack.className='wr-toggle-track'+(window._wrHintsOn?' on':'');

    const toggleLabel=document.createElement('div');toggleLabel.className='wr-hint-toggle-label';toggleLabel.textContent=t('wr_show_hints');
    toggleRow.appendChild(toggleTrack);toggleRow.appendChild(toggleLabel);
    toggleRow.onclick=()=>{
      window._wrHintsOn=!window._wrHintsOn;
      toggleTrack.classList.toggle('on',window._wrHintsOn);
      document.querySelectorAll('.wr-proj-hint').forEach(el=>el.classList.toggle('visible',window._wrHintsOn));
    };
    logHeader.appendChild(sl3);logHeader.appendChild(toggleRow);
    projLogWrap.appendChild(logHeader);
    const divider=document.createElement('hr');divider.className='wr-proj-log-divider';projLogWrap.appendChild(divider);

    const maxCount=projStats[sortedProjs[0]].count;

      const p=proj(pid),ps=projStats[pid];
      const isArchived=p.status==='archived';
      const card=document.createElement('div');card.className='wr-proj-card'+(isArchived?' archived':'');

let calPickerDate = new Date(today); // month being displayed in picker

function renderCalPopup(){
  const popup = document.getElementById('cal-popup');
  const year = calPickerDate.getFullYear();
  const month = calPickerDate.getMonth();

  // Build year options (5 years back to today's year)
  const currentYear = today.getFullYear();
  let yearOpts = '';
  for(let y = currentYear; y >= currentYear - 5; y--){
    yearOpts += `<option value="${y}"${year===y?' selected':''}>${y}</option>`;
  }

  // Build month options
  const monthNames = lang==='zh'
    ?['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']
    :['January','February','March','April','May','June','July','August','September','October','November','December'];
  let monthOpts = monthNames.map((m,i) => `<option value="${i}"${month===i?' selected':''}>${m}</option>`).join('');

  // Build calendar grid
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  const dayHdrs=lang==='zh'?['日','一','二','三','四','五','六']:['Su','Mo','Tu','We','Th','Fr','Sa'];
  let gridHTML = dayHdrs.map(d => `<div class="cal-day-hdr">${d}</div>`).join('');

  // Prev month filler
  for(let i = firstDay - 1; i >= 0; i--){
    gridHTML += `<div class="cal-day other-month">${daysInPrevMonth - i}</div>`;
  }

  // Current month days
  for(let d = 1; d <= daysInMonth; d++){
    const thisDate = new Date(year, month, d);
    thisDate.setHours(0,0,0,0);
    const key = dk(thisDate);
    const isToday = key === todayKey;
    const isSel = key === dk(selDate);
    const isFuture = thisDate > today;
    const hasEntry = (entries[key]||[]).length > 0;
    let cls = 'cal-day';
    if(isToday) cls += ' today';
    if(isSel) cls += ' selected';
    if(isFuture) cls += ' future';
    if(hasEntry) cls += ' has-entry';
    const onclick = isFuture ? '' : `onclick="pickCalDate(${year},${month},${d})"`;
    gridHTML += `<div class="${cls}" ${onclick}>${d}</div>`;
  }

  // Next month filler
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for(let i = 1; i <= remaining; i++){
    gridHTML += `<div class="cal-day other-month">${i}</div>`;
  }

  popup.innerHTML = `
    <div class="cal-popup-header">
      <button class="cal-nav" onclick="shiftCalMonth(-1)">‹</button>
      <span class="cal-popup-title">${lang==='zh'?year+'年 '+monthNames[month]:monthNames[month]+' '+year}</span>
      <button class="cal-nav" onclick="shiftCalMonth(1)">›</button>
    </div>
    <div class="cal-selects">
      <select class="cal-sel" onchange="setCalYear(this.value)">${yearOpts}</select>
      <select class="cal-sel" onchange="setCalMonth(this.value)">${monthOpts}</select>
    </div>
    <div class="cal-grid">${gridHTML}</div>
  `;
}

function shiftCalMonth(dir){
  calPickerDate.setMonth(calPickerDate.getMonth() + dir);
  renderCalPopup();
}
function setCalYear(y){ calPickerDate.setFullYear(parseInt(y)); renderCalPopup(); }
function setCalMonth(m){ calPickerDate.setMonth(parseInt(m)); renderCalPopup(); }

function pickCalDate(y, m, d){
  const target=new Date(y, m, d);target.setHours(0,0,0,0);
  const doNav=()=>{
    selDate=target;
    const diffDays = Math.round((selDate - today) / 86400000);
    weekOffset = diffDays < 0 ? Math.ceil((selDate - today) / (7 * 86400000)) : 0;
    const ws = getWeekStart();
    const we = new Date(ws); we.setDate(we.getDate() + 6);
    if(selDate < ws || selDate > we){
      const wsDiff = selDate - today;
      weekOffset = Math.floor(wsDiff / (7 * 86400000));
      if(selDate < getWeekStart()) weekOffset--;
    }
    view = 'journal';
    document.getElementById('cal-popup').style.display = 'none';
    renderAll();
  };
  if(showForm&&hasFormContent()){tryNavigateDate(target,doNav);}
  else{if(showForm)cancelForm();doNav();}
}
