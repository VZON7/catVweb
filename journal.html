<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目日记 — catVweb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/docx@9.0.0/build/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,400;0,600;0,800;0,900;1,400&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --lavender:#eae8f5; --dark:#2d2b3d; --mid:#5a5870;
  --pink:#FF3F6C; --purple:#7B68EE; --cyan:#42C6FF;
}
body { background:var(--lavender); min-height:100vh; font-family:'Nunito',sans-serif; color:var(--dark); }

/* NAV */
#site-nav {
  position:fixed; top:0; left:0; right:0; height:52px;
  display:flex; align-items:center; justify-content:space-between; padding:0 28px;
  background:rgba(234,232,245,0.88); backdrop-filter:blur(14px);
  border-bottom:0.5px solid rgba(123,104,238,0.2); z-index:200;
}
.nav-logo { font-weight:800; font-size:15px; color:var(--dark); display:flex; align-items:center; gap:7px; text-decoration:none; }
.nav-pip { width:7px; height:7px; border-radius:50%; background:var(--purple); }
.nav-right { display:flex; align-items:center; gap:10px; }
.nav-back { font-size:13px; font-weight:600; color:var(--mid); text-decoration:none; background:rgba(123,104,238,0.09); border:0.5px solid rgba(123,104,238,0.3); border-radius:999px; padding:6px 14px; transition:background .2s; }
.nav-back:hover { background:rgba(123,104,238,0.18); }
.coin-pill { display:flex; align-items:center; gap:5px; background:#FAEEDA; border:0.5px solid #FAC775; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; color:#633806; }

/* LAYOUT */
.page { padding:72px 0 60px; max-width:860px; margin:0 auto; padding-left:20px; padding-right:20px; }

/* HEADER */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.page-title { font-family:'ZCOOL XiaoWei',sans-serif; font-size:28px; color:var(--dark); }
.page-date { font-size:12px; color:var(--mid); margin-top:4px; }
.new-btn { display:flex; align-items:center; gap:6px; background:var(--purple); color:#fff; border:none; border-radius:999px; padding:9px 20px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; transition:opacity .2s; }
.new-btn:hover { opacity:.85; }

/* STATS */
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.stat-card { background:rgba(255,255,255,0.6); border:0.5px solid rgba(123,104,238,0.2); border-radius:12px; padding:12px 14px; text-align:center; }
.stat-n { font-family:'Lilita One',cursive; font-size:24px; color:var(--purple); }
.stat-l { font-size:11px; color:var(--mid); margin-top:2px; }

/* TWO-COL LAYOUT */
.main-layout { display:grid; grid-template-columns:200px 1fr; gap:16px; }
@media(max-width:600px){ .main-layout { grid-template-columns:1fr; } }

/* SIDEBAR */
.sidebar { background:rgba(255,255,255,0.55); border:0.5px solid rgba(123,104,238,0.15); border-radius:14px; padding:14px; height:fit-content; }
.sb-label { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); margin-bottom:8px; }
.week-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.week-range { font-size:11px; font-weight:600; color:var(--dark); }
.wnav-btn { background:none; border:none; color:var(--mid); cursor:pointer; font-size:14px; padding:2px 5px; border-radius:4px; }
.wnav-btn:hover { background:rgba(123,104,238,0.12); }
.day-item { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
.day-item:hover { background:rgba(123,104,238,0.08); }
.day-item.active { background:#FAEEDA; }
.day-dot { width:5px; height:5px; border-radius:50%; background:rgba(123,104,238,0.2); flex-shrink:0; }
.day-dot.has { background:var(--purple); }
.day-name { font-size:12px; color:var(--mid); flex:1; }
.day-item.active .day-name { color:#633806; font-weight:700; }
.day-cnt { font-size:10px; color:var(--mid); }
.sb-divider { border:none; border-top:0.5px solid rgba(123,104,238,0.15); margin:12px 0; }
.proj-item { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:8px; cursor:pointer; margin-bottom:2px; transition:background .1s; user-select:none; }
.proj-item:hover { background:rgba(123,104,238,0.08); }
.proj-item.dragging { opacity:.35; }
.proj-item.drag-over { background:rgba(123,104,238,0.15); box-shadow:0 -2px 0 var(--purple); }
.proj-drag-handle { font-size:13px; color:var(--mid); opacity:.3; cursor:grab; flex-shrink:0; padding:0 1px; line-height:1; }
.proj-drag-handle:hover { opacity:.7; }
.proj-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.proj-name { font-size:12px; color:var(--mid); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.proj-item { position:relative; }
.proj-item:hover .proj-tooltip { display:block; }
.proj-tooltip { display:none; position:absolute; left:calc(100% + 6px); top:50%; transform:translateY(-50%); background:var(--dark); color:#fff; font-size:11px; font-weight:500; padding:4px 10px; border-radius:7px; white-space:nowrap; z-index:50; pointer-events:none; font-family:'Nunito',sans-serif; }
.proj-tooltip::before { content:''; position:absolute; right:100%; top:50%; transform:translateY(-50%); border:5px solid transparent; border-right-color:var(--dark); }
.proj-cnt { font-size:10px; color:var(--mid); }
.add-proj-btn { display:flex; align-items:center; gap:5px; width:100%; padding:6px 7px; border-radius:8px; border:0.5px dashed rgba(123,104,238,0.35); background:none; color:var(--mid); font-size:12px; font-family:'Nunito',sans-serif; cursor:pointer; margin-top:4px; }
.add-proj-btn:hover { background:rgba(123,104,238,0.08); color:var(--dark); }
.sb-nav-btn { display:flex; align-items:center; gap:6px; width:100%; padding:7px; border-radius:8px; border:none; background:none; color:var(--mid); font-size:12px; font-family:'Nunito',sans-serif; cursor:pointer; margin-top:2px; }
.sb-nav-btn:hover { background:rgba(123,104,238,0.08); color:var(--dark); }

/* MAIN AREA */
.main-area { min-height:400px; }
.sec-label { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); margin-bottom:8px; margin-top:4px; display:flex; align-items:center; gap:6px; }
.sec-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ENTRY CARD */
.entry-card { background:rgba(255,255,255,0.65); border:0.5px solid rgba(123,104,238,0.18); border-radius:12px; margin-bottom:8px; transition:border-color .15s; }
.entry-card:hover { border-color:rgba(123,104,238,0.4); }
.entry-card.editing { border-color:var(--purple); background:rgba(255,255,255,0.9); }
.ec-inner { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; }
.proj-badge { display:flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700; white-space:nowrap; flex-shrink:0; margin-top:1px; }
.ec-body { flex:1; min-width:0; }
.ec-title { font-size:13px; font-weight:700; color:var(--dark); line-height:1.4; }
.ec-meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:5px; }
.ec-field { font-size:11px; color:var(--mid); display:flex; align-items:center; gap:3px; }
.ec-selval { font-size:10px; padding:2px 8px; border-radius:999px; background:rgba(123,104,238,0.1); border:0.5px solid rgba(123,104,238,0.25); color:var(--dark); }
.ec-note { font-size:12px; color:var(--mid); margin-top:5px; line-height:1.5; padding-top:5px; border-top:0.5px solid rgba(123,104,238,0.12); }
.ec-coin { font-size:10px; color:#854F0B; background:#FAEEDA; border-radius:999px; padding:2px 7px; white-space:nowrap; flex-shrink:0; font-weight:700; }
.ec-acts { display:flex; gap:2px; flex-shrink:0; }
.ec-act { background:none; border:none; color:var(--mid); cursor:pointer; font-size:13px; padding:4px; border-radius:4px; opacity:.4; }
.ec-act:hover { opacity:1; background:rgba(123,104,238,0.1); }

/* INLINE EDIT */
.inline-edit { padding:0 14px 12px; }
.ie-title input { width:100%; font-size:13px; font-weight:700; margin-bottom:8px; font-family:'Nunito',sans-serif; background:rgba(255,255,255,0.8); border:0.5px solid rgba(123,104,238,0.3); border-radius:8px; padding:7px 10px; color:var(--dark); }
.ie-var-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.ie-var-label { font-size:12px; color:var(--mid); min-width:72px; flex-shrink:0; }
.ie-var-val { flex:1; position:relative; }
.ie-skip-btn { width:26px; height:26px; border-radius:50%; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ie-skip-btn:hover { border-color:var(--pink); color:var(--pink); }
.ie-skip-btn.skipped { background:rgba(255,63,108,0.1); border-color:var(--pink); color:var(--pink); }
.skipped-label { font-size:12px; color:var(--mid); font-style:italic; padding:0 8px; }
.ie-extras { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.ie-toggle { display:flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.2); background:rgba(255,255,255,0.5); color:var(--mid); font-size:11px; cursor:pointer; font-family:'Nunito',sans-serif; }
.ie-toggle:hover { border-color:rgba(123,104,238,0.4); }
.ie-toggle.on { border-color:var(--purple); background:rgba(123,104,238,0.1); color:var(--purple); font-weight:700; }
.ie-dyn { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
.ie-textarea { width:100%; font-size:12px; resize:none; border-radius:8px; border:0.5px solid rgba(123,104,238,0.2); padding:7px 10px; background:rgba(255,255,255,0.8); color:var(--dark); font-family:'Nunito',sans-serif; line-height:1.5; }
.ie-btns { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
.ie-cancel { padding:6px 12px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }
.ie-save { padding:6px 16px; border-radius:999px; background:var(--purple); border:none; color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }
.ie-save:hover { opacity:.85; }

/* FORM */
.form-card { background:rgba(255,255,255,0.85); border:0.5px solid rgba(123,104,238,0.35); border-radius:14px; padding:14px; margin-bottom:12px; }
.form-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.form-row input { flex:1; font-size:13px; font-family:'Nunito',sans-serif; background:rgba(255,255,255,0.9); border:0.5px solid rgba(123,104,238,0.25); border-radius:8px; padding:8px 12px; color:var(--dark); outline:none; }
.form-row input:focus { border-color:var(--purple); }
.proj-sel-btn { display:flex; align-items:center; gap:5px; padding:0 12px; height:36px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.8); color:var(--dark); font-size:12px; font-weight:600; cursor:pointer; font-family:'Nunito',sans-serif; white-space:nowrap; flex-shrink:0; }
.proj-sel-btn:hover { background:rgba(123,104,238,0.1); }
.var-rows { display:flex; flex-direction:column; gap:7px; margin-bottom:8px; }
.var-row { display:flex; align-items:center; gap:8px; }
.var-label { font-size:12px; color:var(--mid); min-width:72px; flex-shrink:0; }
.var-val { flex:1; position:relative; }
.skip-btn { width:28px; height:28px; border-radius:50%; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
.skip-btn:hover { border-color:var(--pink); color:var(--pink); }
.skip-btn.skipped { background:rgba(255,63,108,0.1); border-color:var(--pink); color:var(--pink); }
.extras-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.extra-toggle { display:flex; align-items:center; gap:4px; padding:5px 10px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.2); background:rgba(255,255,255,0.6); color:var(--mid); font-size:11px; cursor:pointer; font-family:'Nunito',sans-serif; }
.extra-toggle.on { border-color:var(--purple); background:rgba(123,104,238,0.1); color:var(--purple); font-weight:700; }
.coin-preview { font-size:11px; color:#854F0B; background:#FAEEDA; border-radius:8px; padding:7px 10px; margin-bottom:8px; }
.form-btns { display:flex; gap:6px; justify-content:flex-end; }
.f-cancel { padding:7px 14px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.7); color:var(--mid); font-size:13px; cursor:pointer; font-family:'Nunito',sans-serif; }
.f-save { padding:7px 18px; border-radius:999px; background:var(--purple); border:none; color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }
.f-save:hover { opacity:.85; }

/* PROJ PICKER */
.proj-picker { background:rgba(255,255,255,0.9); border:0.5px solid rgba(123,104,238,0.3); border-radius:12px; padding:10px; margin-bottom:8px; }
.pp-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; color:var(--dark); }
.pp-item:hover { background:rgba(123,104,238,0.08); }
.pp-item.sel { background:#FAEEDA; color:#633806; }

/* SELECT DROPDOWN */
.sel-wrap { position:relative; width:100%; }
.sel-btn { width:100%; display:flex; align-items:center; justify-content:space-between; padding:0 10px; height:34px; border-radius:8px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.8); color:var(--dark); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }
.sel-btn:hover { background:rgba(255,255,255,1); }
.sel-dropdown { background:rgba(255,255,255,0.97); border:0.5px solid rgba(123,104,238,0.3); border-radius:10px; padding:6px; margin-top:3px; z-index:10; }
.sd-opt { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:7px; cursor:pointer; font-size:12px; color:var(--dark); font-family:'Nunito',sans-serif; }
.sd-opt:hover { background:rgba(123,104,238,0.08); }
.sd-opt.sel { background:#FAEEDA; color:#633806; font-weight:700; }
.sd-add { display:flex; gap:6px; padding:5px 4px 2px; border-top:0.5px solid rgba(123,104,238,0.12); margin-top:4px; }
.sd-add input { flex:1; font-size:12px; font-family:'Nunito',sans-serif; border:0.5px solid rgba(123,104,238,0.2); border-radius:7px; padding:5px 8px; background:rgba(255,255,255,0.9); color:var(--dark); outline:none; }
.sd-add-btn { padding:4px 10px; border-radius:7px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(123,104,238,0.08); color:var(--purple); font-size:11px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }

/* STATS VIEW */
.stats-bars { display:flex; align-items:flex-end; gap:6px; height:72px; margin-bottom:14px; }
.wbar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.wbar-bg { flex:1; width:100%; background:rgba(123,104,238,0.12); border-radius:3px; display:flex; align-items:flex-end; overflow:hidden; }
.wbar-in { width:100%; background:var(--purple); border-radius:3px; min-height:2px; transition:height .4s; }
.wbar-col.today .wbar-in { background:var(--pink); }
.wbar-lbl { font-size:10px; color:var(--mid); }
.wbar-col.today .wbar-lbl { color:var(--pink); font-weight:700; }
.proj-stat-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.psr-name { font-size:12px; color:var(--dark); width:110px; flex-shrink:0; display:flex; align-items:center; gap:5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; }
.psr-track { flex:1; height:8px; background:rgba(123,104,238,0.12); border-radius:4px; overflow:hidden; }
.psr-fill { height:100%; border-radius:4px; }
.psr-val { font-size:11px; color:var(--mid); width:80px; text-align:right; flex-shrink:0; white-space:nowrap; }
.cat66-bar { display:flex; align-items:center; gap:12px; background:rgba(250,238,218,0.7); border:0.5px solid #FAC775; border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:12px; color:#633806; line-height:1.6; }

/* MODAL */
.modal-bg { position:fixed; inset:0; background:rgba(45,43,61,.35); display:flex; align-items:center; justify-content:center; z-index:300; border-radius:0; }
.modal { background:rgba(234,232,245,0.97); border-radius:16px; border:0.5px solid rgba(123,104,238,0.3); padding:20px; width:300px; max-height:85vh; overflow-y:auto; }
.modal-title { font-family:'ZCOOL XiaoWei',sans-serif; font-size:16px; color:var(--dark); margin-bottom:14px; }
.modal-lbl { font-size:11px; font-weight:700; color:var(--mid); margin-bottom:5px; margin-top:10px; }
.modal input { width:100%; font-size:13px; font-family:'Nunito',sans-serif; border:0.5px solid rgba(123,104,238,0.25); border-radius:8px; padding:7px 10px; background:rgba(255,255,255,0.9); color:var(--dark); outline:none; }
.swatch { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .1s; flex-shrink:0; }
.swatch:hover { transform:scale(1.15); }
.swatch.sel { border-color:var(--dark); }
.ftype-row { display:flex; gap:6px; margin:6px 0; }
.ftype-btn { flex:1; padding:6px; border-radius:8px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.7); color:var(--mid); font-size:11px; font-weight:600; cursor:pointer; font-family:'Nunito',sans-serif; text-align:center; }
.ftype-btn.sel { border-color:var(--purple); background:rgba(123,104,238,0.1); color:var(--purple); }
.mfl-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mid); padding:5px 0; border-bottom:0.5px solid rgba(123,104,238,0.1); }
.mfl-item:last-child { border:none; }
.mfl-del { background:none; border:none; color:var(--mid); cursor:pointer; margin-left:auto; font-size:14px; }
.mfl-del:hover { color:var(--pink); }
.add-field-row { display:flex; gap:6px; margin-top:6px; }
.add-field-row input { flex:1; font-size:12px; }
.add-field-btn { padding:5px 10px; border-radius:8px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(123,104,238,0.1); color:var(--purple); font-size:12px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; white-space:nowrap; }
.modal-btns { display:flex; gap:6px; justify-content:flex-end; margin-top:14px; border-top:0.5px solid rgba(123,104,238,0.15); padding-top:12px; }
.m-cancel { padding:6px 12px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }
.m-save { padding:6px 16px; border-radius:999px; background:var(--purple); border:none; color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }
.m-delete { padding:6px 12px; border-radius:999px; border:0.5px solid rgba(255,63,108,0.35); background:none; color:var(--pink); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }

.empty-hint { text-align:center; padding:2.5rem 0; color:var(--mid); font-size:13px; }

/* ── project 未选时的抖动提示 ── */
@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-5px)}
  40%{transform:translateX(5px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
.proj-sel-btn.error {
  border-color:var(--pink)!important;
  background:rgba(255,63,108,0.08)!important;
  color:var(--pink)!important;
  animation:shake .35s ease;
}

function proj(id){return projects.find(p=>p.id===id)||{name:'?',color:'#888',fields:[]}}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(',')}

function calcCoins(e, dateKeyForEntry){
  let c=3;
  const p=proj(e.projId);
  (p.fields||[]).forEach(f=>{
    if(e.skipped&&e.skipped[f.id])return;
    const v=e.fields&&e.fields[f.id];if(!v)return;
    if(f.type==='number'){const n=parseFloat(v);if(!isNaN(n))c+=Math.min(Math.floor(n/5),8);}
    else if(f.type==='select')c+=1;
  });
  if(e.note&&e.note.trim())c+=1;
  if(e.link&&e.link.trim())c+=1;
  // Halve tokens for past entries (not today)
  if(dateKeyForEntry && dateKeyForEntry !== todayKey) c=Math.max(1, Math.floor(c/2));
  return c;
}

function recalcTotalCoins(){
  totalCoins=Object.entries(entries).reduce((s,[k,arr])=>s+arr.reduce((ss,e)=>ss+calcCoins(e,k),0),0);
}

const CB_NumPlugin={id:'cbNumPlugin',afterDatasetsDraw(ch){
  if(!ch._cbNums)return;
  const ctx=ch.ctx;
  ch.data.datasets.forEach((ds,di)=>{
    const meta=ch.getDatasetMeta(di);
    meta.data.forEach((bar,i)=>{
      const v=ds.data[i];if(!v)return;
      const{x,y,base}=bar;const h=Math.abs(base-y);if(h<14)return;
      ctx.save();ctx.font='10px sans-serif';
      ctx.fillStyle='rgba(100,100,100,0.55)';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(v,x,(y+base)/2);ctx.restore();

let _cbLabelHits={};
const CB_TitlePlugin={id:'cbTitlePlugin',afterDatasetsDraw(ch){
  if(!ch._cbTitles)return;
  const pid=ch._cbPid;
  const s=getCBState(pid);
  _cbLabelHits[pid]=[];
  const ctx=ch.ctx;const ca=ch.chartArea;
  const allMetas=ch.data.datasets.map((_,i)=>ch.getDatasetMeta(i));
  const dates=s._dates||[];
  dates.forEach((_,i)=>{
    let topY=Infinity,topX=null;
    allMetas.forEach(m=>{if(m.data[i]){const{y,x}=m.data[i];if(y<topY){topY=y;topX=x;}}});
    if(topY===Infinity||!topX)return;
    const rawTitle=s._titles&&s._titles[i]||'';
    const title=s.displayTitles[i]!==undefined?s.displayTitles[i]:rawTitle;
    if(!title)return;
    ctx.save();ctx.font='10px sans-serif';
    const maxW=72;
    const parts=title.split(/(?=[/(])/);
    const lineArr=[];let cur='';
    for(const p of parts){
      const test=cur+p;
      if(ctx.measureText(test).width>maxW&&cur){lineArr.push(cur);cur=p;}else cur=test;
    }
    if(cur)lineArr.push(cur);
    const lineH=12,pad=4;
    const boxW=Math.min(maxW,Math.max(...lineArr.map(l=>ctx.measureText(l).width)))+8;
    const boxH=lineArr.length*lineH+pad*2;
    let bx=topX-boxW/2;
    bx=Math.max(ca.left+2,Math.min(ca.right-boxW-2,bx));
    const by=Math.max(ca.top+2,topY-boxH-6);
    ctx.fillStyle='rgba(255,255,255,0.97)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,boxW,boxH,4);else ctx.rect(bx,by,boxW,boxH);
    ctx.fill();ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle='#333';ctx.textAlign='left';ctx.textBaseline='top';
    lineArr.forEach((l,li)=>ctx.fillText(l,bx+4,by+pad+li*lineH));
    ctx.restore();
    _cbLabelHits[pid].push({i,bx,by,bw:boxW,bh:boxH});
  });
}};

const CB_DonutPlugin={id:'cbDonutPlugin',afterDatasetsDraw(ch){
  if(!ch._cbDonutNums)return;
  const ctx=ch.ctx;const mode=ch._cbDonutMode||'direct';
  const pid=ch._cbPid;const s=getCBState(pid);
  const cx=(ch.chartArea.left+ch.chartArea.right)/2;
  const cy=(ch.chartArea.top+ch.chartArea.bottom)/2;
  // ── STEP 1: Collect ALL labels first (outside datasets loop) ──
  const allItems=[];
  ch.data.datasets.forEach((ds,di)=>{
    const meta=ch.getDatasetMeta(di);
    const total=ds.data.reduce((a,b)=>a+b,0);
    let dsLabels=[];
    if(s._varKeys&&s._varKeys[di]){
      const vk=s._varKeys[di];
      const vd=s._varData&&s._varData[vk];
      if(vd){
        if(vd.type==='number'){const vi2=s._vars&&s._vars.find(v=>v.key===vk);dsLabels=[vi2?vi2.label:vk];}
        else dsLabels=vd.options||[];
      }
    }
    const colorArr=cbGetStops(cbGetGroupColors(di),ds.data.length);
    meta.data.forEach((arc,i)=>{
      const v=ds.data[i];if(!v)return;
      const pct=Math.round(v/total*100);
      const angle=(arc.startAngle+arc.endAngle)/2;
      const span=arc.endAngle-arc.startAngle;
      const col=colorArr[i%colorArr.length];
      if(mode==='direct'){
        if(span<0.3)return;
        const r=(arc.outerRadius+arc.innerRadius)/2;
        ctx.save();ctx.font='500 10px sans-serif';
        ctx.fillStyle='rgba(255,255,255,.65)';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(v+'次('+pct+'%)',cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);ctx.restore();
      } else {
        if(span<0.12)return;
        allItems.push({arc,i,v,pct,col,name:dsLabels[i]||'',angle,span});
      }
    });
  });

  if(mode==='direct')return;

  // ── STEP 2: Assign line lengths — start short, extend if overlap ──
  ctx.font="10px 'Nunito',sans-serif";
  const W=ch.chartArea.right-ch.chartArea.left;
  const H=ch.chartArea.bottom-ch.chartArea.top;

  // Build label list with positions
  const labels=allItems.map(item=>{
    const outerR=item.arc.outerRadius;
    const isRight=Math.cos(item.angle)>=0;
    // Start with short extension
    const ext=28;
    const p2x=cx+Math.cos(item.angle)*(outerR+ext);
    const p2y=cy+Math.sin(item.angle)*(outerR+ext);
    const hLen=28;
    const p3x=p2x+(isRight?hLen:-hLen);
    const str=item.name+'  '+item.v+'次('+item.pct+'%)';
    const tw=ctx.measureText(str).width+8;
    return{...item,isRight,ext,hLen,p3x,p3y:p2y,str,tw,th:13,outerR};
  });

  // ── STEP 3: Detect overlaps and extend offending labels ──────
  // Repeat up to 15 passes
  for(let pass=0;pass<15;pass++){
    let anyOverlap=false;
    for(let a=0;a<labels.length;a++){
      for(let b=a+1;b<labels.length;b++){
        const la=labels[a],lb=labels[b];
        if(la.isRight!==lb.isRight)continue;
        // Check if label boxes overlap
        const axL=la.isRight?la.p3x+3:la.p3x-la.tw-3;
        const axR=axL+la.tw;
        const ayT=la.p3y-la.th/2;
        const ayB=la.p3y+la.th/2;
        const bxL=lb.isRight?lb.p3x+3:lb.p3x-lb.tw-3;
        const bxR=bxL+lb.tw;
        const byT=lb.p3y-lb.th/2;
        const byB=lb.p3y+lb.th/2;
        const xOk=axR<bxL||bxR<axL;
        const yOk=ayB+2<byT||byB+2<ayT;
        if(!xOk&&!yOk){
          anyOverlap=true;
          // Extend the one closer to centre angle π (more horizontal)
          const absA=Math.abs(Math.sin(la.angle));
          const absB=Math.abs(Math.sin(lb.angle));
          const target=absA<absB?la:lb;
          target.ext+=12;
          target.hLen+=10;
          // Recompute position
          const p2x2=cx+Math.cos(target.angle)*(target.outerR+target.ext);
          const p2y2=cy+Math.sin(target.angle)*(target.outerR+target.ext);
          target.p3x=p2x2+(target.isRight?target.hLen:-target.hLen);
          target.p3y=p2y2;
        }
      }
    }
    if(!anyOverlap)break;
  }

  // ── STEP 4: Draw all labels ───────────────────────────────────
  labels.forEach(item=>{
    const{arc,angle,v,pct,col,name,isRight,ext,hLen,str,tw,th,outerR,p3x,p3y}=item;
    const midR=(arc.outerRadius+arc.innerRadius)/2;
    const p0x=cx+Math.cos(angle)*midR,p0y=cy+Math.sin(angle)*midR;
    const p1x=cx+Math.cos(angle)*(outerR+3),p1y=cy+Math.sin(angle)*(outerR+3);
    const p2x=cx+Math.cos(angle)*(outerR+ext),p2y=cy+Math.sin(angle)*(outerR+ext);
    const bx=isRight?p3x+3:p3x-tw-3,by=p3y-th/2;
    ctx.save();
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p0x,p0y);ctx.lineTo(p1x,p1y);ctx.lineTo(p2x,p2y);ctx.lineTo(p3x,p3y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.97)';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(bx,by,tw,th,3);else ctx.rect(bx,by,tw,th);
    ctx.fill();ctx.strokeStyle=col+'55';ctx.lineWidth=.5;ctx.stroke();
    ctx.fillStyle=col;ctx.font="500 10px 'Nunito',sans-serif";
    ctx.textAlign=isRight?'left':'right';ctx.textBaseline='middle';
    ctx.fillText(str,isRight?bx+4:bx+tw-4,p3y);
    ctx.restore();
  });
}};

// ── Get data for a variable key ───────────────────────────────────
function cbGetVarData(pid,varKey,pe,p){
  const counts={};
  if(varKey==='_date'){
    pe.forEach(e=>{const parts=e.dateKey.split('-');const lbl=parts[1]+'/'+parts[2]+'/'+parts[0];counts[lbl]=(counts[lbl]||0)+1;});
  } else if(varKey==='_title'){
    pe.forEach(e=>{if(!e.title||!e.title.trim())return;const lbl=e.title.trim();counts[lbl]=(counts[lbl]||0)+1;});
  } else {
    const f=(p.fields||[]).find(x=>x.id===varKey);
    pe.forEach(e=>{
      if(e.skipped&&e.skipped[varKey])return;
      const v=e.fields&&e.fields[varKey];if(!v)return;
      String(v).split(',').map(x=>x.trim()).filter(Boolean).forEach(val=>{counts[val]=(counts[val]||0)+1;});
    });
  }
  return counts;
}

function initChartBuilder(pid,p,pe){
  const s=getCBState(pid);
  // Only show actual project fields (no _date, no _title in selector)
  const vars=[];
  (p.fields||[]).forEach(f=>vars.push({key:f.id,label:f.label,field:f}));
  s._vars=vars;s._pe=pe;s._p=p;
  // X axis = sorted dates
  s._dates=[...new Set(pe.map(e=>e.dateKey))].sort();
  // titles per date (first entry of that day)
  s._titles=s._dates.map(dk=>{
    const dayEntries=(entries[dk]||[]).filter(e=>e.projId===p.id);
    const t=dayEntries.find(e=>e.title&&e.title.trim());
    return t?t.title.trim():'';
  });
  // Precompute per-field data
  s._varData={};
  vars.forEach(v=>{
    const f=v.field;
    if(f&&f.type==='number'){
      // number: sum per date
      const perDate={};
      s._dates.forEach(dk=>{
        const dayEntries=(entries[dk]||[]).filter(e=>e.projId===p.id);
        let total=0;
        dayEntries.forEach(e=>{
          if(e.skipped&&e.skipped[f.id])return;
          const val=e.fields&&e.fields[f.id];
          if(val!==undefined&&val!=='')total+=parseFloat(val)||0;
        });
        perDate[dk]=total;
      });
      s._varData[v.key]={type:'number',perDate};
    } else {
      // select: count each option per date
      const options=new Set();
      pe.forEach(e=>{
        if(e.skipped&&e.skipped[v.key])return;
        const val=e.fields&&e.fields[v.key];if(!val)return;
        String(val).split(',').map(x=>x.trim()).filter(Boolean).forEach(o=>options.add(o));
      });
      const perOption={};
      options.forEach(opt=>{
        const perDate={};
        s._dates.forEach(dk=>{
          const dayEntries=(entries[dk]||[]).filter(e=>e.projId===p.id);
          let n=0;
          dayEntries.forEach(e=>{
            if(e.skipped&&e.skipped[v.key])return;
            const val=e.fields&&e.fields[v.key];if(!val)return;
            if(String(val).split(',').map(x=>x.trim()).includes(opt))n++;
          });
          perDate[dk]=n;
        });
        perOption[opt]=perDate;
      });
      // total per option across all dates
      const totals={};
      options.forEach(opt=>{totals[opt]=Object.values(perOption[opt]).reduce((a,b)=>a+b,0);});
      s._varData[v.key]={type:'select',options:[...options],perOption,totals};
    }
  });

  const varRow=document.getElementById('cb-vars-'+pid);if(!varRow)return;
  varRow.innerHTML='';
  if(!vars.length){
    varRow.innerHTML='<span style="font-size:11px;color:var(--mid);font-style:italic">这个项目还没有自定义栏位</span>';
    return;
  }
  vars.forEach(v=>{
    const chip=document.createElement('button');
    chip.className='cb-var-chip';chip.textContent=v.label;chip.dataset.key=v.key;
    chip.onclick=()=>{
      const idx=s.varKeys.indexOf(v.key);
      if(idx>=0){s.varKeys.splice(idx,1);chip.classList.remove('on');}
      else{s.varKeys.push(v.key);chip.classList.add('on');}
      cbRenderFull(pid);
    };
    varRow.appendChild(chip);
  });
  // Default: select all variables
  if(!s.varKeys.length){
    vars.forEach(v=>{
      s.varKeys.push(v.key);
      const chip=varRow.querySelector('[data-key="'+v.key+'"]');
      if(chip)chip.classList.add('on');
    });
  }
  cbRenderFull(pid);
}

function cbRenderFull(pid){

function cbRenderBar(pid){
  const s=getCBState(pid);
  if(!s.varKeys.length)return;
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  if(window.charts&&window.charts[pid]){window.charts[pid].destroy();delete window.charts[pid];}
  const type=s.chartType;

  const ds=[];
  const lgGroups=[];
  const spGroups=[];

  s.varKeys.forEach((vk,vi)=>{
    const varInfo=s._vars.find(v=>v.key===vk);
    const vdata=s._varData[vk];
    if(!vdata)return;
    const rawStops=cbGetGroupColors(vi);

    if(vdata.type==='number'){
      // Number field: one bar per date showing the value
      const vals=s._dates.map(dk=>vdata.perDate[dk]||0);
      const col=rawStops[2];
      ds.push({label:varInfo.label,data:vals,
        backgroundColor:col+'CC',borderColor:col,borderWidth:1,
        stack:type==='stacked'?'v'+vi:'v'+vi+'_0',borderRadius:2});
      lgGroups.push({label:varInfo.label,items:[{name:varInfo.label,color:rawStops[2]}],vi});
      const total=vals.reduce((a,b)=>a+b,0);
      spGroups.push({label:varInfo.label,vi,items:[{name:varInfo.label,color:col,cnt:total,pct:100}]});
    } else {
      // Select field: one bar per option per date
      const opts=vdata.options;
      const total=opts.reduce((s,o)=>s+(vdata.totals[o]||0),0);
      const optColors=cbGetStops(rawStops,Math.min(opts.length,5));
      lgGroups.push({label:varInfo.label,items:opts.map((o,i)=>({name:o,color:optColors[i%optColors.length]})),vi});
      const spItems=[];
      opts.forEach((opt,i)=>{
        const col=optColors[i%optColors.length];
        const vals=s._dates.map(dk=>vdata.perOption[opt]?vdata.perOption[opt][dk]||0:0);
        ds.push({label:opt,data:vals,
          backgroundColor:col+'CC',borderColor:col,borderWidth:1,
          stack:type==='stacked'?'v'+vi:'v'+vi+'_'+i,borderRadius:2});
        spItems.push({name:opt,color:col,cnt:vdata.totals[opt]||0,pct:total?Math.round((vdata.totals[opt]||0)/total*100):0});
      });
      spGroups.push({label:varInfo.label,vi,items:spItems});
    }
  });

  // ── Legend ────────────────────────────────────────────────────
  const lgEl=document.getElementById('cb-legend-'+pid);
  if(lgEl){
    let h='';
    lgGroups.forEach(g=>{
      // Use the mid color of this group's palette for the title badge
      const midCol=g.items.length?g.items[Math.floor(g.items.length/2)].color:getGroupColors(g.vi)[2];
      const titleStyle=`background:${midCol}22;color:${midCol};border:.5px solid ${midCol}66`;
      h+=`<div style="margin-bottom:6px">
        <div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:4px;${titleStyle}">${g.label}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;padding-left:2px">
          ${g.items.map(it=>`<span style="display:flex;align-items:center;gap:3px;font-size:11px;color:#555"><span style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:${it.color}"></span>${it.name}</span>`).join('')}
        </div>
      </div>`;
    });
    lgEl.innerHTML=h;
  }

  // ── Side panel (image style: color dot + name + bold count + pct) ──
  const spEl=document.getElementById('cb-statpanel-'+pid);
  if(spEl){
    let h='<div style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#aaa;margin-bottom:10px">数据统计</div>';
    spGroups.forEach(g=>{
      const midSpCol=g.items.length?g.items[Math.floor(g.items.length/2)].color:getGroupColors(g.vi)[2];
      const titleStyle=`background:${midSpCol}22;color:${midSpCol};border:.5px solid ${midSpCol}66`;
      h+=`<div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:6px;${titleStyle}">${g.label}</div>`;
      g.items.forEach(it=>{
        h+=`<div style="display:flex;align-items:center;padding:5px 0;border-bottom:.5px solid #f0f0f0">
          <span style="width:9px;height:9px;border-radius:2px;flex-shrink:0;background:${it.color};margin-right:7px"></span>
          <span style="flex:1;font-size:12px;color:#444;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.name}</span>
          <span style="font-size:12px;font-weight:700;color:#222;margin-left:6px">${it.cnt}</span>
          <span style="font-size:11px;color:#aaa;margin-left:4px">${it.pct}%</span>
        </div>`;
      });
      h+='<div style="height:8px"></div>';
    });
    spEl.innerHTML=h;
  }

  // ── Y max with buffer for title labels ────────────────────────
  const allSums=s._dates.map((_,i)=>{
    const stacks={};
    ds.forEach(d=>{stacks[d.stack]=(stacks[d.stack]||0)+(d.data[i]||0);});
    return Math.max(...Object.values(stacks),0);
  });
  const dataMax=Math.max(...allSums,1);
  const yMax=s.showTitles?Math.ceil(dataMax+Math.max(3,dataMax*0.35)):undefined;

  const dateLabels=s._dates.map(dk=>{const pts=dk.split('-');return pts[1]+'/'+pts[2]+'/'+pts[0];});

  if(!window.charts)window.charts={};
  window.charts[pid]=new Chart(canvas,{
    type:'bar',data:{labels:dateLabels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:ctx=>dateLabels[ctx[0]?.dataIndex],
        label:ctx=>' '+ctx.dataset.label+': '+ctx.parsed.y+(s._varData[s.varKeys[0]]?.type==='number'?'':' 次')
      }}},
      scales:{
        x:{stacked:type==='stacked',grid:{display:false},ticks:{font:{size:10,family:"'Nunito',sans-serif"},color:'#999',maxRotation:30}},
        y:{stacked:type==='stacked',max:yMax,grid:{color:'rgba(0,0,0,0.05)'},ticks:{font:{size:10,family:"'Nunito',sans-serif"},color:'#999',stepSize:1}}
      }},plugins:[CB_NumPlugin,CB_TitlePlugin]
  });
  window.charts[pid]._cbNums=s.showNums;
  window.charts[pid]._cbTitles=s.showTitles;
  window.charts[pid]._cbPid=pid;
  window.charts[pid]._dates=dateLabels;
  window.charts[pid]._titles=s._titles;
  canvas.onclick=(e)=>{cbOnCanvasClick(e,pid);};
}

function cbRenderDonut(pid){
  const s=getCBState(pid);
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  if(window.charts&&window.charts[pid]){window.charts[pid].destroy();delete window.charts[pid];}

  const ds=[];const allLabels=[];
  s._varKeys=[];
  s.varKeys.forEach((vk,vi)=>{
    const vdata=s._varData[vk];if(!vdata)return;
    const groupColors=cbGetGroupColors(vi);
    const groupColorsA=groupColors.map(c=>c+'CC');
    let labels=[];let vals=[];
    if(vdata.type==='number'){
      const total=Object.values(vdata.perDate).reduce((a,b)=>a+b,0);
      const varInfo=s._vars.find(v=>v.key===vk);
      labels=[varInfo?varInfo.label:vk];vals=[total];
    } else {
      labels=vdata.options;
      vals=labels.map(o=>vdata.totals[o]||0);
    }
    const pickedColors=cbGetStops(groupColors,labels.length);
    const pickedA=pickedColors.map(c=>c+'CC');
    ds.push({data:vals,backgroundColor:pickedA,borderColor:pickedColors,borderWidth:2});
    labels.forEach(l=>allLabels.push(l));
    s._varKeys[vi]=vk;
  });
  const lgEl=document.getElementById('cb-legend-'+pid);
  if(lgEl){
    let h='';
    s.varKeys.forEach((vk,vi)=>{
      const varInfo=s._vars.find(v=>v.key===vk);
      const lbl=varInfo?varInfo.label:vk;
      const vdata=s._varData[vk];if(!vdata)return;
      const groupColors=cbGetGroupColors(vi);
      const rawOpts=vdata.type==='number'?[lbl]:vdata.options;
      const optColorsLg=cbGetStops(groupColors,Math.min(rawOpts.length,5));
      const items=rawOpts;
      const ringLabel=s.varKeys.length>1?(vi===0?'外圈':'内圈'):'';
      const midDonutCol=optColorsLg[Math.floor(optColorsLg.length/2)]||optColorsLg[0];
      const titleSt=`background:${midDonutCol}22;color:${midDonutCol};border:.5px solid ${midDonutCol}66`;
      h+=`<div style="margin-bottom:6px">
        <div style="font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;display:inline-block;margin-bottom:4px;${titleSt}">${lbl}${ringLabel?' ('+ringLabel+')':''}</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px;padding-left:2px">
          ${items.map((n,i)=>`<span style="display:flex;align-items:center;gap:3px;font-size:11px;color:#555"><span style="width:8px;height:8px;border-radius:2px;flex-shrink:0;background:${optColorsLg[i%optColorsLg.length]}"></span>${n}</span>`).join('')}
        </div>
      </div>`;
    });
    lgEl.innerHTML=h;
  }
  const pad=(s.showDonutNums&&s.donutMode==='line')?65:10;
  if(!window.charts)window.charts={};
  window.charts[pid]=new Chart(canvas,{
    type:'doughnut',data:{labels:allLabels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,cutout:'30%',
      layout:{padding:pad},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return' '+ctx.label+': '+ctx.parsed+'次('+Math.round(ctx.parsed/t*100)+'%)';}}}}
    },plugins:[CB_DonutPlugin]
  });
  window.charts[pid]._cbDonutNums=s.showDonutNums;
  window.charts[pid]._cbDonutMode=s.donutMode;
  window.charts[pid]._cbPid=pid;
}

function cbOnCanvasClick(e,pid){
  const s=getCBState(pid);
  if(!s.showTitles)return;
  const canvas=document.getElementById('cb-canvas-'+pid);if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
  const cx=(e.clientX-rect.left)*scaleX,cy=(e.clientY-rect.top)*scaleY;
  const hits=_cbLabelHits[pid]||[];
  for(const h of hits){
    if(cx>=h.bx&&cx<=h.bx+h.bw&&cy>=h.by&&cy<=h.by+h.bh){
      cbShowTitleEdit(e.clientX,e.clientY,h.i,pid,rect);return;
    }
  }
}

function cbShowTitleEdit(clientX,clientY,idx,pid,canvasRect){
  const s=getCBState(pid);
  const old=document.getElementById('cb-title-inp-'+pid);if(old)old.remove();
  const wrap=document.getElementById('cb-chart-wrap-'+pid);if(!wrap)return;
  const wRect=wrap.getBoundingClientRect();
  const inp=document.createElement('input');
  inp.id='cb-title-inp-'+pid;
  inp.style.cssText='position:absolute;z-index:20;border:.5px solid #7B68EE;border-radius:4px;background:#fff;color:#333;font-size:11px;font-family:sans-serif;padding:3px 7px;outline:none;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:80px';
  inp.style.left=(clientX-wRect.left-40)+'px';
  inp.style.top=(clientY-wRect.top-32)+'px';
  const rawTitle=s._titles&&s._titles[idx]||'';
  inp.value=s.displayTitles[idx]!==undefined?s.displayTitles[idx]:rawTitle;
  wrap.appendChild(inp);inp.focus();inp.select();
  const finish=()=>{
    const v=inp.value.trim();
    s.displayTitles[idx]=v;
    inp.remove();cbRenderFull(pid);
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')finish();if(e.key==='Escape')inp.remove();});
  inp.addEventListener('blur',finish);
}

function cbTogDNums(pid){const s=getCBState(pid);s.showDonutNums=!s.showDonutNums;document.getElementById('cb-dnums-'+pid)?.classList.toggle('on',s.showDonutNums);const dm=document.getElementById('cb-dmode-'+pid);if(dm)dm.style.opacity=s.showDonutNums?1:.35;cbRenderDonut(pid);}

function cbToggleAdd(pid){
  const s=getCBState(pid);const type=s.chartType;
  const key=type+'-'+s.varKeys.join('_');
  const existing=s.selected.findIndex(x=>x.key===key);
  if(existing>=0){s.selected.splice(existing,1);}
  else{s.selected.push({key,type,varKeys:[...s.varKeys],label:s.varKeys.map(vk=>{const vi=s._vars.find(v=>v.key===vk);return vi?vi.label:vk;}).join(' + ')+' — '+{stacked:'堆叠柱状',grouped:'并排柱状',donut:'嵌套环形'}[type]});}
  cbRenderSelectedList(pid);
  const btn=document.getElementById('cb-addbtn-'+pid);
  if(btn){const added=s.selected.some(x=>x.key===key);btn.classList.toggle('on',added);btn.textContent=added?'✓ 已选中':'＋ 加入导出';}

function cbRenderSelectedList(pid){

}

function cbExportDocx(pid){
  const s=getCBState(pid);const p=s._p;
  const docxLib=window.docx;
  if(!docxLib){alert('DOCX 库尚未加载完成，请稍等几秒后再试');return;}
  const{Document,Packer,Paragraph,TextRun,ImageRun,BorderStyle}=docxLib;
  const PURPLE='7B68EE',DARK='2D2B3D',MID='5A5870';
  const statusLabel={active:'进行中',done:'已完成',archived:'已归档'};
  const children=[];
  children.push(new Paragraph({children:[new TextRun({text:p.name+' — 项目追踪报告',bold:true,size:32,color:PURPLE,font:'Arial'})],spacing:{before:0,after:80},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:PURPLE,space:4}}}));
  children.push(new Paragraph({children:[new TextRun({text:'状态: '+statusLabel[p.status||'active']+'   总记录: '+(s._pe||[]).length+' 条   导出: '+new Date().toLocaleDateString('zh-CN'),size:18,color:MID,font:'Arial'})],spacing:{before:60,after:160}}));
  const canvas=document.getElementById('cb-canvas-'+pid);
  if(canvas){
    try{
      const dataUrl=canvas.toDataURL('image/png');
      const base64=dataUrl.split(',')[1];
      children.push(new Paragraph({children:[new TextRun({text:'统计图表',bold:true,size:22,color:PURPLE,font:'Arial'})],spacing:{before:100,after:40}}));
      children.push(new Paragraph({children:[new ImageRun({data:Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),transformation:{width:480,height:220}})],spacing:{before:0,after:80}}));

function exportTracker(pid,type){
  const p=proj(pid);
  const pe=[];
  Object.entries(entries).forEach(([dk2,arr])=>arr.forEach(e=>{if(e.projId===pid)pe.push({...e,dateKey:dk2});}));
  pe.sort((a,b)=>a.dateKey.localeCompare(b.dateKey));
  const statusLabel={active:'进行中',done:'已完成',archived:'已归档'};
  if(type==='docx'){
    try{
      const docxLib=window.docx;if(!docxLib){alert('DOCX 库尚未加载完成，请稍等几秒后再试');return;}
      const {Document,Packer,Paragraph,TextRun,AlignmentType,BorderStyle}=docxLib;
      const PURPLE='7B68EE',DARK='2D2B3D',MID='5A5870';
      const children=[];
      children.push(new Paragraph({children:[new TextRun({text:p.name+' — 项目追踪报告',bold:true,size:32,color:PURPLE,font:'Arial'})],spacing:{before:0,after:80},border:{bottom:{style:BorderStyle.SINGLE,size:4,color:PURPLE,space:4}}}));
      children.push(new Paragraph({children:[new TextRun({text:'状态: '+statusLabel[p.status||'active']+'   |   总记录: '+pe.length+' 条   |   导出日期: '+new Date().toLocaleDateString('zh-CN'),size:18,color:MID,font:'Arial'})],spacing:{before:60,after:160}}));
      pe.forEach(e=>{
        const parts=e.dateKey.split('-');
        const dateStr=parts[0]+'年'+parts[1]+'月'+parts[2]+'日';
        children.push(new Paragraph({children:[new TextRun({text:'📅 '+dateStr,bold:true,size:20,color:PURPLE,font:'Arial'})],spacing:{before:140,after:30}}));
        if(e.title&&e.title.trim())children.push(new Paragraph({children:[new TextRun({text:e.title.trim(),bold:true,size:22,color:DARK,font:'Arial'})],spacing:{before:0,after:20},indent:{left:240}}));
        (p.fields||[]).forEach(f=>{
          if(e.skipped&&e.skipped[f.id])return;
          const v=e.fields&&e.fields[f.id];if(!v)return;
          children.push(new Paragraph({children:[new TextRun({text:f.label+': '+v,size:18,color:MID,font:'Arial'})],spacing:{before:10,after:10},indent:{left:480}}));
        });
        if(e.note)children.push(new Paragraph({children:[new TextRun({text:'备注: '+e.note,size:18,color:MID,italics:true,font:'Arial'})],spacing:{before:10,after:10},indent:{left:480}}));
        children.push(new Paragraph({children:[new TextRun({text:'Cat Token: +'+calcCoins(e,e.dateKey),size:16,color:'854F0B',font:'Arial'})],spacing:{before:6,after:6},indent:{left:480}}));
      });
      const doc=new Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1440,right:1440,bottom:1440,left:1440}}},children}]});
      Packer.toBase64String(doc).then(b64=>{
        triggerDownload('data:application/vnd.openxmlformats-officedocument.wordprocessingml.document;base64,'+b64,p.name+'_tracker.docx');
      }).catch(err=>{alert('DOCX 生成失败: '+err.message);});
    }catch(err){alert('请稍候再试，docx 库加载中: '+err.message);}
  } else if(type==='txt'){
    let txt='项目追踪报告\n项目: '+p.name+'\n状态: '+statusLabel[p.status||'active']+'\n总记录: '+pe.length+'\n\n';
    pe.forEach(e=>{
      const parts=e.dateKey.split('-');
      txt+=parts[0]+'年'+parts[1]+'月'+parts[2]+'日\n'+(e.title&&e.title.trim()?'  '+e.title.trim()+'\n':'');
      (p.fields||[]).forEach(f=>{if(e.skipped&&e.skipped[f.id])return;const v=e.fields&&e.fields[f.id];if(!v)return;txt+='  '+f.label+': '+v+'\n';});
      if(e.note)txt+='  备注: '+e.note+'\n';txt+='\n';
    });
    try{
      triggerDownload('data:text/plain;charset=utf-8,'+encodeURIComponent(txt),p.name+'_tracker.txt');
    }catch(err){
      const w=window.open('','_blank');
      if(w){w.document.write('<pre>'+txt.replace(/</g,'&lt;')+'</pre>');w.document.close();}
      else{alert('请允许弹窗，或复制以下内容：\n\n'+txt);}
    }
  } else {
    let html='<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:sans-serif;padding:40px;color:#2d2b3d;max-width:700px;margin:0 auto}h1{color:#7B68EE;border-bottom:2px solid #7B68EE;padding-bottom:8px}.meta{font-size:12px;color:#888;margin-bottom:20px}.entry{border-left:3px solid #7B68EE;padding:8px 16px;margin:10px 0;background:#f9f9ff;border-radius:0 8px 8px 0}.date{color:#7B68EE;font-weight:700;font-size:13px}.title{font-size:14px;font-weight:600;margin:4px 0}.tag{display:inline-block;background:#EEEDFE;color:#7B68EE;padding:2px 8px;border-radius:999px;font-size:11px;margin:2px}.note{font-size:12px;color:#5a5870;font-style:italic;margin-top:4px}@media print{body{padding:20px}}</style></head><body>';
    html+='<h1>'+p.name+'</h1><div class="meta">状态: '+statusLabel[p.status||'active']+' | 总记录: '+pe.length+' | 导出: '+new Date().toLocaleDateString('zh-CN')+'</div>';
    pe.forEach(e=>{
      const parts=e.dateKey.split('-');let f='';
      (p.fields||[]).forEach(fld=>{if(e.skipped&&e.skipped[fld.id])return;const v=e.fields&&e.fields[fld.id];if(!v)return;f+='<span class="tag">'+fld.label+': '+v+'</span>';});
      html+='<div class="entry"><div class="date">'+parts[0]+'年'+parts[1]+'月'+parts[2]+'日</div>'+(e.title&&e.title.trim()?'<div class="title">'+e.title.trim()+'</div>':'')+(f?'<div>'+f+'</div>':'')+(e.note?'<div class="note">'+e.note+'</div>':'')+'</div>';
    });
    html+='<script>window.onload=function(){window.print();}<\/script></body></html>';
    try{
      triggerDownload('data:text/html;charset=utf-8,'+encodeURIComponent(html),p.name+'_tracker.html');
    }catch(err){
      const w=window.open('about:blank','_blank');
      if(w){w.document.open();w.document.write(html);w.document.close();}
      else{alert('请允许浏览器弹窗以打印报告');}
    }
  }
}

function renderAll(){
  recalcTotalCoins();syncNav();
  renderSidebar();
  if(view==='stats')renderStats();
  else if(view==='tracker')renderTracker();
  else renderJournal();
  renderDayStats();
  const el=document.getElementById('f-title');
  if(el&&formTitle)el.value=formTitle;
  const elNote=document.getElementById('f-note');
  if(elNote&&formNote)elNote.value=formNote;
  const elLink=document.getElementById('f-link');
  if(elLink&&formLink)elLink.value=formLink;
  const elLabel=document.getElementById('f-linklabel');
  if(elLabel&&formLinkLabel)elLabel.value=formLinkLabel;
}

function renderDayStats(){
  const key=dk(selDate);
  const dayEs=entries[key]||[];
  document.getElementById('st-total').textContent=dayEs.length;
  const todayCoins=dayEs.reduce((s,e)=>s+calcCoins(e,key),0);
  document.getElementById('st-coins').textContent=todayCoins;
}

function renderSidebar(){
  const ws=getWeekStart(),we=new Date(ws);we.setDate(we.getDate()+6);
  document.getElementById('week-range').textContent=(ws.getMonth()+1)+'月'+ws.getDate()+'–'+(we.getMonth()+1)+'月'+we.getDate();
  const dl=document.getElementById('day-list');dl.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const key=dk(d),isSel=key===dk(selDate),isT=key===todayKey,isFut=d>today,cnt=(entries[key]||[]).length;
    const div=document.createElement('div');div.className='day-item'+(isSel?' active':'');div.style.opacity=isFut?.4:1;
    if(!isFut)div.onclick=()=>{selDate=new Date(d);view='journal';editingId=null;renderAll()};
    const dm=(d.getMonth()+1)+'/'+d.getDate();
    div.innerHTML=`<div class="day-dot${cnt?' has':''}"></div><span class="day-name">${DAYS[d.getDay()]} <span style="font-size:10px;opacity:.6">${dm}</span>${isT?' · 今天':''}</span>${cnt?`<span class="day-cnt">${cnt}</span>`:''}`;
    dl.appendChild(div);
  }
  const pl=document.getElementById('proj-list');pl.innerHTML='';
  projects.forEach((p,idx)=>{
    const div=document.createElement('div');
    div.className='proj-item';div.draggable=true;div.dataset.idx=idx;div.title=p.name;
    div.innerHTML=`<span class="proj-drag-handle" title="拖动排序">⠿</span><div class="proj-dot" style="background:${p.color}"></div><span class="proj-name">${p.name}</span>${p.name.length>14?`<span class="proj-tooltip">${p.name}</span>`:''}`;
    div.onclick=(e)=>{if(!div._dragged)openEditProject(p.id);div._dragged=false;};
    div.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(idx));setTimeout(()=>div.classList.add('dragging'),0);});
    div.addEventListener('dragend',()=>{div.classList.remove('dragging');document.querySelectorAll('.proj-item').forEach(el=>el.classList.remove('drag-over'));div._dragged=true;});
    div.addEventListener('dragover',e=>{e.preventDefault();document.querySelectorAll('.proj-item').forEach(el=>el.classList.remove('drag-over'));div.classList.add('drag-over');});
    div.addEventListener('dragleave',()=>div.classList.remove('drag-over'));
    div.addEventListener('drop',e=>{
      e.preventDefault();div.classList.remove('drag-over');
      const from=parseInt(e.dataTransfer.getData('text/plain'));const to=idx;
      if(from===to)return;
      const moved=projects.splice(from,1)[0];projects.splice(to,0,moved);
      saveData();renderAll();
    });
    pl.appendChild(div);
  });
}

function renderJournal(){
  const key=dk(selDate),isToday=key===todayKey,d=selDate;
  document.getElementById('page-date').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+WD[d.getDay()]+(isToday?' · 今天':'');
  const area=document.getElementById('main-area');area.innerHTML='';
  if(showForm)area.appendChild(buildNewForm());
  const dayEs=entries[key]||[];
  if(!dayEs.length&&!showForm){
    const em=document.createElement('div');em.className='empty-hint';
    em.innerHTML=`<div style="font-size:32px;margin-bottom:10px;opacity:.3">✦</div>这天还没有记录<br><span style="font-size:12px;margin-top:4px;display:block;color:var(--mid)">${isToday?'点右上角「新记录」开始':'可以补填，Token 减半'}</span>`;
    area.appendChild(em);return;
  }
  const byProj={};
  dayEs.forEach(e=>{if(!byProj[e.projId])byProj[e.projId]=[];byProj[e.projId].push(e)});
  Object.keys(byProj).forEach(pid=>{
    const p=proj(pid),sec=document.createElement('div');
    const lbl=document.createElement('div');lbl.className='sec-label';
    lbl.innerHTML=`<div class="sec-dot" style="background:${p.color}"></div>${p.name}`;
    sec.appendChild(lbl);
    byProj[pid].forEach(e=>{
      if(editingId===e.id)sec.appendChild(buildEditForm(e,p));
      else sec.appendChild(buildCard(e,p));
    });
    area.appendChild(sec);
  });
}

function buildCard(e,p){
  const card=document.createElement('div');card.className='entry-card';
  let fHTML='';
  (p.fields||[]).forEach(f=>{
    if(e.skipped&&e.skipped[f.id])return;
    const v=e.fields&&e.fields[f.id];if(!v)return;
    if(f.type==='number')fHTML+=`<span class="ec-field">· ${f.label}: <strong>${v}</strong></span>`;
    else{const tags=String(v).split(',').map(s=>s.trim()).filter(Boolean);fHTML+=tags.map(t=>`<span class="ec-selval">${t}</span>`).join('');}
  });
  const coins=calcCoins(e, dk(selDate));
  card.innerHTML=`<div class="ec-inner">
    <div class="proj-badge" style="background:rgba(${hexRgb(p.color)},.12);color:${p.color};border:0.5px solid rgba(${hexRgb(p.color)},.3)">${p.name}</div>
    <div class="ec-body">
      ${e.title&&e.title.trim()?`<div class="ec-title">${e.title}</div>`:''}
      <div class="ec-meta">${fHTML}${e.link?`<a href="${e.link}" target="_blank" style="font-size:11px;color:var(--cyan);text-decoration:none">↗ ${e.linkLabel||'链接'}</a>`:''}</div>
      ${e.note?`<div class="ec-note">${e.note}</div>`:''}
    </div>
    <span class="ec-coin">${dk(selDate)!==todayKey?'½ ':''} 🐾 +${coins}</span>
    <div class="ec-acts">
      <button class="ec-act" title="编辑" onclick="startEdit(${e.id},'${dk(selDate)}')">✎</button>
      <button class="ec-act" title="删除" onclick="deleteEntry('${dk(selDate)}',${e.id})">✕</button>
    </div>
  </div>`;
  return card;
}

function startEdit(id,key){
  const e=(entries[key]||[]).find(x=>x.id===id);if(!e)return;
  editingId=id;
  const p=proj(e.projId);
  const editFields={};
  Object.keys(e.fields||{}).forEach(k=>{
    const f=p.fields&&p.fields.find(x=>x.id===k);
    if(f&&f.type==='select'){
      const v=e.fields[k];
      editFields[k]=typeof v==='string'?v.split(',').map(s=>s.trim()).filter(Boolean):v;
    } else {
      editFields[k]=e.fields[k];
    }
  });
  editState={title:e.title,projId:e.projId||'',fields:editFields,skipped:{...(e.skipped||{})},note:e.note||'',link:e.link||'',linkLabel:e.linkLabel||'',showNote:!!(e.note),showLink:!!(e.link),showProjPicker:false};
  openDropId=null;renderAll();
  setTimeout(()=>{const el=document.getElementById('edit-title');if(el)el.focus()},50);
}

function buildEditForm(e,p){
  const wrap=document.createElement('div');wrap.className='form-card';
  const es=editState;
  const isMissingProj=!es.projId||es.projId==='';
  let editPpHTML='';
  if(isMissingProj&&es.showProjPicker){
    editPpHTML=`<div class="proj-picker" style="margin-bottom:8px">
      <div style="font-size:10px;font-weight:800;color:var(--mid);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">重新选择 Project / Task</div>
      <div>${projects.filter(pr=>(pr.status||'active')!=='archived').map(pr=>`<div class="pp-item${es.projId===pr.id?' sel':''}" onclick="editState.projId='${pr.id}';editState.showProjPicker=false;renderAll()"><div style="width:8px;height:8px;border-radius:50%;background:${pr.color};flex-shrink:0"></div>${pr.name}</div>`).join('')}</div>
    </div>`;
  }
  let varsHTML='';
  (p.fields||[]).forEach(f=>{
    const isSkip=es.skipped[f.id],curVal=es.fields[f.id]||'',isOpen=openDropId===('ed-'+f.id);
    if(f.type==='number'){
      varsHTML+=`<div class="var-row"><span class="var-label">${f.label}</span>
        <div class="var-val">${isSkip?`<span class="skipped-label">已跳过</span>`:`<div style="display:flex;align-items:center;gap:5px"><input type="number" id="edf-${f.id}" value="${curVal}" min="0" style="width:80px;font-size:13px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.25);border-radius:8px;padding:5px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none" oninput="editState.fields['${f.id}']=this.value">${f.unit?`<span style="font-size:12px;color:var(--mid);font-weight:600">${f.unit}</span>`:''}</div>`}</div>
        <button class="skip-btn${isSkip?' skipped':''}" onclick="toggleEditSkip('${f.id}')">${isSkip?'＋':'✕'}</button></div>`;
    } else {
      const esArr=editState.fields[f.id]||[];
      const esDisplay=Array.isArray(esArr)&&esArr.length?esArr.join(', '):'选择…';
      varsHTML+=`<div class="var-row"><span class="var-label">${f.label}</span>
        <div class="var-val">${isSkip?`<span class="skipped-label">已跳过</span>`:`<div class="sel-wrap">
          <button class="sel-btn" onclick="toggleEditDrop('${f.id}')"><span style="color:${Array.isArray(esArr)&&esArr.length?'var(--dark)':'var(--mid)'}">${esDisplay}</span><span style="opacity:.4">▾</span></button>
          ${isOpen?`<div class="sel-dropdown">
            ${f.options.map(o=>{const arr=editState.fields[f.id]||[];const isSel=Array.isArray(arr)?arr.includes(o):arr===o;return`<div class="sd-opt${isSel?' sel':''}" style="display:flex;align-items:center;justify-content:space-between" onclick="pickEditOpt('${f.id}','${o}')">
              <span>${isSel?'✓ ':''} ${o}</span>
              <span onclick="event.stopPropagation();deleteEditOpt('${f.id}','${o}')" style="opacity:.4;cursor:pointer;padding:0 4px;font-size:12px" onmouseover="this.style.opacity=1;this.style.color='var(--pink)'" onmouseout="this.style.opacity=.4;this.style.color=''">✕</span>
            </div>`;}).join('')}
            <div class="sd-add"><input type="text" id="edsd-${f.id}" placeholder="添加新选项…" onclick="event.stopPropagation()" onkeydown="if(event.key==='Enter'){event.preventDefault();addEditOpt('${f.id}')}"><button class="sd-add-btn" onclick="addEditOpt('${f.id}')">添加</button></div>
          </div>`:''}</div>`}</div>
        <button class="skip-btn${isSkip?' skipped':''}" onclick="toggleEditSkip('${f.id}')">${isSkip?'＋':'✕'}</button></div>`;
    }
  });
  const projBadge=isMissingProj
    ?`<button class="proj-sel-btn error" onclick="editState.showProjPicker=!editState.showProjPicker;renderAll()" style="animation:none">⚠ 未选择 project <span style="opacity:.5">▾</span></button>`
    :`<div class="proj-sel-btn" style="cursor:default;opacity:.7"><div style="width:8px;height:8px;border-radius:50%;background:${p.color}"></div>${p.name}</div>`;
  wrap.innerHTML=`
    ${editPpHTML}
    <div class="form-row">
      ${projBadge}
      <input type="text" id="edit-title" value="${es.title}" autocomplete="off" placeholder="今天做了什么…" style="font-weight:700" oninput="editState.title=this.value">
    </div>
    ${varsHTML.length?`<div class="var-rows">${varsHTML}</div>`:''}
    <div class="extras-row">
      <div class="extra-toggle${es.showNote?' on':''}" onclick="editState.showNote=!editState.showNote;renderAll()">📝 备注</div>
      <div class="extra-toggle${es.showLink?' on':''}" onclick="editState.showLink=!editState.showLink;renderAll()">🔗 链接</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
      ${es.showNote?`<textarea class="ie-textarea" id="edit-note" rows="2" oninput="editState.note=this.value" placeholder="补充说明…">${es.note}</textarea>`:''}
      ${es.showLink?`<div style="display:flex;gap:6px"><input type="url" id="edit-link" value="${es.link}" placeholder="https://…" style="flex:2;font-size:12px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.2);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none" oninput="editState.link=this.value"><input type="text" id="edit-linklabel" value="${es.linkLabel}" placeholder="标签" style="flex:1;font-size:12px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.2);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none" oninput="editState.linkLabel=this.value"></div>`:''}
    </div>
    <div class="form-btns">
      <button class="f-cancel" onclick="cancelEdit()">取消</button>
      <button class="f-save" onclick="saveEdit(${e.id},'${dk(selDate)}')">✓ 保存</button>
    </div>`;
  return wrap;
}

function toggleEditSkip(fid){editState.skipped[fid]=!editState.skipped[fid];if(editState.skipped[fid])delete editState.fields[fid];openDropId=null;renderAll()}
function toggleEditDrop(fid){openDropId=openDropId===('ed-'+fid)?null:('ed-'+fid);renderAll()}
function pickEditOpt(fid,val){
  if(!editState.fields[fid])editState.fields[fid]=[];
  const arr=editState.fields[fid];
  const idx=arr.indexOf(val);
  if(idx>=0)arr.splice(idx,1); else arr.push(val);
  renderAll();
}
function addEditOpt(fid){
  const inp=document.getElementById('edsd-'+fid);if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const px=projects.find(pr=>pr.fields&&pr.fields.some(f=>f.id===fid));
  if(px){const f=px.fields.find(x=>x.id===fid);if(f&&!f.options.includes(v))f.options.push(v);}
  if(!editState.fields[fid])editState.fields[fid]=[];

function deleteEditOpt(fid,val){

  saveData();renderAll();

function cancelEdit(){editingId=null;editState={};openDropId=null;renderAll()}
function saveEdit(id,key){
  const e=(entries[key]||[]).find(x=>x.id===id);if(!e)return;
  e.title=editState.title||e.title;
  if(editState.projId&&editState.projId!==e.projId)e.projId=editState.projId;
  e.fields={...editState.fields};e.skipped={...editState.skipped};
  e.note=editState.note||'';e.link=editState.link||'';e.linkLabel=editState.linkLabel||'';
  editingId=null;editState={};openDropId=null;saveData();renderAll();
}
function deleteEntry(key,id){

function toggleSkip(fid){skippedFields[fid]=!skippedFields[fid];if(skippedFields[fid]&&window._fv)delete window._fv[fid];openDropId=null;renderAll()}
function toggleNewDrop(fid){openDropId=openDropId===('new-'+fid)?null:('new-'+fid);renderAll()}
function pickNewOpt(fid,val){
  if(!window._fv)window._fv={};
  if(!window._fv[fid])window._fv[fid]=[];
  const arr=window._fv[fid];
  const idx=arr.indexOf(val);
  if(idx>=0)arr.splice(idx,1); else arr.push(val);
  renderAll();
}
function addNewOpt(fid){
  const inp=document.getElementById('sdnew-'+fid);if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const px=proj(formProj);const f=px&&px.fields&&px.fields.find(x=>x.id===fid);
  if(f&&!f.options.includes(v))f.options.push(v);
  if(!window._fv)window._fv={};
  if(!window._fv[fid])window._fv[fid]=[];
  if(!window._fv[fid].includes(v))window._fv[fid].push(v);
  saveData();renderAll();
}
function deleteNewOpt(fid,val){
  const px=proj(formProj);const f=px&&px.fields&&px.fields.find(x=>x.id===fid);
  if(f){f.options=f.options.filter(o=>o!==val);}
  if(window._fv&&window._fv[fid]){window._fv[fid]=window._fv[fid].filter(o=>o!==val);}
  saveData();renderAll();
}
function toggleProjPicker(){showProjPicker=!showProjPicker;renderAll()}
function selectProj(id){
  formProj=id;showProjPicker=false;
  window._fv={};
  // pre-init all select fields as empty arrays
  const p=proj(id);
  if(p&&p.fields)p.fields.forEach(f=>{if(f.type==='select')window._fv[f.id]=[];});
  skippedFields={};openDropId=null;renderAll();
}
function toggleExtra(k){formExtras[k]=!formExtras[k];renderAll()}

function openForm(){
  formTitle='';formNote='';formLink='';formLinkLabel='';formProj=null;showForm=true;view='journal';showProjPicker=false;window._fv={};skippedFields={};openDropId=null;editingId=null;renderAll();
  setTimeout(()=>{const el=document.getElementById('f-title');if(el)el.focus()},50);
}
function cancelForm(){formTitle='';formNote='';formLink='';formLinkLabel='';showForm=false;showProjPicker=false;formExtras={note:false,link:false};window._fv={};skippedFields={};openDropId=null;renderAll()}

function saveEntry(){
  // 没选 project 不允许保存
  if(!formProj){
    const btn=document.querySelector('.proj-sel-btn');
    if(btn){btn.classList.remove('error');void btn.offsetWidth;btn.classList.add('error');setTimeout(()=>btn.classList.remove('error'),600);}
    return;
  }
  const titleEl=document.getElementById('f-title');
  const t=(titleEl?titleEl.value.trim():'')||formTitle.trim();
  const p=formProj?proj(formProj):null;
  const fields={},skipped={...skippedFields};
  if(p&&p.fields){
    p.fields.forEach(f=>{
      if(skipped[f.id])return;
      if(f.type==='number'){const el=document.getElementById('ff-'+f.id);if(el&&el.value)fields[f.id]=el.value;}
      else{const v=window._fv&&window._fv[f.id];if(v)fields[f.id]=v;}
    });
  }
  const noteEl=document.getElementById('f-note');
  const note=formExtras.note?((noteEl?noteEl.value:'')||formNote).trim():'';
  const linkEl=document.getElementById('f-link');
  const link=formExtras.link?((linkEl?linkEl.value:'')||formLink).trim():'';
  const labelEl=document.getElementById('f-linklabel');
  const linklabel=formExtras.link?((labelEl?labelEl.value:'')||formLinkLabel).trim():'';
  const saveKey=dk(selDate);
  if(!entries[saveKey])entries[saveKey]=[];
  entries[saveKey].push({id:Date.now(),projId:formProj||'',title:t,fields,skipped,note,link,linkLabel:linklabel});
  formTitle='';formNote='';formLink='';formLinkLabel='';showForm=false;showProjPicker=false;formExtras={note:false,link:false};window._fv={};skippedFields={};openDropId=null;
  saveData();renderAll();
}

function _closeDelConfirm(){

function _doDeleteProject(id,action){
  const p=projects.find(x=>x.id===id);if(!p)return;
  const idx=projects.indexOf(p);
  if(action==='archive'){
    p.status='archived';
    _deletedProj={p,idx,action};
    _closeDelConfirm();
    saveData();renderAll();
    showUndoToast('已归档「'+p.name+'」');
  } else {
    const affectedEntries={};
    Object.entries(entries).forEach(([dk2,arr])=>{
      const hits=arr.filter(e=>e.projId===id);
      if(hits.length)affectedEntries[dk2]=hits.map(e=>({...e}));
    });
    Object.keys(entries).forEach(dk2=>{
      entries[dk2]=entries[dk2].filter(e=>e.projId!==id);
    });
    projects=projects.filter(x=>x.id!==id);
    _deletedProj={p,idx,action,affectedEntries};
    _closeDelConfirm();
    saveData();renderAll();
    const total=Object.values(affectedEntries).flat().length;
    showUndoToast('已删除「'+p.name+'」'+(total?' 及 '+total+' 条记录':''));
  }
}

function restoreProject(id){
  const p=projects.find(x=>x.id===id);if(!p)return;

}

function showUndoToast(msg){
  clearTimeout(_delTimer);
  let t=document.getElementById('undo-toast');
  if(!t){t=document.createElement('div');t.id='undo-toast';t.className='undo-toast';document.body.appendChild(t);}
  t.innerHTML=msg+' <button class="undo-btn" onclick="undoDelete()">撤销 (Ctrl+Z)</button>';
  t.style.display='flex';
  _delTimer=setTimeout(()=>{t.style.display='none';_deletedProj=null;},5000);
}

function undoDelete(){
  clearTimeout(_delTimer);
  if(!_deletedProj)return;
  const{p,idx,action,affectedEntries}=_deletedProj;
  if(action==='archive'){
    const found=projects.find(x=>x.id===p.id);
    if(found)found.status='active';
  } else {
    projects.splice(idx,0,p);
    Object.entries(affectedEntries||{}).forEach(([dk2,arr])=>{
      if(!entries[dk2])entries[dk2]=[];
      arr.forEach(e=>{if(!entries[dk2].find(x=>x.id===e.id))entries[dk2].push(e);});
    });
  }
  saveData();renderAll();_deletedProj=null;
  const t=document.getElementById('undo-toast');if(t)t.style.display='none';
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'&&_deletedProj)undoDelete();});

function renderStats(){
  const _pd=document.getElementById('page-date');if(_pd)_pd.textContent='周报告';
  const area=document.getElementById('main-area');area.innerHTML='';
  const ws=getWeekStart();
  const perDay=[];let totalE=0,totalC=0;const projStats={};
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const list=entries[dk(d)]||[];totalE+=list.length;
    list.forEach(e=>{
      totalC+=calcCoins(e, dk(d));
      if(!projStats[e.projId])projStats[e.projId]={count:0,fields:{}};
      projStats[e.projId].count++;
      const p=proj(e.projId);
      (p.fields||[]).forEach(f=>{
        if(e.skipped&&e.skipped[f.id])return;
        const v=e.fields&&e.fields[f.id];if(!v)return;
        if(f.type==='number'){const n=parseFloat(v);if(!isNaN(n)){if(!projStats[e.projId].fields[f.id])projStats[e.projId].fields[f.id]={label:f.label,total:0};projStats[e.projId].fields[f.id].total+=n;}}
        else{if(!projStats[e.projId].fields[f.id])projStats[e.projId].fields[f.id]={label:f.label,vals:{}};projStats[e.projId].fields[f.id].vals[v]=(projStats[e.projId].fields[f.id].vals[v]||0)+1;}
      });
    });
    perDay.push({d,cnt:list.length});
  }
  const maxC=Math.max(...perDay.map(x=>x.cnt),1);
  const todayI=perDay.findIndex(x=>dk(x.d)===todayKey);
  const cat=document.createElement('div');cat.className='cat66-bar';
  cat.innerHTML=`<span style="font-size:24px">${totalE>=10?'(=^▽^=)':totalE>=5?'ᓚᘏᗢ':'=^.^='}</span><div>这周完成了 <strong>${totalE}</strong> 条记录，共赚了 <strong>${totalC}</strong> Cat Token<br><span style="font-size:11px">66 为你骄傲！</span></div>`;
  area.appendChild(cat);
  const wb=document.createElement('div');wb.className='stats-bars';
  perDay.forEach((x,i)=>{
    const pct=Math.round(x.cnt/maxC*100),isT=i===todayI;
    const col=document.createElement('div');col.className='wbar-col'+(isT?' today':'');

    wb.appendChild(col);
  });
  area.appendChild(wb);
  const sl=document.createElement('div');sl.className='sec-label';sl.textContent='Projects 统计';area.appendChild(sl);
  const maxP=Math.max(...Object.values(projStats).map(x=>x.count),1);
  Object.keys(projStats).forEach(pid=>{
    const p=proj(pid),ps=projStats[pid];
    const row=document.createElement('div');row.className='proj-stat-row';
    let val=`${ps.count} 次`;
    const ex=[];
    Object.values(ps.fields).forEach(fs=>{
      if(fs.total!==undefined)ex.push(`${fs.label} ${Math.round(fs.total)}`);
      else if(fs.vals){const top=Object.entries(fs.vals).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`${k}×${v}`).join('、');if(top)ex.push(top);}
    });

let calPickerDate = new Date(today); // month being displayed in picker

function openCalPicker(){
  const popup = document.getElementById('cal-popup');
  if(popup.style.display === 'none' || !popup.style.display){
    calPickerDate = new Date(selDate);
    renderCalPopup();

  } else {
    popup.style.display = 'none';
  }

function renderCalPopup(){
  const popup = document.getElementById('cal-popup');
  const year = calPickerDate.getFullYear();
  const month = calPickerDate.getMonth();

  // Build year options (5 years back to today's year)
  const currentYear = today.getFullYear();
  let yearOpts = '';
  for(let y = currentYear; y >= currentYear - 5; y--){
    yearOpts += `<option value="${y}"${year===y?' selected':''}>${y}</option>`;
  }

  // Build month options
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  let monthOpts = monthNames.map((m,i) => `<option value="${i}"${month===i?' selected':''}>${m}</option>`).join('');

  // Build calendar grid
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  let gridHTML = ['日','一','二','三','四','五','六'].map(d => `<div class="cal-day-hdr">${d}</div>`).join('');

  // Prev month filler
  for(let i = firstDay - 1; i >= 0; i--){
    gridHTML += `<div class="cal-day other-month">${daysInPrevMonth - i}</div>`;
  }

  // Current month days
  for(let d = 1; d <= daysInMonth; d++){
    const thisDate = new Date(year, month, d);
    thisDate.setHours(0,0,0,0);
    const key = dk(thisDate);
    const isToday = key === todayKey;
    const isSel = key === dk(selDate);
    const isFuture = thisDate > today;
    const hasEntry = (entries[key]||[]).length > 0;
    let cls = 'cal-day';
    if(isToday) cls += ' today';
    if(isSel) cls += ' selected';
    if(isFuture) cls += ' future';
    if(hasEntry) cls += ' has-entry';
    const onclick = isFuture ? '' : `onclick="pickCalDate(${year},${month},${d})"`;
    gridHTML += `<div class="${cls}" ${onclick}>${d}</div>`;
  }

  // Next month filler
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for(let i = 1; i <= remaining; i++){
    gridHTML += `<div class="cal-day other-month">${i}</div>`;
  }

  popup.innerHTML = `
    <div class="cal-popup-header">
      <button class="cal-nav" onclick="shiftCalMonth(-1)">‹</button>
      <span class="cal-popup-title">${year}年 ${monthNames[month]}</span>
      <button class="cal-nav" onclick="shiftCalMonth(1)">›</button>
    </div>
    <div class="cal-selects">
      <select class="cal-sel" onchange="setCalYear(this.value)">${yearOpts}</select>
      <select class="cal-sel" onchange="setCalMonth(this.value)">${monthOpts}</select>
    </div>
    <div class="cal-grid">${gridHTML}</div>
  `;
}

function shiftCalMonth(dir){
  calPickerDate.setMonth(calPickerDate.getMonth() + dir);
  renderCalPopup();
}
function setCalYear(y){ calPickerDate.setFullYear(parseInt(y)); renderCalPopup(); }

function pickCalDate(y, m, d){
  selDate = new Date(y, m, d);
  selDate.setHours(0,0,0,0);
  // Adjust weekOffset so sidebar shows the right week
  const diffDays = Math.round((selDate - today) / 86400000);
  const diffWeeks = Math.floor(diffDays / 7);
  weekOffset = diffDays < 0 ? Math.ceil((selDate - today) / (7 * 86400000)) : 0;
  // Fine-tune: find correct week
  const ws = getWeekStart();
  const we = new Date(ws); we.setDate(we.getDate() + 6);
  if(selDate < ws || selDate > we){
    const dow = selDate.getDay();
    const wsDiff = selDate - today;
    weekOffset = Math.floor(wsDiff / (7 * 86400000));
    if(selDate < getWeekStart()) weekOffset--;
  }
  view = 'journal';
  document.getElementById('cal-popup').style.display = 'none';
  renderAll();
}

function cpHsvToRgb(h,s,v){
  const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60);
  const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].map(x=>Math.round(x*255));
}
function cpRgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join('');}
function cpHexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function cpRgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0,s=max===0?0:d/max,v=max;
  if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360;}
  return[h,s,v];
}
function cpColorDist(r1,g1,b1,r2,g2,b2){return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}
function cpFindClosest(r,g,b,n=3){
  return CP_CSS_COLORS.map(([hex,name])=>{const[cr,cg,cb]=cpHexToRgb(hex);return{hex:hex.toUpperCase(),name,dist:cpColorDist(r,g,b,cr,cg,cb)};}).sort((a,b)=>a.dist-b.dist).slice(0,n);
}

function cpDrawSatVal(){
  const cv=document.getElementById('cp-sat');const wrap=document.getElementById('cp-cv-wrap');
  if(!cv||!wrap)return;
  cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;
  const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;
  const gH=ctx.createLinearGradient(0,0,w,0);gH.addColorStop(0,'#fff');gH.addColorStop(1,`hsl(${cpHue},100%,50%)`);
  ctx.fillStyle=gH;ctx.fillRect(0,0,w,h);
  const gV=ctx.createLinearGradient(0,0,0,h);gV.addColorStop(0,'transparent');gV.addColorStop(1,'#000');
  ctx.fillStyle=gV;ctx.fillRect(0,0,w,h);
}
