  ['#00CED1','Dark Turquoise'],['#00FFFF','Cyan'],['#7FFFD4','Aquamarine'],
  ['#008080','Teal'],['#00BFFF','Deep Sky Blue'],['#87CEEB','Sky Blue'],
  ['#4169E1','Royal Blue'],['#0000FF','Blue'],['#00008B','Dark Blue'],['#000080','Navy'],
  ['#191970','Midnight Blue'],['#4682B4','Steel Blue'],['#6495ED','Cornflower Blue'],
  ['#7B68EE','Medium Slate Blue'],['#6A5ACD','Slate Blue'],['#483D8B','Dark Slate Blue'],
  ['#EE82EE','Violet'],['#DA70D6','Orchid'],['#FF00FF','Magenta'],['#DDA0DD','Plum'],
  ['#E6E6FA','Lavender'],['#9370DB','Medium Purple'],['#8A2BE2','Blue Violet'],
  ['#9400D3','Dark Violet'],['#800080','Purple'],['#4B0082','Indigo'],
  ['#FF69B4','Hot Pink'],['#FF1493','Deep Pink'],['#FFC0CB','Pink'],['#FFB6C1','Light Pink'],
  ['#C71585','Medium Violet Red'],['#708090','Slate Gray'],['#2F4F4F','Dark Slate Gray'],
  ['#F4A460','Sandy Brown'],['#8B4513','Saddle Brown'],['#DAA520','Goldenrod'],
];

let cpHue=240,cpSat=0.56,cpVal=0.93;
let cpDraggingSat=false,cpDraggingHue=false;
let cpSelectedClosest=null;

function cpHsvToRgb(h,s,v){
  const i=Math.floor(h/60)%6,f=h/60-Math.floor(h/60);
  const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i].map(x=>Math.round(x*255));
}
function cpRgbToHex(r,g,b){return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0').toUpperCase()).join('');}
function cpHexToRgb(hex){return[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function cpRgbToHsv(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0,s=max===0?0:d/max,v=max;
  if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360;}
  return[h,s,v];
}
function cpColorDist(r1,g1,b1,r2,g2,b2){return Math.sqrt((r1-r2)**2+(g1-g2)**2+(b1-b2)**2);}
function cpFindClosest(r,g,b,n=3){
  return CP_CSS_COLORS.map(([hex,name])=>{const[cr,cg,cb]=cpHexToRgb(hex);return{hex:hex.toUpperCase(),name,dist:cpColorDist(r,g,b,cr,cg,cb)};}).sort((a,b)=>a.dist-b.dist).slice(0,n);
}

function cpDrawSatVal(){
  const cv=document.getElementById('cp-sat');const wrap=document.getElementById('cp-cv-wrap');
  if(!cv||!wrap)return;
  cv.width=wrap.offsetWidth;cv.height=wrap.offsetHeight;
  const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;
  const gH=ctx.createLinearGradient(0,0,w,0);gH.addColorStop(0,'#fff');gH.addColorStop(1,`hsl(${cpHue},100%,50%)`);
  ctx.fillStyle=gH;ctx.fillRect(0,0,w,h);
  const gV=ctx.createLinearGradient(0,0,0,h);gV.addColorStop(0,'transparent');gV.addColorStop(1,'#000');
  ctx.fillStyle=gV;ctx.fillRect(0,0,w,h);
}

let cpPopupOpen=false;

function cpUpdateUI(skipHexInput=false){
  const[r,g,b]=cpHsvToRgb(cpHue,cpSat,cpVal);
  const hex=cpRgbToHex(r,g,b);
  const swatch=document.getElementById('cp-preview-swatch');
  if(!swatch)return;
  swatch.style.background=hex;
  if(!skipHexInput){const inp=document.getElementById('cp-hex-input');if(inp){inp.value=hex;inp.classList.remove('invalid');}}
  if(document.getElementById('cp-r'))document.getElementById('cp-r').textContent=r;
  if(document.getElementById('cp-g'))document.getElementById('cp-g').textContent=g;
  if(document.getElementById('cp-b'))document.getElementById('cp-b').textContent=b;
  const closest=cpFindClosest(r,g,b,3);
  const nameEl=document.getElementById('cp-color-name');if(nameEl)nameEl.textContent=closest[0].name;
  const listEl=document.getElementById('cp-closest-list');
  if(listEl)listEl.innerHTML=closest.map(c=>`<div class="cp-closest-item${cpSelectedClosest===c.hex?' cp-sel':''}" onclick="cpPickClosest('${c.hex}')"><div class="cp-closest-dot" style="background:${c.hex}"></div><span class="cp-closest-hex">${c.hex}</span><span class="cp-closest-name">${c.name}</span><span class="cp-closest-check">✓</span></div>`).join('');
  const dot=document.getElementById('cp-dot');const cvWrap=document.getElementById('cp-cv-wrap');
  if(dot&&cvWrap){dot.style.left=(cpSat*cvWrap.offsetWidth)+'px';dot.style.top=((1-cpVal)*cvWrap.offsetHeight)+'px';dot.style.background=hex;}
  const hueThumb=document.getElementById('cp-hue-thumb');const hueWrap=document.getElementById('cp-hue-wrap');
  if(hueThumb&&hueWrap){hueThumb.style.left=(cpHue/360*hueWrap.offsetWidth)+'px';hueThumb.style.background=`hsl(${cpHue},100%,50%)`;}
  cpDrawSatVal();
  if(modal)modal.color=hex;
  document.querySelectorAll('.cp-preset-dot').forEach(p=>{p.classList.toggle('sel',p.dataset.color===hex);});
  cpRenderMyPalette();
  // Update badge preview
  const badge=document.getElementById('cp-badge-preview');
  if(badge){
    const name=modal&&modal.name?modal.name:'Project / Task';
    badge.textContent=name||'Project';
    badge.style.color=hex;
    badge.style.borderColor=hex+'80';
    // Light background: hex with low opacity via rgba
    const[br,bg,bb]=cpHexToRgb(hex);
    badge.style.background=`rgba(${br},${bg},${bb},0.12)`;
  }
}

function cpTogglePanel(){
  const panel=document.getElementById('cp-picker-panel');
  const btn=document.getElementById('cp-palette-toggle');
  if(panel){panel.classList.toggle('open');btn&&btn.classList.toggle('open',panel.classList.contains('open'));}
  if(panel&&panel.classList.contains('open'))setTimeout(()=>cpUpdateUI(),0);
}
function cpTogglePalettePopup(e){
  e.stopPropagation();
  cpPopupOpen=!cpPopupOpen;
  const p=document.getElementById('cp-palette-popup');if(p)p.classList.toggle('open',cpPopupOpen);
}
function cpClosePalettePopup(){cpPopupOpen=false;const p=document.getElementById('cp-palette-popup');if(p)p.classList.remove('open');}

function cpRemoveColor(hex){cpMyPalette=cpMyPalette.filter(c=>c!==hex);localStorage.setItem('cj_mypalette',JSON.stringify(cpMyPalette));cpRenderMyPalette();}
function cpRenderMyPalette(){
  const el=document.getElementById('cp-my-swatches');if(!el)return;
  const curHex=(modal&&modal.color?modal.color:'').toUpperCase();
  if(!cpMyPalette.length){el.innerHTML='<span class="cp-palette-empty">'+t('cp_none')+'</span>';return;}
  el.innerHTML=cpMyPalette.map(c=>`<div class="cp-my-swatch${curHex===c?' active':''}" style="background:${c}" onclick="cpSetFromHex('${c}')" title="${c}"><div class="cp-my-del" onclick="event.stopPropagation();cpRemoveColor('${c}')">✕</div></div>`).join('');
}
function cpSaveColor(){
  const hex=(modal&&modal.color?modal.color:'').toUpperCase();
  if(!hex||cpMyPalette.includes(hex))return;
  cpMyPalette.push(hex);
  localStorage.setItem('cj_mypalette',JSON.stringify(cpMyPalette));
  cpRenderMyPalette();
}

function cpPickClosest(hex){cpSelectedClosest=hex;cpSetFromHex(hex,true);}

function cpSetFromHex(hex,fromClosest=false){
  if(!/^#[0-9a-fA-F]{6}$/.test(hex))return false;
  const[r,g,b]=cpHexToRgb(hex);[cpHue,cpSat,cpVal]=cpRgbToHsv(r,g,b);
  if(!fromClosest)cpSelectedClosest=null;
  cpUpdateUI();return true;
}

function cpInitPicker(initialColor){
  cpPopupOpen=false;
  const panel=document.getElementById('cp-picker-panel');
  if(panel)panel.classList.remove('open');
  cpSetFromHex(initialColor||'#7B68EE');
  const presetsEl=document.getElementById('cp-presets');
  if(presetsEl){
    presetsEl.style.cssText='display:flex;align-items:center;gap:5px;flex-wrap:wrap';
    presetsEl.innerHTML='';
    COLORS.forEach(c=>{
      const d=document.createElement('div');
      d.className='cp-preset-dot';d.style.background=c;d.dataset.color=c.toUpperCase();
      d.onclick=()=>{cpSelectedClosest=null;cpSetFromHex(c);};
      presetsEl.appendChild(d);
    });
  }
  const cvWrap=document.getElementById('cp-cv-wrap');
  const hueWrap=document.getElementById('cp-hue-wrap');
  const hexInp=document.getElementById('cp-hex-input');
  if(cvWrap){
    cvWrap.addEventListener('mousedown',e=>{cpDraggingSat=true;cpGetSV(e,cvWrap);cpUpdateUI();});
    cvWrap.addEventListener('touchstart',e=>{cpDraggingSat=true;cpGetSV(e,cvWrap);cpUpdateUI();},{passive:true});
  }
  if(hueWrap){
    hueWrap.addEventListener('mousedown',e=>{cpDraggingHue=true;cpGetHue(e,hueWrap);cpUpdateUI();});
    hueWrap.addEventListener('touchstart',e=>{cpDraggingHue=true;cpGetHue(e,hueWrap);cpUpdateUI();},{passive:true});
  }
  if(hexInp){
    hexInp.addEventListener('input',()=>{
      let v=hexInp.value.trim();if(!v.startsWith('#'))v='#'+v;
      if(/^#[0-9a-fA-F]{6}$/.test(v)){
        hexInp.classList.remove('invalid');const[r,g,b]=cpHexToRgb(v);
        [cpHue,cpSat,cpVal]=cpRgbToHsv(r,g,b);cpSelectedClosest=null;cpUpdateUI(true);
      } else {hexInp.classList.add('invalid');}
    });
    hexInp.addEventListener('blur',()=>{hexInp.classList.remove('invalid');cpUpdateUI();});
  }
  // Close popup on outside click
  document.addEventListener('click',function cpOutsideClick(e){
    const popup=document.getElementById('cp-palette-popup');
    const btn=document.getElementById('cp-bag-btn');
    if(cpPopupOpen&&popup&&btn&&!popup.contains(e.target)&&!btn.contains(e.target)){cpClosePalettePopup();}
  });
}

function cpGetSV(e,wrap){
  const rect=wrap.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  cpSat=Math.max(0,Math.min(1,cx/rect.width));
  cpVal=Math.max(0,Math.min(1,1-cy/rect.height));
  cpSelectedClosest=null;
}
function cpGetHue(e,wrap){
  const rect=wrap.getBoundingClientRect();
  cpHue=Math.max(0,Math.min(359,(e.touches?e.touches[0].clientX:e.clientX)-rect.left)/rect.width*360);
  cpSelectedClosest=null;
}
document.addEventListener('mousemove',e=>{
  if(cpDraggingSat){const w=document.getElementById('cp-cv-wrap');if(w){cpGetSV(e,w);cpUpdateUI();}}
  if(cpDraggingHue){const w=document.getElementById('cp-hue-wrap');if(w){cpGetHue(e,w);cpUpdateUI();}}
});
document.addEventListener('touchmove',e=>{
  if(cpDraggingSat){const w=document.getElementById('cp-cv-wrap');if(w){cpGetSV(e,w);cpUpdateUI();}}
  if(cpDraggingHue){const w=document.getElementById('cp-hue-wrap');if(w){cpGetHue(e,w);cpUpdateUI();}}
},{passive:true});
document.addEventListener('mouseup',()=>{cpDraggingSat=false;cpDraggingHue=false;});
document.addEventListener('touchend',()=>{cpDraggingSat=false;cpDraggingHue=false;});
