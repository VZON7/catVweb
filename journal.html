<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成就日记 — catVweb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,400;0,600;0,800;0,900;1,400&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --lavender:#eae8f5; --dark:#2d2b3d; --mid:#5a5870;
  --pink:#FF3F6C; --purple:#7B68EE; --cyan:#42C6FF;
}
body { background:var(--lavender); min-height:100vh; font-family:'Nunito',sans-serif; color:var(--dark); }

/* NAV */
#site-nav {
  position:fixed; top:0; left:0; right:0; height:52px;
  display:flex; align-items:center; justify-content:space-between; padding:0 28px;
  background:rgba(234,232,245,0.88); backdrop-filter:blur(14px);
  border-bottom:0.5px solid rgba(123,104,238,0.2); z-index:200;
}
.nav-logo { font-weight:800; font-size:15px; color:var(--dark); display:flex; align-items:center; gap:7px; text-decoration:none; }
.nav-pip { width:7px; height:7px; border-radius:50%; background:var(--purple); }
.nav-right { display:flex; align-items:center; gap:10px; }
.nav-back { font-size:13px; font-weight:600; color:var(--mid); text-decoration:none; background:rgba(123,104,238,0.09); border:0.5px solid rgba(123,104,238,0.3); border-radius:999px; padding:6px 14px; transition:background .2s; }
.nav-back:hover { background:rgba(123,104,238,0.18); }
.coin-pill { display:flex; align-items:center; gap:5px; background:#FAEEDA; border:0.5px solid #FAC775; border-radius:999px; padding:5px 12px; font-size:12px; font-weight:700; color:#633806; }

/* LAYOUT */
.page { padding:72px 0 60px; max-width:860px; margin:0 auto; padding-left:20px; padding-right:20px; }

/* HEADER */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
.page-title { font-family:'ZCOOL XiaoWei',sans-serif; font-size:28px; color:var(--dark); }
.page-date { font-size:12px; color:var(--mid); margin-top:4px; }
.new-btn { display:flex; align-items:center; gap:6px; background:var(--purple); color:#fff; border:none; border-radius:999px; padding:9px 20px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; transition:opacity .2s; }
.new-btn:hover { opacity:.85; }

/* STATS */
.stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
.stat-card { background:rgba(255,255,255,0.6); border:0.5px solid rgba(123,104,238,0.2); border-radius:12px; padding:12px 14px; text-align:center; }
.stat-n { font-family:'Lilita One',cursive; font-size:24px; color:var(--purple); }
.stat-l { font-size:11px; color:var(--mid); margin-top:2px; }

/* TWO-COL LAYOUT */
.main-layout { display:grid; grid-template-columns:200px 1fr; gap:16px; }
@media(max-width:600px){ .main-layout { grid-template-columns:1fr; } }

/* SIDEBAR */
.sidebar { background:rgba(255,255,255,0.55); border:0.5px solid rgba(123,104,238,0.15); border-radius:14px; padding:14px; height:fit-content; }
.sb-label { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); margin-bottom:8px; }
.week-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.week-range { font-size:11px; font-weight:600; color:var(--dark); }
.wnav-btn { background:none; border:none; color:var(--mid); cursor:pointer; font-size:14px; padding:2px 5px; border-radius:4px; }
.wnav-btn:hover { background:rgba(123,104,238,0.12); }
.day-item { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
.day-item:hover { background:rgba(123,104,238,0.08); }
.day-item.active { background:#FAEEDA; }
.day-dot { width:5px; height:5px; border-radius:50%; background:rgba(123,104,238,0.2); flex-shrink:0; }
.day-dot.has { background:var(--purple); }
.day-name { font-size:12px; color:var(--mid); flex:1; }
.day-item.active .day-name { color:#633806; font-weight:700; }
.day-cnt { font-size:10px; color:var(--mid); }
.sb-divider { border:none; border-top:0.5px solid rgba(123,104,238,0.15); margin:12px 0; }
.proj-item { display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:8px; cursor:pointer; margin-bottom:2px; }
.proj-item:hover { background:rgba(123,104,238,0.08); }
.proj-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.proj-name { font-size:12px; color:var(--mid); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.proj-cnt { font-size:10px; color:var(--mid); }
.add-proj-btn { display:flex; align-items:center; gap:5px; width:100%; padding:6px 7px; border-radius:8px; border:0.5px dashed rgba(123,104,238,0.35); background:none; color:var(--mid); font-size:12px; font-family:'Nunito',sans-serif; cursor:pointer; margin-top:4px; }
.add-proj-btn:hover { background:rgba(123,104,238,0.08); color:var(--dark); }
.sb-nav-btn { display:flex; align-items:center; gap:6px; width:100%; padding:7px; border-radius:8px; border:none; background:none; color:var(--mid); font-size:12px; font-family:'Nunito',sans-serif; cursor:pointer; margin-top:2px; }
.sb-nav-btn:hover { background:rgba(123,104,238,0.08); color:var(--dark); }

/* MAIN AREA */
.main-area { min-height:400px; }
.sec-label { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mid); margin-bottom:8px; margin-top:4px; display:flex; align-items:center; gap:6px; }
.sec-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ENTRY CARD */
.entry-card { background:rgba(255,255,255,0.65); border:0.5px solid rgba(123,104,238,0.18); border-radius:12px; margin-bottom:8px; transition:border-color .15s; }
.entry-card:hover { border-color:rgba(123,104,238,0.4); }
.entry-card.editing { border-color:var(--purple); background:rgba(255,255,255,0.9); }
.ec-inner { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; }
.proj-badge { display:flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700; white-space:nowrap; flex-shrink:0; margin-top:1px; }
.ec-body { flex:1; min-width:0; }
.ec-title { font-size:13px; font-weight:700; color:var(--dark); line-height:1.4; }
.ec-meta { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:5px; }
.ec-field { font-size:11px; color:var(--mid); display:flex; align-items:center; gap:3px; }
.ec-selval { font-size:10px; padding:2px 8px; border-radius:999px; background:rgba(123,104,238,0.1); border:0.5px solid rgba(123,104,238,0.25); color:var(--dark); }
.ec-note { font-size:12px; color:var(--mid); margin-top:5px; line-height:1.5; padding-top:5px; border-top:0.5px solid rgba(123,104,238,0.12); }
.ec-coin { font-size:10px; color:#854F0B; background:#FAEEDA; border-radius:999px; padding:2px 7px; white-space:nowrap; flex-shrink:0; font-weight:700; }
.ec-acts { display:flex; gap:2px; flex-shrink:0; }
.ec-act { background:none; border:none; color:var(--mid); cursor:pointer; font-size:13px; padding:4px; border-radius:4px; opacity:.4; }
.ec-act:hover { opacity:1; background:rgba(123,104,238,0.1); }

/* INLINE EDIT */
.inline-edit { padding:0 14px 12px; }
.ie-title input { width:100%; font-size:13px; font-weight:700; margin-bottom:8px; font-family:'Nunito',sans-serif; background:rgba(255,255,255,0.8); border:0.5px solid rgba(123,104,238,0.3); border-radius:8px; padding:7px 10px; color:var(--dark); }
.ie-var-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.ie-var-label { font-size:12px; color:var(--mid); min-width:72px; flex-shrink:0; }
.ie-var-val { flex:1; position:relative; }
.ie-skip-btn { width:26px; height:26px; border-radius:50%; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ie-skip-btn:hover { border-color:var(--pink); color:var(--pink); }
.ie-skip-btn.skipped { background:rgba(255,63,108,0.1); border-color:var(--pink); color:var(--pink); }
.skipped-label { font-size:12px; color:var(--mid); font-style:italic; padding:0 8px; }
.ie-extras { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.ie-toggle { display:flex; align-items:center; gap:4px; padding:4px 10px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.2); background:rgba(255,255,255,0.5); color:var(--mid); font-size:11px; cursor:pointer; font-family:'Nunito',sans-serif; }
.ie-toggle:hover { border-color:rgba(123,104,238,0.4); }
.ie-toggle.on { border-color:var(--purple); background:rgba(123,104,238,0.1); color:var(--purple); font-weight:700; }
.ie-dyn { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
.ie-textarea { width:100%; font-size:12px; resize:none; border-radius:8px; border:0.5px solid rgba(123,104,238,0.2); padding:7px 10px; background:rgba(255,255,255,0.8); color:var(--dark); font-family:'Nunito',sans-serif; line-height:1.5; }
.ie-btns { display:flex; gap:6px; justify-content:flex-end; margin-top:4px; }
.ie-cancel { padding:6px 12px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }
.ie-save { padding:6px 16px; border-radius:999px; background:var(--purple); border:none; color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }
.ie-save:hover { opacity:.85; }

/* FORM */
.form-card { background:rgba(255,255,255,0.85); border:0.5px solid rgba(123,104,238,0.35); border-radius:14px; padding:14px; margin-bottom:12px; }
.form-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
.form-row input { flex:1; font-size:13px; font-family:'Nunito',sans-serif; background:rgba(255,255,255,0.9); border:0.5px solid rgba(123,104,238,0.25); border-radius:8px; padding:8px 12px; color:var(--dark); outline:none; }
.form-row input:focus { border-color:var(--purple); }
.proj-sel-btn { display:flex; align-items:center; gap:5px; padding:0 12px; height:36px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.8); color:var(--dark); font-size:12px; font-weight:600; cursor:pointer; font-family:'Nunito',sans-serif; white-space:nowrap; flex-shrink:0; }
.proj-sel-btn:hover { background:rgba(123,104,238,0.1); }
.var-rows { display:flex; flex-direction:column; gap:7px; margin-bottom:8px; }
.var-row { display:flex; align-items:center; gap:8px; }
.var-label { font-size:12px; color:var(--mid); min-width:72px; flex-shrink:0; }
.var-val { flex:1; position:relative; }
.skip-btn { width:28px; height:28px; border-radius:50%; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s; }
.skip-btn:hover { border-color:var(--pink); color:var(--pink); }
.skip-btn.skipped { background:rgba(255,63,108,0.1); border-color:var(--pink); color:var(--pink); }
.extras-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.extra-toggle { display:flex; align-items:center; gap:4px; padding:5px 10px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.2); background:rgba(255,255,255,0.6); color:var(--mid); font-size:11px; cursor:pointer; font-family:'Nunito',sans-serif; }
.extra-toggle.on { border-color:var(--purple); background:rgba(123,104,238,0.1); color:var(--purple); font-weight:700; }
.coin-preview { font-size:11px; color:#854F0B; background:#FAEEDA; border-radius:8px; padding:7px 10px; margin-bottom:8px; }
.form-btns { display:flex; gap:6px; justify-content:flex-end; }
.f-cancel { padding:7px 14px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.3); background:rgba(255,255,255,0.7); color:var(--mid); font-size:13px; cursor:pointer; font-family:'Nunito',sans-serif; }
.f-save { padding:7px 18px; border-radius:999px; background:var(--purple); border:none; color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }
.f-save:hover { opacity:.85; }

/* PROJ PICKER */
.proj-picker { background:rgba(255,255,255,0.9); border:0.5px solid rgba(123,104,238,0.3); border-radius:12px; padding:10px; margin-bottom:8px; }
.pp-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; color:var(--dark); }
.pp-item:hover { background:rgba(123,104,238,0.08); }
.pp-item.sel { background:#FAEEDA; color:#633806; }

/* SELECT DROPDOWN */
.sel-wrap { position:relative; width:100%; }
.sel-btn { width:100%; display:flex; align-items:center; justify-content:space-between; padding:0 10px; height:34px; border-radius:8px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.8); color:var(--dark); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }
.sel-btn:hover { background:rgba(255,255,255,1); }
.sel-dropdown { background:rgba(255,255,255,0.97); border:0.5px solid rgba(123,104,238,0.3); border-radius:10px; padding:6px; margin-top:3px; z-index:10; }
.sd-opt { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border-radius:7px; cursor:pointer; font-size:12px; color:var(--dark); font-family:'Nunito',sans-serif; }
.sd-opt:hover { background:rgba(123,104,238,0.08); }
.sd-opt.sel { background:#FAEEDA; color:#633806; font-weight:700; }
.sd-add { display:flex; gap:6px; padding:5px 4px 2px; border-top:0.5px solid rgba(123,104,238,0.12); margin-top:4px; }
.sd-add input { flex:1; font-size:12px; font-family:'Nunito',sans-serif; border:0.5px solid rgba(123,104,238,0.2); border-radius:7px; padding:5px 8px; background:rgba(255,255,255,0.9); color:var(--dark); outline:none; }
.sd-add-btn { padding:4px 10px; border-radius:7px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(123,104,238,0.08); color:var(--purple); font-size:11px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }

/* STATS VIEW */
.stats-bars { display:flex; align-items:flex-end; gap:6px; height:72px; margin-bottom:14px; }
.wbar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
.wbar-bg { flex:1; width:100%; background:rgba(123,104,238,0.12); border-radius:3px; display:flex; align-items:flex-end; overflow:hidden; }
.wbar-in { width:100%; background:var(--purple); border-radius:3px; min-height:2px; transition:height .4s; }
.wbar-col.today .wbar-in { background:var(--pink); }
.wbar-lbl { font-size:10px; color:var(--mid); }
.wbar-col.today .wbar-lbl { color:var(--pink); font-weight:700; }
.proj-stat-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.psr-name { font-size:12px; color:var(--dark); width:110px; flex-shrink:0; display:flex; align-items:center; gap:5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:600; }
.psr-track { flex:1; height:8px; background:rgba(123,104,238,0.12); border-radius:4px; overflow:hidden; }
.psr-fill { height:100%; border-radius:4px; }
.psr-val { font-size:11px; color:var(--mid); width:80px; text-align:right; flex-shrink:0; white-space:nowrap; }
.cat66-bar { display:flex; align-items:center; gap:12px; background:rgba(250,238,218,0.7); border:0.5px solid #FAC775; border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:12px; color:#633806; line-height:1.6; }

/* MODAL */
.modal-bg { position:fixed; inset:0; background:rgba(45,43,61,.35); display:flex; align-items:center; justify-content:center; z-index:300; border-radius:0; }
.modal { background:rgba(234,232,245,0.97); border-radius:16px; border:0.5px solid rgba(123,104,238,0.3); padding:20px; width:300px; max-height:85vh; overflow-y:auto; }
.modal-title { font-family:'ZCOOL XiaoWei',sans-serif; font-size:16px; color:var(--dark); margin-bottom:14px; }
.modal-lbl { font-size:11px; font-weight:700; color:var(--mid); margin-bottom:5px; margin-top:10px; }
.modal input { width:100%; font-size:13px; font-family:'Nunito',sans-serif; border:0.5px solid rgba(123,104,238,0.25); border-radius:8px; padding:7px 10px; background:rgba(255,255,255,0.9); color:var(--dark); outline:none; }
.swatches { display:flex; gap:7px; flex-wrap:wrap; margin-top:4px; }
.swatch { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .1s; }
.swatch:hover { transform:scale(1.15); }
.swatch.sel { border-color:var(--dark); }
.ftype-row { display:flex; gap:6px; margin:6px 0; }
.ftype-btn { flex:1; padding:6px; border-radius:8px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.7); color:var(--mid); font-size:11px; font-weight:600; cursor:pointer; font-family:'Nunito',sans-serif; text-align:center; }
.ftype-btn.sel { border-color:var(--purple); background:rgba(123,104,238,0.1); color:var(--purple); }
.mfl-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mid); padding:5px 0; border-bottom:0.5px solid rgba(123,104,238,0.1); }
.mfl-item:last-child { border:none; }
.mfl-del { background:none; border:none; color:var(--mid); cursor:pointer; margin-left:auto; font-size:14px; }
.mfl-del:hover { color:var(--pink); }
.add-field-row { display:flex; gap:6px; margin-top:6px; }
.add-field-row input { flex:1; font-size:12px; }
.add-field-btn { padding:5px 10px; border-radius:8px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(123,104,238,0.1); color:var(--purple); font-size:12px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; white-space:nowrap; }
.modal-btns { display:flex; gap:6px; justify-content:flex-end; margin-top:14px; border-top:0.5px solid rgba(123,104,238,0.15); padding-top:12px; }
.m-cancel { padding:6px 12px; border-radius:999px; border:0.5px solid rgba(123,104,238,0.25); background:rgba(255,255,255,0.7); color:var(--mid); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }
.m-save { padding:6px 16px; border-radius:999px; background:var(--purple); border:none; color:#fff; font-size:12px; font-weight:700; cursor:pointer; font-family:'Nunito',sans-serif; }
.m-delete { padding:6px 12px; border-radius:999px; border:0.5px solid rgba(255,63,108,0.35); background:none; color:var(--pink); font-size:12px; cursor:pointer; font-family:'Nunito',sans-serif; }

.empty-hint { text-align:center; padding:2.5rem 0; color:var(--mid); font-size:13px; }
.deco { position:fixed; pointer-events:none; opacity:.6; }
.deco-1 { top:18%; left:5%; color:var(--pink); font-size:22px; }
.deco-2 { top:70%; left:3%; color:var(--purple); font-size:14px; }
.deco-3 { top:30%; right:4%; color:var(--cyan); font-size:16px; }
.deco-4 { bottom:18%; right:8%; color:var(--pink); font-size:12px; }
</style>
</head>
<body>
<span class="deco deco-1">✦</span>
<span class="deco deco-2">★</span>
<span class="deco deco-3">✦</span>
<span class="deco deco-4">★</span>

<nav id="site-nav">
  <a href="index.html" class="nav-logo"><div class="nav-pip"></div>catVweb</a>
  <div class="nav-right">
    <a href="index.html" class="nav-back">← 回到66的故事</a>
    <div class="coin-pill">🐾 <span id="nav-coins">0</span> Cat Token</div>
  </div>
</nav>

<div class="page" id="app">
  <div class="page-header">
    <div>
      <div class="page-title">成就日记</div>
      <div class="page-date" id="page-date"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="new-btn" id="stats-btn" style="background:rgba(123,104,238,0.15);color:var(--purple);font-size:12px;padding:8px 14px">📊 周报告</button>
      <button class="new-btn" id="new-entry-btn">✦ 新记录</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-n" id="st-total">0</div><div class="stat-l">今日记录</div></div>
    <div class="stat-card"><div class="stat-n" id="st-coins">0</div><div class="stat-l">今日赚得</div></div>
    <div class="stat-card"><div class="stat-n" id="st-total-coins">0</div><div class="stat-l">Cat Token 余额</div></div>
  </div>

  <div class="main-layout">
    <div class="sidebar">
      <div class="sb-label">本周</div>
      <div class="week-nav">
        <span class="week-range" id="week-range"></span>
        <div style="display:flex;gap:2px">
          <button class="wnav-btn" id="prev-week">‹</button>
          <button class="wnav-btn" id="next-week">›</button>
        </div>
      </div>
      <div id="day-list"></div>
      <hr class="sb-divider">
      <div class="sb-label">Projects</div>
      <div id="proj-list"></div>
      <button class="add-proj-btn" id="add-proj-btn">＋ 添加 project</button>
      <hr class="sb-divider">
      <button class="sb-nav-btn" id="stats-nav-btn">📊 周报告</button>
    </div>
    <div class="main-area" id="main-area"></div>
  </div>
</div>

<div id="modal-container"></div>

<script>
const COLORS=['#7B68EE','#42C6FF','#FF3F6C','#1D9E75','#EF9F27','#D4537E','#378ADD','#888780'];
const DAYS=['日','一','二','三','四','五','六'];
const WD=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const today=new Date();today.setHours(0,0,0,0);
function dk(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
const todayKey=dk(today);

// STATE
let weekOffset=0,selDate=new Date(today),view='journal';
let showForm=false,formProj=null,showProjPicker=false,formTitle='';
let formExtras={note:false,link:false};
let openDropId=null,skippedFields={};
let editingId=null,editState={};
let modal=null;

function loadData(){
  try{
    return{
      projects:JSON.parse(localStorage.getItem('cj_projects')||'null')||[
        {id:'duo',name:'Duolingo',color:'#42C6FF',fields:[{id:'f1',label:'Sessions',type:'number',options:[]}]},
        {id:'catvweb',name:'catVweb',color:'#7B68EE',fields:[
          {id:'f2',label:'工具',type:'select',options:['Claude Code','Claude Design','Cursor']},
          {id:'f3',label:'阶段',type:'select',options:['Brainstorming','Planning','Designing','Programming']}
        ]},
      ],
      entries:JSON.parse(localStorage.getItem('cj_entries')||'{}'),
      totalCoins:parseInt(localStorage.getItem('catTokens')||'0',10)
    }
  }catch(e){return{projects:[],entries:{},totalCoins:0}}
}
function saveData(){
  localStorage.setItem('cj_projects',JSON.stringify(projects));
  localStorage.setItem('cj_entries',JSON.stringify(entries));
  localStorage.setItem('catTokens',String(totalCoins));
  syncNav();
}

let {projects,entries,totalCoins}=loadData();

function syncNav(){
  document.getElementById('nav-coins').textContent=totalCoins;
  document.getElementById('st-total-coins').textContent=totalCoins;
  // sync parent page badge if open
  try{window.opener&&window.opener.postMessage({catTokens:totalCoins},'*')}catch(e){}
}

function proj(id){return projects.find(p=>p.id===id)||{name:'?',color:'#888',fields:[]}}
function hexRgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)].join(',')}

function calcCoins(e){
  let c=3;
  const p=proj(e.projId);
  (p.fields||[]).forEach(f=>{
    if(e.skipped&&e.skipped[f.id])return;
    const v=e.fields&&e.fields[f.id];if(!v)return;
    if(f.type==='number'){const n=parseFloat(v);if(!isNaN(n))c+=Math.min(Math.floor(n/5),8);}
    else if(f.type==='select')c+=1;
  });
  if(e.note&&e.note.trim())c+=1;
  if(e.link&&e.link.trim())c+=1;
  return c;
}

function recalcTotalCoins(){
  totalCoins=Object.values(entries).flat().reduce((s,e)=>s+calcCoins(e),0);
}

function getWeekStart(){
  const d=new Date(today);
  d.setDate(d.getDate()-d.getDay()+(weekOffset*7));
  d.setHours(0,0,0,0);return d;
}

// RENDER
function renderAll(){
  recalcTotalCoins();syncNav();
  renderSidebar();
  if(view==='stats')renderStats();
  else renderJournal();
  renderDayStats();
  const el=document.getElementById('f-title');
  if(el&&formTitle)el.value=formTitle;
}

function renderDayStats(){
  const key=dk(selDate);
  const dayEs=entries[key]||[];
  document.getElementById('st-total').textContent=dayEs.length;
  const todayCoins=dayEs.reduce((s,e)=>s+calcCoins(e),0);
  document.getElementById('st-coins').textContent=todayCoins;
}

function renderSidebar(){
  const ws=getWeekStart(),we=new Date(ws);we.setDate(we.getDate()+6);
  document.getElementById('week-range').textContent=(ws.getMonth()+1)+'月'+ws.getDate()+'–'+(we.getMonth()+1)+'月'+we.getDate();
  const dl=document.getElementById('day-list');dl.innerHTML='';
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const key=dk(d),isSel=key===dk(selDate),isT=key===todayKey,isFut=d>today,cnt=(entries[key]||[]).length;
    const div=document.createElement('div');div.className='day-item'+(isSel?' active':'');div.style.opacity=isFut?.4:1;
    if(!isFut)div.onclick=()=>{selDate=new Date(d);view='journal';editingId=null;renderAll()};
    div.innerHTML=`<div class="day-dot${cnt?' has':''}"></div><span class="day-name">${DAYS[d.getDay()]}${isT?' · 今天':''}</span>${cnt?`<span class="day-cnt">${cnt}</span>`:''}`;
    dl.appendChild(div);
  }
  const pl=document.getElementById('proj-list');pl.innerHTML='';
  projects.forEach(p=>{
    const cnt=Object.values(entries).flat().filter(e=>e.projId===p.id).length;
    const div=document.createElement('div');div.className='proj-item';
    div.innerHTML=`<div class="proj-dot" style="background:${p.color}"></div><span class="proj-name">${p.name}</span>${cnt?`<span class="proj-cnt">${cnt}</span>`:''}`;
    div.onclick=()=>openEditProject(p.id);pl.appendChild(div);
  });
}

function renderJournal(){
  const key=dk(selDate),isToday=key===todayKey,d=selDate;
  document.getElementById('page-date').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+WD[d.getDay()]+(isToday?' · 今天':'');
  const area=document.getElementById('main-area');area.innerHTML='';
  if(showForm&&isToday)area.appendChild(buildNewForm());
  const dayEs=entries[key]||[];
  if(!dayEs.length&&!showForm){
    const em=document.createElement('div');em.className='empty-hint';
    em.innerHTML=`<div style="font-size:32px;margin-bottom:10px;opacity:.3">✦</div>这天还没有记录${isToday?'<br><span style="font-size:12px;margin-top:4px;display:block">点右上角「新记录」开始</span>':''}`;
    area.appendChild(em);return;
  }
  const byProj={};
  dayEs.forEach(e=>{if(!byProj[e.projId])byProj[e.projId]=[];byProj[e.projId].push(e)});
  Object.keys(byProj).forEach(pid=>{
    const p=proj(pid),sec=document.createElement('div');
    const lbl=document.createElement('div');lbl.className='sec-label';
    lbl.innerHTML=`<div class="sec-dot" style="background:${p.color}"></div>${p.name}`;
    sec.appendChild(lbl);
    byProj[pid].forEach(e=>{
      if(editingId===e.id)sec.appendChild(buildEditForm(e,p));
      else sec.appendChild(buildCard(e,p));
    });
    area.appendChild(sec);
  });
}

function buildCard(e,p){
  const card=document.createElement('div');card.className='entry-card';
  let fHTML='';
  (p.fields||[]).forEach(f=>{
    if(e.skipped&&e.skipped[f.id])return;
    const v=e.fields&&e.fields[f.id];if(!v)return;
    if(f.type==='number')fHTML+=`<span class="ec-field">· ${f.label}: <strong>${v}</strong></span>`;
    else fHTML+=`<span class="ec-selval">${v}</span>`;
  });
  const coins=calcCoins(e);
  card.innerHTML=`<div class="ec-inner">
    <div class="proj-badge" style="background:rgba(${hexRgb(p.color)},.12);color:${p.color};border:0.5px solid rgba(${hexRgb(p.color)},.3)">${p.name}</div>
    <div class="ec-body">
      <div class="ec-title">${e.title}</div>
      <div class="ec-meta">${fHTML}${e.link?`<a href="${e.link}" target="_blank" style="font-size:11px;color:var(--cyan);text-decoration:none">↗ ${e.linkLabel||'链接'}</a>`:''}</div>
      ${e.note?`<div class="ec-note">${e.note}</div>`:''}
    </div>
    <span class="ec-coin">🐾 +${coins}</span>
    <div class="ec-acts">
      <button class="ec-act" title="编辑" onclick="startEdit(${e.id},'${dk(selDate)}')">✎</button>
      <button class="ec-act" title="删除" onclick="deleteEntry('${dk(selDate)}',${e.id})">✕</button>
    </div>
  </div>`;
  return card;
}

function startEdit(id,key){
  const e=(entries[key]||[]).find(x=>x.id===id);if(!e)return;
  editingId=id;
  editState={title:e.title,fields:{...e.fields},skipped:{...(e.skipped||{})},note:e.note||'',link:e.link||'',linkLabel:e.linkLabel||'',showNote:!!(e.note),showLink:!!(e.link)};
  openDropId=null;renderAll();
  setTimeout(()=>{const el=document.getElementById('edit-title');if(el)el.focus()},50);
}

function buildEditForm(e,p){
  const wrap=document.createElement('div');wrap.className='entry-card editing';
  const es=editState;
  let varsHTML='';
  (p.fields||[]).forEach(f=>{
    const isSkip=es.skipped[f.id],curVal=es.fields[f.id]||'',isOpen=openDropId===('ed-'+f.id);
    if(f.type==='number'){
      varsHTML+=`<div class="ie-var-row"><span class="ie-var-label">${f.label}</span>
        <div class="ie-var-val">${isSkip?`<span class="skipped-label">已跳过</span>`:`<input type="number" id="edf-${f.id}" value="${curVal}" min="0" style="width:90px;font-size:13px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.25);border-radius:8px;padding:5px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none" oninput="editState.fields['${f.id}']=this.value">`}</div>
        <button class="ie-skip-btn${isSkip?' skipped':''}" onclick="toggleEditSkip('${f.id}')">${isSkip?'＋':'✕'}</button></div>`;
    } else {
      varsHTML+=`<div class="ie-var-row"><span class="ie-var-label">${f.label}</span>
        <div class="ie-var-val">${isSkip?`<span class="skipped-label">已跳过</span>`:`<div class="sel-wrap">
          <button class="sel-btn" onclick="toggleEditDrop('${f.id}')"><span style="color:${curVal?'var(--dark)':'var(--mid)'}">${curVal||'选择…'}</span><span style="opacity:.4">▾</span></button>
          ${isOpen?`<div class="sel-dropdown">${f.options.map(o=>`<div class="sd-opt${curVal===o?' sel':''}" onclick="pickEditOpt('${f.id}','${o}')">${o}${curVal===o?' ✓':''}</div>`).join('')}<div class="sd-add"><input type="text" id="edsd-${f.id}" placeholder="添加新选项…" onclick="event.stopPropagation()"><button class="sd-add-btn" onclick="addEditOpt('${f.id}')">添加</button></div></div>`:''}</div>`}</div>
        <button class="ie-skip-btn${isSkip?' skipped':''}" onclick="toggleEditSkip('${f.id}')">${isSkip?'＋':'✕'}</button></div>`;
    }
  });
  wrap.innerHTML=`<div class="inline-edit">
    <div class="ie-title"><input type="text" id="edit-title" value="${es.title}" style="width:100%;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.3);border-radius:8px;padding:8px 12px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none;margin-bottom:8px" oninput="editState.title=this.value"></div>
    ${varsHTML}
    <div class="ie-extras">
      <div class="ie-toggle${es.showNote?' on':''}" onclick="editState.showNote=!editState.showNote;renderAll()">📝 备注</div>
      <div class="ie-toggle${es.showLink?' on':''}" onclick="editState.showLink=!editState.showLink;renderAll()">🔗 链接</div>
    </div>
    <div class="ie-dyn">
      ${es.showNote?`<textarea class="ie-textarea" id="edit-note" rows="2" oninput="editState.note=this.value" placeholder="补充说明…">${es.note}</textarea>`:''}
      ${es.showLink?`<div style="display:flex;gap:6px"><input type="url" id="edit-link" value="${es.link}" placeholder="https://…" style="flex:2;font-size:12px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.2);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none" oninput="editState.link=this.value"><input type="text" id="edit-linklabel" value="${es.linkLabel}" placeholder="标签" style="flex:1;font-size:12px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.2);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none" oninput="editState.linkLabel=this.value"></div>`:''}
    </div>
    <div class="ie-btns">
      <button class="ie-cancel" onclick="cancelEdit()">取消</button>
      <button class="ie-save" onclick="saveEdit(${e.id},'${dk(selDate)}')">✓ 保存</button>
    </div>
  </div>`;
  return wrap;
}

function toggleEditSkip(fid){editState.skipped[fid]=!editState.skipped[fid];if(editState.skipped[fid])delete editState.fields[fid];openDropId=null;renderAll()}
function toggleEditDrop(fid){openDropId=openDropId===('ed-'+fid)?null:('ed-'+fid);renderAll()}
function pickEditOpt(fid,val){editState.fields[fid]=val;openDropId=null;renderAll()}
function addEditOpt(fid){
  const inp=document.getElementById('edsd-'+fid);if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const px=projects.find(pr=>pr.fields&&pr.fields.some(f=>f.id===fid));
  if(px){const f=px.fields.find(x=>x.id===fid);if(f&&!f.options.includes(v))f.options.push(v);}
  editState.fields[fid]=v;openDropId=null;renderAll();
}
function cancelEdit(){editingId=null;editState={};openDropId=null;renderAll()}
function saveEdit(id,key){
  const e=(entries[key]||[]).find(x=>x.id===id);if(!e)return;
  e.title=editState.title||e.title;
  e.fields={...editState.fields};e.skipped={...editState.skipped};
  e.note=editState.note||'';e.link=editState.link||'';e.linkLabel=editState.linkLabel||'';
  editingId=null;editState={};openDropId=null;saveData();renderAll();
}
function deleteEntry(key,id){
  entries[key]=(entries[key]||[]).filter(e=>e.id!==id);
  if(editingId===id){editingId=null;editState={};}
  saveData();renderAll();
}

function buildNewForm(){
  const wrap=document.createElement('div');wrap.className='form-card';
  const p=formProj?proj(formProj):null;
  let ppHTML='';
  if(showProjPicker){
    ppHTML=`<div class="proj-picker"><div style="font-size:11px;font-weight:700;color:var(--mid);margin-bottom:6px">选择 project</div>
    <div>${projects.map(pr=>`<div class="pp-item${formProj===pr.id?' sel':''}" onclick="selectProj('${pr.id}')"><div style="width:8px;height:8px;border-radius:50%;background:${pr.color};flex-shrink:0"></div>${pr.name}</div>`).join('')}</div></div>`;
  }
  let dynHTML='';
  if(p&&p.fields&&p.fields.length){
    dynHTML='<div class="var-rows">';
    p.fields.forEach(f=>{
      const isSkip=skippedFields[f.id],curVal=window._fv&&window._fv[f.id]||'',isOpen=openDropId===('new-'+f.id);
      if(f.type==='number'){
        dynHTML+=`<div class="var-row"><span class="var-label">${f.label}</span>
          <div class="var-val">${isSkip?`<span class="skipped-label">已跳过</span>`:`<input type="number" id="ff-${f.id}" placeholder="0" min="0" style="width:90px;font-size:13px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.25);border-radius:8px;padding:5px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none">`}</div>
          <button class="skip-btn${isSkip?' skipped':''}" onclick="toggleSkip('${f.id}')">${isSkip?'＋':'✕'}</button></div>`;
      } else {
        dynHTML+=`<div class="var-row"><span class="var-label">${f.label}</span>
          <div class="var-val">${isSkip?`<span class="skipped-label">已跳过</span>`:`<div class="sel-wrap">
            <button class="sel-btn" onclick="toggleNewDrop('${f.id}')"><span style="color:${curVal?'var(--dark)':'var(--mid)'}">${curVal||'选择…'}</span><span style="opacity:.4">▾</span></button>
            ${isOpen?`<div class="sel-dropdown">${f.options.map(o=>`<div class="sd-opt${curVal===o?' sel':''}" onclick="pickNewOpt('${f.id}','${o}')">${o}${curVal===o?' ✓':''}</div>`).join('')}<div class="sd-add"><input type="text" id="sdnew-${f.id}" placeholder="添加新选项…" onclick="event.stopPropagation()"><button class="sd-add-btn" onclick="addNewOpt('${f.id}')">添加</button></div></div>`:''}</div>`}</div>
          <button class="skip-btn${isSkip?' skipped':''}" onclick="toggleSkip('${f.id}')">${isSkip?'＋':'✕'}</button></div>`;
      }
    });
    dynHTML+='</div>';
  }

  const previewCoins=3+(formExtras.note?1:0)+(formExtras.link?1:0);
  wrap.innerHTML=`${ppHTML}
    <div class="form-row">
      <input type="text" id="f-title" placeholder="今天做了什么…" style="font-weight:700" oninput="formTitle=this.value">
      <button class="proj-sel-btn" onclick="toggleProjPicker()">
        ${p?`<div style="width:8px;height:8px;border-radius:50%;background:${p.color}"></div>${p.name}`:'＋ 选择 project'}
        <span style="opacity:.4;margin-left:2px">▾</span>
      </button>
    </div>
    ${dynHTML}
    <div class="extras-row">
      <div class="extra-toggle${formExtras.note?' on':''}" onclick="toggleExtra('note')">📝 备注</div>
      <div class="extra-toggle${formExtras.link?' on':''}" onclick="toggleExtra('link')">🔗 链接</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:8px">
      ${formExtras.note?`<textarea class="ie-textarea" id="f-note" rows="2" placeholder="补充说明、心得…"></textarea>`:''}
      ${formExtras.link?`<div style="display:flex;gap:6px"><input type="url" id="f-link" placeholder="https://…" style="flex:2;font-size:12px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.2);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none"><input type="text" id="f-linklabel" placeholder="标签" style="flex:1;font-size:12px;font-family:'Nunito',sans-serif;border:0.5px solid rgba(123,104,238,0.2);border-radius:8px;padding:6px 8px;background:rgba(255,255,255,0.9);color:var(--dark);outline:none"></div>`:''}
    </div>
    <div class="coin-preview">🐾 预计获得 <strong id="coin-preview">${previewCoins}</strong> Cat Token</div>
    <div class="form-btns">
      <button class="f-cancel" onclick="cancelForm()">取消</button>
      <button class="f-save" onclick="saveEntry()">✓ 记录下来</button>
    </div>`;
  return wrap;
}

function toggleSkip(fid){skippedFields[fid]=!skippedFields[fid];if(skippedFields[fid]&&window._fv)delete window._fv[fid];openDropId=null;renderAll()}
function toggleNewDrop(fid){openDropId=openDropId===('new-'+fid)?null:('new-'+fid);renderAll()}
function pickNewOpt(fid,val){if(!window._fv)window._fv={};window._fv[fid]=val;openDropId=null;renderAll()}
function addNewOpt(fid){
  const inp=document.getElementById('sdnew-'+fid);if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const px=proj(formProj);const f=px&&px.fields&&px.fields.find(x=>x.id===fid);
  if(f&&!f.options.includes(v))f.options.push(v);
  if(!window._fv)window._fv={};window._fv[fid]=v;openDropId=null;renderAll();
}
function toggleProjPicker(){showProjPicker=!showProjPicker;renderAll()}
function selectProj(id){formProj=id;showProjPicker=false;window._fv={};skippedFields={};openDropId=null;renderAll();}
function toggleExtra(k){formExtras[k]=!formExtras[k];renderAll()}

function openForm(){
  if(dk(selDate)!==todayKey)selDate=new Date(today);
  formTitle='';showForm=true;view='journal';showProjPicker=false;window._fv={};skippedFields={};openDropId=null;editingId=null;renderAll();
  setTimeout(()=>{const el=document.getElementById('f-title');if(el)el.focus()},50);
}
function cancelForm(){formTitle='';showForm=false;showProjPicker=false;formExtras={note:false,link:false};window._fv={};skippedFields={};openDropId=null;renderAll()}

function saveEntry(){
  const titleEl=document.getElementById('f-title');
  const t=(titleEl?titleEl.value.trim():'')||formTitle.trim();
  if(!t){
    if(titleEl){
      titleEl.style.borderColor='var(--pink)';
      titleEl.style.boxShadow='0 0 0 3px rgba(255,63,108,0.15)';
      titleEl.placeholder='请先写下今天做了什么…';
      titleEl.focus();
      setTimeout(()=>{titleEl.style.borderColor='rgba(123,104,238,0.25)';titleEl.style.boxShadow='none';titleEl.placeholder='今天做了什么…'},2000);
    }
    return;
  }
  const p=formProj?proj(formProj):null;
  const fields={},skipped={...skippedFields};
  if(p&&p.fields){
    p.fields.forEach(f=>{
      if(skipped[f.id])return;
      if(f.type==='number'){const el=document.getElementById('ff-'+f.id);if(el&&el.value)fields[f.id]=el.value;}
      else{const v=window._fv&&window._fv[f.id];if(v)fields[f.id]=v;}
    });
  }
  const note=formExtras.note?(document.getElementById('f-note')||{}).value?.trim()||'':'';
  const link=formExtras.link?(document.getElementById('f-link')||{}).value?.trim()||'':'';
  const linklabel=formExtras.link?(document.getElementById('f-linklabel')||{}).value?.trim()||'':'';
  if(!entries[todayKey])entries[todayKey]=[];
  entries[todayKey].push({id:Date.now(),projId:formProj||'',title:t,fields,skipped,note,link,linkLabel:linklabel});
  formTitle='';showForm=false;showProjPicker=false;formExtras={note:false,link:false};window._fv={};skippedFields={};openDropId=null;
  saveData();renderAll();
}

// PROJECTS MODAL
function openAddProject(){modal={mode:'add',name:'',color:COLORS[0],fields:[],nf:'',nft:'number'};renderModal()}
function openEditProject(id){const p=proj(id);modal={mode:'edit',pid:id,name:p.name,color:p.color,fields:p.fields.map(f=>({...f,options:[...(f.options||[])]})),nf:'',nft:'number'};renderModal()}

function renderModal(){
  const mc=document.getElementById('modal-container');
  if(!modal){mc.innerHTML='';return;}
  const m=modal;
  mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this){modal=null;renderModal()}">
  <div class="modal">
    <div class="modal-title">${m.mode==='add'?'新建 project':'编辑 project'}</div>
    <div class="modal-lbl">名称</div>
    <input type="text" id="m-name" value="${m.name}" placeholder="Project 名称" oninput="modal.name=this.value">
    <div class="modal-lbl">颜色</div>
    <div class="swatches">${COLORS.map(c=>`<div class="swatch${m.color===c?' sel':''}" style="background:${c}" onclick="modal.color='${c}';renderModal()"></div>`).join('')}</div>
    <div class="modal-lbl">Variables（自定义栏位）</div>
    <div>${m.fields.map((f,i)=>`<div class="mfl-item"><div style="width:6px;height:6px;border-radius:50%;background:${m.color}"></div><span>${f.label}</span><span style="font-size:10px;color:var(--mid);margin-left:3px">${f.type==='select'?'选项':'数字'}</span>${f.type==='select'&&f.options.length?`<span style="font-size:10px;color:var(--mid)"> · ${f.options.slice(0,3).join('、')}</span>`:''}<button class="mfl-del" onclick="removeField(${i})">✕</button></div>`).join('')}</div>
    <div class="ftype-row">
      <div class="ftype-btn${m.nft==='number'?' sel':''}" onclick="modal.nft='number';renderModal()">数字</div>
      <div class="ftype-btn${m.nft==='select'?' sel':''}" onclick="modal.nft='select';renderModal()">选项</div>
    </div>
    <div class="add-field-row">
      <input type="text" id="m-field" placeholder="${m.nft==='number'?'如 Sessions、时长':'如 工具、阶段'}" oninput="modal.nf=this.value" value="${m.nf}">
      <button class="add-field-btn" onclick="addField()">＋ 添加</button>
    </div>
    <div class="modal-btns">
      ${m.mode==='edit'?`<button class="m-delete" onclick="deleteProject('${m.pid}')">删除</button>`:''}
      <button class="m-cancel" onclick="modal=null;renderModal()">取消</button>
      <button class="m-save" onclick="saveProject()">保存</button>
    </div>
  </div></div>`;
}
function addField(){if(!modal.nf.trim())return;modal.fields.push({id:'f'+Date.now(),label:modal.nf.trim(),type:modal.nft,options:[]});modal.nf='';renderModal()}
function removeField(i){modal.fields.splice(i,1);renderModal()}
function saveProject(){
  if(!modal.name.trim())return;
  if(modal.mode==='add')projects.push({id:'p'+Date.now(),name:modal.name,color:modal.color,fields:modal.fields});
  else{const p=projects.find(x=>x.id===modal.pid);if(p){p.name=modal.name;p.color=modal.color;p.fields=modal.fields;}}
  modal=null;renderModal();saveData();renderAll();
}
function deleteProject(id){projects=projects.filter(p=>p.id!==id);modal=null;renderModal();saveData();renderAll()}

// STATS
function renderStats(){
  document.getElementById('page-date').textContent='周报告';
  const area=document.getElementById('main-area');area.innerHTML='';
  const ws=getWeekStart();
  const perDay=[];let totalE=0,totalC=0;const projStats={};
  for(let i=0;i<7;i++){
    const d=new Date(ws);d.setDate(d.getDate()+i);
    const list=entries[dk(d)]||[];totalE+=list.length;
    list.forEach(e=>{
      totalC+=calcCoins(e);
      if(!projStats[e.projId])projStats[e.projId]={count:0,fields:{}};
      projStats[e.projId].count++;
      const p=proj(e.projId);
      (p.fields||[]).forEach(f=>{
        if(e.skipped&&e.skipped[f.id])return;
        const v=e.fields&&e.fields[f.id];if(!v)return;
        if(f.type==='number'){const n=parseFloat(v);if(!isNaN(n)){if(!projStats[e.projId].fields[f.id])projStats[e.projId].fields[f.id]={label:f.label,total:0};projStats[e.projId].fields[f.id].total+=n;}}
        else{if(!projStats[e.projId].fields[f.id])projStats[e.projId].fields[f.id]={label:f.label,vals:{}};projStats[e.projId].fields[f.id].vals[v]=(projStats[e.projId].fields[f.id].vals[v]||0)+1;}
      });
    });
    perDay.push({d,cnt:list.length});
  }
  const maxC=Math.max(...perDay.map(x=>x.cnt),1);
  const todayI=perDay.findIndex(x=>dk(x.d)===todayKey);
  const cat=document.createElement('div');cat.className='cat66-bar';
  cat.innerHTML=`<span style="font-size:24px">${totalE>=10?'(=^▽^=)':totalE>=5?'ᓚᘏᗢ':'=^.^='}</span><div>这周完成了 <strong>${totalE}</strong> 条记录，共赚了 <strong>${totalC}</strong> Cat Token<br><span style="font-size:11px">66 为你骄傲！</span></div>`;
  area.appendChild(cat);
  const wb=document.createElement('div');wb.className='stats-bars';
  perDay.forEach((x,i)=>{
    const pct=Math.round(x.cnt/maxC*100),isT=i===todayI;
    const col=document.createElement('div');col.className='wbar-col'+(isT?' today':'');
    col.innerHTML=`<div class="wbar-bg"><div class="wbar-in" style="height:${pct}%"></div></div><div class="wbar-lbl">${DAYS[x.d.getDay()]}</div>`;
    wb.appendChild(col);
  });
  area.appendChild(wb);
  const sl=document.createElement('div');sl.className='sec-label';sl.textContent='Projects 统计';area.appendChild(sl);
  const maxP=Math.max(...Object.values(projStats).map(x=>x.count),1);
  Object.keys(projStats).forEach(pid=>{
    const p=proj(pid),ps=projStats[pid];
    const row=document.createElement('div');row.className='proj-stat-row';
    let val=`${ps.count} 次`;
    const ex=[];
    Object.values(ps.fields).forEach(fs=>{
      if(fs.total!==undefined)ex.push(`${fs.label} ${Math.round(fs.total)}`);
      else if(fs.vals){const top=Object.entries(fs.vals).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,v])=>`${k}×${v}`).join('、');if(top)ex.push(top);}
    });
    if(ex.length)val+=` · ${ex.join(' · ')}`;
    const pct=Math.round(ps.count/maxP*100);
    row.innerHTML=`<div class="psr-name"><div style="width:7px;height:7px;border-radius:50%;background:${p.color};flex-shrink:0"></div>${p.name}</div><div class="psr-track"><div class="psr-fill" style="width:${pct}%;background:${p.color}"></div></div><div class="psr-val">${val}</div>`;
    area.appendChild(row);
  });
}

document.getElementById('stats-btn').onclick=()=>{view='stats';showForm=false;renderAll()};
document.getElementById('stats-nav-btn').onclick=()=>{view='stats';showForm=false;renderAll()};

document.getElementById('page-date').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · '+WD[d.getDay()]+' · 今天';

renderAll();
